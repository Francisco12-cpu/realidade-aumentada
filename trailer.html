<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Escola Zumbi: trailer</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
    }
  }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #050505; color: #ddd; font: 15px system-ui, sans-serif; }
    #wrap { position: fixed; inset: 0 0 64px 0; display: flex; align-items: center; justify-content: center; }
    #gl { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; width: 100%; background: #000; }
    #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; display: flex; gap: 10px; align-items: center; padding: 0 14px; background: #111; }
    button, a.btn { font: 600 15px system-ui; padding: 10px 16px; border-radius: 8px; border: 1px solid #444; background: #222; color: #eee; cursor: pointer; text-decoration: none; }
    button:disabled { opacity: 0.4; }
    #rec { background: #7a1010; border-color: #a22; }
    #status { flex: 1; opacity: 0.85; }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="gl" width="1920" height="1080"></canvas></div>
  <div id="bar">
    <button id="play" disabled>▶ Assistir</button>
    <button id="rec" disabled>⏺ Gravar trailer</button>
    <a id="download" class="btn" hidden>⬇ Baixar</a>
    <span id="status">Carregando…</span>
    <span id="time"></span>
  </div>
  <script type="module" src="js/trailer.js"></script>
</body>
</html>
