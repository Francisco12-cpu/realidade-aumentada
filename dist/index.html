// Calibração + tutorial (tela inicial).
// Protótipo de teste: os textos são longos de propósito.

// ---------------------------------------------------------------------
// Armazenamento (localStorage, sempre com try/catch)
// ---------------------------------------------------------------------
function defaultCalib() {
  return {
    version: 1,
    done: false,
    flipHandedness: CONFIG.HANDS.FLIP_HANDEDNESS,
    locomotion: 'left',
    thresholds: JSON.parse(JSON.stringify(CONFIG.GESTURE.DEFAULT_THRESHOLDS)),
    reach: null,
    depth: { rawNear: CONFIG.HANDS.RAW_NEAR, rawFar: CONFIG.HANDS.RAW_FAR },
    poses: {},
  };
}

function loadCalib() {
  try {
    const s = localStorage.getItem(CONFIG.STORAGE_KEY);
    if (!s) return null;
    const c = JSON.parse(s);
    if (!c || c.version !== 1) return null;
    const d = defaultCalib();
    return { ...d, ...c, thresholds: { ...d.thresholds, ...c.thresholds }, depth: { ...d.depth, ...c.depth } };
  } catch (e) { console.warn('Falha ao ler calibração', e); return null; }
}

function saveCalib(c) {
  try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(c)); return true; } catch (e) { console.warn('Falha ao salvar calibração', e); return false; }
}

function clearCalib() {
  try { localStorage.removeItem(CONFIG.STORAGE_KEY); } catch (e) { /* ignore */ }
}

// ---------------------------------------------------------------------
// Interface do overlay
// ---------------------------------------------------------------------
const POSES = [
  { id: 'neutral', name: 'Mão normal', how: 'Deixe a mão relaxada, meio aberta, do jeito que ela fica quando você não está fazendo nada. Esse é o estado "neutro": não faz nada no jogo.' },
  { id: 'gun', name: 'Pistolinha', how: 'Estique o INDICADOR para frente e o POLEGAR para cima. Dobre o médio, o anelar e o mínimo. Esse gesto MIRA o teleporte.' },
  { id: 'open', name: 'Palma aberta', how: 'Abra a mão toda, dedos esticados e separados, palma virada para frente. Depois da pistolinha, isso CONFIRMA o teleporte.' },
  { id: 'fist', name: 'Punho fechado', how: 'Feche a mão com força, todos os dedos dobrados, polegar por cima. Serve para PEGAR/SEGURAR.' },
  { id: 'pinch', name: 'Pinça', how: 'Encoste a ponta do POLEGAR na ponta do INDICADOR (como se fosse pegar um grão de arroz). Os outros dedos podem ficar soltos. Serve para PEGAR FIO e ARRASTAR.' },
];

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

class CalibrationFlow {
  constructor(app) {
    this.app = app;
    this.el = document.getElementById('overlay');
    this.liveTimer = null;
    this.samplesPoses = {};
  }

  _show(title, html, buttons = [], { compact = false } = {}) {
    this._stopLive();
    this.el.hidden = false;
    this.el.classList.toggle('compact', compact);
    // folha embaixo -> depuração/prévia vão para cima (e vice-versa)
    document.body.classList.toggle('sheet-bottom', !compact);
    this.el.innerHTML = `<div class="sheet"><h2>${title}</h2><div class="body">${html}</div><div class="live" id="live"></div><div class="btns"></div></div>`;
    const box = this.el.querySelector('.btns');
    for (const b of buttons) {
      const btn = document.createElement('button');
      btn.textContent = b.label;
      if (b.cls) btn.className = b.cls;
      btn.addEventListener('click', (e) => { e.stopPropagation(); b.onClick(btn); });
      box.appendChild(btn);
    }
  }

  _live(fn, ms = 120) {
    this._stopLive();
    const live = this.el.querySelector('#live');
    const tick = () => { if (live) live.innerHTML = fn(); };
    tick();
    this.liveTimer = setInterval(tick, ms);
  }

  _stopLive() { if (this.liveTimer) { clearInterval(this.liveTimer); this.liveTimer = null; } }

  hide() { this._stopLive(); this.el.hidden = true; this.el.innerHTML = ''; document.body.classList.remove('sheet-bottom'); }

  // Mão "ativa" para gravação: a única presente, ou a de maior confiança.
  _activeHand() {
    const hs = this.app.hands.hands.filter((h) => h.present);
    if (!hs.length) return null;
    return hs.sort((a, b) => b.score - a.score)[0];
  }

  _handStatus() {
    const hs = this.app.hands.hands.filter((h) => h.visible);
    if (!this.app.hands.landmarker) return '<span class="bad">Modelo das mãos não carregado.</span>';
    if (!hs.length) return '<span class="bad">Nenhuma mão detectada</span> — coloque a mão na frente da câmera traseira.';
    return hs.map((h) => `Mão <b>${h.side === 'left' ? 'esquerda' : 'direita'}</b>: ${GESTURE_LABELS[h.gesture]}`).join(' · ');
  }

  // Grava amostras enquanto houver mão, por durationMs (com contagem regressiva).
  async _record(btn, durationMs, onSample, countdown = 2) {
    if (btn) btn.disabled = true;
    const live = this.el.querySelector('#live');
    this._stopLive();
    for (let i = countdown; i > 0; i--) { if (live) live.innerHTML = `Prepare… <b>${i}</b>`; await sleep(700); }
    const t0 = performance.now();
    let last = null, n = 0;
    await new Promise((resolve) => {
      const step = () => {
        const now = performance.now();
        const res = this.app.hands.lastResult;
        if (res !== last) {
          last = res;
          const h = this._activeHand();
          if (h) { onSample(h, res); n++; }
        }
        const left = Math.max(0, durationMs - (now - t0));
        if (live) live.innerHTML = `Gravando… ${(left / 1000).toFixed(1)}s — amostras: <b>${n}</b>`;
        if (now - t0 < durationMs) requestAnimationFrame(step); else resolve();
      };
      requestAnimationFrame(step);
    });
    if (btn) btn.disabled = false;
    return n;
  }

  // ------------------------------------------------------------------
  // Passos
  // ------------------------------------------------------------------
  welcome() {
    const saved = loadCalib();
    const html = `
      <p><b>Protótipo de teste</b> das mecânicas do jogo <i>Caçador de Sinal</i>.</p>
      <p>A rede está falhando! Ache as <b>caixas pretas</b> (pontos de sinal), toque nelas com a mão e conecte os fios antes do tempo acabar.</p>
      <p>Para o primeiro teste, <b>segure o celular na frente dos olhos</b> com uma mão, com a câmera traseira apontando para frente. A outra mão fica na frente da câmera.</p>
      <p>O jogo vai pedir permissão para a <b>câmera</b> e para os <b>sensores de movimento</b>. Depois vem a calibração (uns 3 minutos) e um mini-tutorial.</p>
      ${saved ? '<p class="ok">✔ Existe uma calibração salva neste aparelho.</p>' : ''}
      ${this._optionsHtml()}
      <p class="small" id="map-status">${this.app.mapText}</p>
      <p class="small" id="offline"></p>
      <p class="small">Dica: o botão 🐞 mostra o painel de depuração (FPS, gestos, prévia da câmera).</p>`;
    const btns = [];
    if (saved) {
      btns.push({ label: 'Usar calibração salva → tutorial', cls: 'primary', onClick: () => this._startWithSaved(saved, 'tutorial') });
      btns.push({ label: 'Ir direto para a partida', onClick: () => this._startWithSaved(saved, 'game') });
      btns.push({ label: 'Recalibrar', onClick: () => this._startFresh() });
    } else {
      btns.push({ label: 'Começar', cls: 'primary', onClick: () => this._startFresh() });
    }
    btns.push({ label: 'Sem câmera (só botões)', onClick: () => this._startNoCamera() });
    btns.push({ label: '🏆 Ranking do dia', onClick: () => this.showRanking(() => this.welcome()) });
    btns.push({ label: '❓ Ajuda do óculos', onClick: () => this.showHelp(() => this.welcome()) });
    this._show(`Caçador de Sinal — teste <span class="small">${CONFIG.VERSION}</span>`, html, btns);
    this._wireOptions(() => this.welcome());
    this._checkOffline();
  }

  // Tela entre um visitante e outro (calibração e permissões continuam valendo).
  nextPlayer() {
    const feira = this.app.options.feira;
    const html = `
      <p><b>Próximo jogador!</b> Ache as caixas pretas, toque nelas com a ponta do dedo e ligue os fios da mesma cor.</p>
      <p>${feira ? `Partida de <b>${Math.round(CONFIG.FEIRA.GAME_TIME_S / 60)} min</b> com <b>${CONFIG.FEIRA.TARGETS.length} caixas</b>.` : ''}
      Siga o <b>bipe</b>: quanto mais rápido, mais perto. Perto da caixa ela solta <b>faíscas</b>.</p>
      ${this._optionsHtml()}
      <p class="small" id="map-status">${this.app.mapText}</p>
      <p class="small" id="offline"></p>`;
    const ready = this.app.devicesReady;
    const go = (next) => {
      if (ready) { this.app.orientation.recenter(); if (next === 'tutorial') this.app.startTutorial(); else this.app.startGame(); return; }
      const saved = loadCalib();
      if (saved) this._startWithSaved(saved, next); else this._startFresh();
    };
    this._show('👤 Próximo jogador', html, [
      { label: 'Tutorial rápido →', cls: 'primary', onClick: () => go('tutorial') },
      { label: 'Direto para a partida', onClick: () => go('game') },
      { label: '🏆 Ranking do dia', onClick: () => this.showRanking(() => this.nextPlayer()) },
      { label: 'Recalibrar (mão diferente)', onClick: () => this.app.recalibrate() },
      { label: 'Tela inicial', onClick: () => this.welcome() },
    ]);
    this._wireOptions(() => this.nextPlayer());
    this._checkOffline();
  }

  // Ranking do dia (só deste celular). Apagar pede dois toques, sem janela de confirmação.
  showRanking(back) {
    const feira = this.app.options.feira;
    let armed = false;
    this._show(`🏆 Ranking de hoje${feira ? ' (modo feira)' : ''}`, `
      <div id="rank-table">${rankingTable(feira)}</div>
      <p class="small">Pontos: 100 por caixa consertada + 2 por segundo que sobrou (quando conserta todas). Fica guardado só neste celular.</p>`, [
      { label: '← Voltar', cls: 'primary', onClick: back },
      { label: '🗑 Apagar ranking de hoje', onClick: (btn) => {
        if (!armed) { armed = true; btn.textContent = 'Toque de novo para apagar'; setTimeout(() => { armed = false; btn.textContent = '🗑 Apagar ranking de hoje'; }, 3000); return; }
        clearToday(feira);
        this.showRanking(back);
      } },
    ]);
  }

  // Botões liga/desliga das opções (som, vibração, vinheta, modo feira).
  _optionsHtml() {
    const o = this.app.options;
    const opt = (key, on, off) => `<button class="opt ${o[key] ? 'on' : ''}" data-opt="${key}">${o[key] ? on : off}</button>`;
    return `<div class="opts">
      ${opt('feira', '🎪 Modo feira: ligado', '🎪 Modo feira: desligado')}
      ${opt('sound', '🔊 Som', '🔇 Sem som')}
      ${opt('vibrate', '📳 Vibração', '📴 Sem vibração')}
      ${opt('vignette', '🌑 Escurecer bordas ao andar', '⚪ Bordas normais ao andar')}
    </div>
    <p class="small">Modo feira: partida de ${Math.round(CONFIG.FEIRA.GAME_TIME_S / 60)} min, ${CONFIG.FEIRA.TARGETS.length} caixas, tutorial curto e volta sozinho para o próximo jogador.</p>`;
  }

  _wireOptions(redraw) {
    for (const b of this.el.querySelectorAll('[data-opt]')) {
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        const k = b.dataset.opt;
        this.app.setOption(k, !this.app.options[k]);
        if (k === 'sound' && this.app.options.sound) { this.app.sfx.unlock(); setTimeout(() => this.app.sfx.wire(true), 50); }
        if (k === 'vibrate' && this.app.options.vibrate) this.app.sfx.vibrate(60);
        redraw();
      });
    }
  }

  // Mostra se o jogo inteiro (com o modelo das mãos) já está guardado para usar sem internet.
  async _checkOffline() {
    const el = this.el.querySelector('#offline');
    if (!el) return;
    if (!('caches' in window) || !navigator.serviceWorker || !navigator.serviceWorker.controller) {
      if (location.hostname === 'localhost' || /^\d+\.\d+\.\d+\.\d+$/.test(location.hostname)) el.textContent = '💻 Rodando pelo servidor do PC.';
      else el.textContent = '📶 Na primeira vez precisa de internet. Abra o jogo de novo para ele ficar guardado.';
      return;
    }
    try {
      const keys = await caches.keys();
      let ok = false;
      for (const k of keys) {
        const c = await caches.open(k);
        if (await c.match('https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', { ignoreVary: true })) { ok = true; break; }
      }
      el.innerHTML = ok ? '<span class="ok">✔ Jogo guardado: funciona sem internet.</span>' : '📶 Guardando o jogo para usar sem internet… (deixe a internet ligada mais um pouco)';
    } catch (e) { el.textContent = ''; }
  }

  async _init(withCamera = true) {
    this._show('Preparando…', '<p>Pedindo permissões e carregando o rastreamento das mãos. Isso pode levar alguns segundos na primeira vez.</p>', []);
    const live = this.el.querySelector('#live');
    const ok = await this.app.initDevices((msg) => { if (live) live.innerHTML = msg; }, withCamera);
    return ok;
  }

  _showInitError(retry) {
    this._show('Não deu para iniciar', `
      <p class="bad">${this.app.lastError}</p>
      <p>Confira: o link precisa ser <b>https://</b>, a permissão da câmera precisa ser aceita (cadeado na barra de endereço → Permissões) e a internet precisa estar funcionando para baixar o MediaPipe.</p>`, [
      { label: 'Tentar de novo', cls: 'primary', onClick: retry },
      { label: 'Continuar só com botões', onClick: () => { this.app.orientation.recenter(); this.app.startTutorial(); } },
    ]);
  }

  async _startWithSaved(saved, next) {
    Object.assign(this.app.calib, saved);
    if (!(await this._init(true))) { this._showInitError(() => this._startWithSaved(saved, next)); return; }
    this.app.orientation.recenter();
    if (next === 'tutorial') this.app.startTutorial(); else this.app.startGame();
  }

  async _startNoCamera() {
    await this._init(false);
    this.app.orientation.recenter();
    this.app.startTutorial();
  }

  async _startFresh() {
    Object.assign(this.app.calib, defaultCalib());
    this.app.state = 'calibration';
    if (!(await this._init(true))) { this._showInitError(() => this._startFresh()); return; }
    this.app.setDebug(true);
    this.stepRecenter();
  }

  stepRecenter() {
    const o = this.app.orientation;
    this._show('1. Direção da visão', `
      <p>Segure o celular em pé, na frente dos olhos, e olhe para frente (para onde você quer que seja a "frente" do jogo).</p>
      <p>Depois toque em <b>Recentrar</b>. Gire o corpo devagar: o mundo 3D deve girar junto.</p>
      <p class="small">Você pode recentrar a qualquer momento pelo botão ⟲ na tela.</p>`, [
      { label: 'Recentrar', cls: 'primary', onClick: () => { o.recenter(); this.app.toast('Direção recentrada'); } },
      { label: 'Próximo →', onClick: () => this.stepHandedness() },
    ]);
    this._live(() => `Sensor: <b>${o.source}</b> · ${o.hasData ? '<span class="ok">recebendo dados</span>' : '<span class="bad">sem dados (no PC, arraste a tela)</span>'}`);
  }

  stepHandedness() {
    const calib = this.app.calib;
    this._show('2. Qual é a mão esquerda?', `
      <p>A câmera traseira não espelha a imagem, então às vezes o sistema confunde esquerda e direita. Vamos conferir.</p>
      <p>Mostre <b>só a sua mão ESQUERDA</b> para a câmera (palma ou costas, tanto faz) e toque em <b>Gravar</b>. Se você segura o celular com a esquerda, troque de mão por um instante.</p>`, [
      {
        label: 'Gravar (mão esquerda)', cls: 'primary', onClick: async (btn) => {
          let left = 0, right = 0;
          await this._record(btn, 1500, (h, res) => {
            const handed = res.handedness || res.handednesses || [];
            for (const cat of handed) { if (cat[0] && cat[0].categoryName === 'Left') left++; else right++; }
          });
          if (left + right < 5) { this.app.toast('Poucas amostras — tente de novo com a mão bem visível'); return; }
          // Se o MediaPipe chamou a mão esquerda real de "Left", não precisa inverter.
          calib.flipHandedness = !(left > right);
          this.app.toast(`Rótulo do MediaPipe: ${left > right ? 'Left' : 'Right'} → inverter = ${calib.flipHandedness ? 'sim' : 'não'}`);
          this.stepLocomotion();
        },
      },
      { label: 'Pular (padrão)', onClick: () => this.stepLocomotion() },
    ]);
    this._live(() => this._handStatus());
  }

  stepLocomotion() {
    const calib = this.app.calib;
    const set = (side) => { calib.locomotion = side; this.stepPose(0); };
    this._show('3. Mão de locomoção', `
      <p>Uma mão serve para <b>andar</b> (teleporte com pistolinha + palma aberta) e a outra para <b>interagir</b> (tocar caixas, detector de sinal, pinça nos fios).</p>
      <p>Qual mão você quer usar para <b>andar</b>?</p>
      <p class="small">Teste com o celular na mão: use a mão livre para tudo — dá para trocar depois recalibrando.</p>`, [
      { label: 'Esquerda anda (padrão)', cls: calib.locomotion === 'left' ? 'primary' : '', onClick: () => set('left') },
      { label: 'Direita anda', cls: calib.locomotion === 'right' ? 'primary' : '', onClick: () => set('right') },
    ]);
    this._live(() => this._handStatus());
  }

  stepPose(i) {
    if (i >= POSES.length) { this._applyPoses(); this.stepReach(); return; }
    const pose = POSES[i];
    this._show(`4. Gestos (${i + 1}/${POSES.length}): ${pose.name}`, `
      <p>${pose.how}</p>
      <p>Faça a pose com a mão livre, bem na frente da câmera, e toque em <b>Gravar</b>. Depois de 2 segundos ele grava por 1,5 s — mantenha a pose e mexa a mão um pouquinho.</p>`, [
      {
        label: 'Gravar', cls: 'primary', onClick: async (btn) => {
          const list = [];
          const n = await this._record(btn, 1500, (h) => { if (h.wlm) list.push(computeFeatures(h.wlm)); });
          if (n < 5) { this.app.toast('Poucas amostras — a mão precisa estar visível'); return; }
          this.samplesPoses[pose.id] = averageFeatures(list);
          this.stepPose(i + 1);
        },
      },
      { label: 'Pular', onClick: () => this.stepPose(i + 1) },
      ...(i > 0 ? [{ label: '← Voltar', onClick: () => this.stepPose(i - 1) }] : []),
    ]);
    this._live(() => {
      const h = this._activeHand();
      if (!h || !h.wlm) return this._handStatus();
      const f = computeFeatures(h.wlm);
      const g = classify(f, this.app.calib.thresholds).gesture;
      return `Reconhecido agora (limiares atuais): <b>${GESTURE_LABELS[g]}</b><br><span class="small">dedos ${f.straight.map((s) => s.toFixed(2)).join(' ')} · polegar ${f.thumbOut.toFixed(2)} · pinça ${f.pinch.toFixed(2)}</span>`;
    });
  }

  _applyPoses() {
    const calib = this.app.calib;
    calib.poses = this.samplesPoses;
    calib.thresholds = thresholdsFromPoses(this.samplesPoses, CONFIG.GESTURE.DEFAULT_THRESHOLDS);
  }

  stepReach() {
    const calib = this.app.calib;
    this._show('5. Alcance da mão', `
      <p>Agora vamos ver até onde sua mão chega na imagem da câmera.</p>
      <p>Toque em <b>Gravar alcance</b> e, durante 5 segundos, mova a mão livre devagar por toda a área: <b>canto de cima, de baixo, esquerda e direita</b>, sem esticar até sair da imagem.</p>
      <p class="small">Isso faz a mão virtual cobrir a tela toda mesmo que seu braço não alcance a borda da câmera.</p>`, [
      {
        label: 'Gravar alcance', cls: 'primary', onClick: async (btn) => {
          const us = [], vs = [];
          await this._record(btn, 5000, (h) => { us.push(h.uv.x); vs.push(h.uv.y); }, 1);
          if (us.length < 20) { this.app.toast('Poucas amostras — tente de novo'); return; }
          us.sort((a, b) => a - b); vs.sort((a, b) => a - b);
          const q = (arr, p) => arr[Math.floor((arr.length - 1) * p)];
          const r = { uMin: q(us, 0.03), uMax: q(us, 0.97), vMin: q(vs, 0.03), vMax: q(vs, 0.97) };
          if (r.uMax - r.uMin < 0.25 || r.vMax - r.vMin < 0.25) { this.app.toast('Movimento pequeno demais — cubra mais área'); return; }
          calib.reach = r;
          this.stepDepth();
        },
      },
      { label: 'Pular (usar imagem inteira)', onClick: () => { calib.reach = null; this.stepDepth(); } },
    ]);
    this._live(() => this._handStatus());
  }

  stepDepth() {
    const calib = this.app.calib;
    const median = (a) => { const s = a.slice().sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };
    let near = null, far = null;
    const finish = () => {
      if (near && far && far > near * 1.25) {
        calib.depth = { rawNear: near, rawFar: far };
        this.app.toast('Profundidade calibrada');
      } else if (near && far) {
        this.app.toast('Diferença perto/longe pequena — usando valores padrão');
      }
      this.stepDone();
    };
    this._show('6. Perto e longe', `
      <p>O jogo estima a distância da mão pelo tamanho dela na imagem.</p>
      <p>1) Mão <b>PERTO</b>: braço encolhido, mão a uns 20 cm do celular → <b>Gravar perto</b>.</p>
      <p>2) Mão <b>LONGE</b>: braço esticado → <b>Gravar longe</b>.</p>`, [
      {
        label: 'Gravar perto', cls: 'primary', onClick: async (btn) => {
          const a = []; await this._record(btn, 1500, (h) => a.push(h.rawDepth));
          if (a.length >= 5) { near = median(a); btn.textContent = `Perto ✔ (${near.toFixed(2)})`; }
        },
      },
      {
        label: 'Gravar longe', cls: 'primary', onClick: async (btn) => {
          const a = []; await this._record(btn, 1500, (h) => a.push(h.rawDepth));
          if (a.length >= 5) { far = median(a); btn.textContent = `Longe ✔ (${far.toFixed(2)})`; }
        },
      },
      { label: 'Concluir →', onClick: finish },
    ]);
    this._live(() => {
      const h = this._activeHand();
      return h ? `Estimativa bruta agora: <b>${h.rawDepth.toFixed(2)}</b> (aumenta quando a mão se afasta)` : this._handStatus();
    });
  }

  stepDone() {
    const calib = this.app.calib;
    calib.done = true;
    const saved = saveCalib(calib);
    const t = calib.thresholds;
    this._show('Calibração pronta!', `
      <p>${saved ? 'Calibração <b>salva</b> neste aparelho.' : '<span class="bad">Não foi possível salvar</span> (navegador bloqueou o armazenamento) — vale só nesta sessão.'}</p>
      <p class="small">Mão de locomoção: <b>${calib.locomotion === 'left' ? 'esquerda' : 'direita'}</b> · inverter rótulos: ${calib.flipHandedness ? 'sim' : 'não'}<br>
      Limiares — dedos: ${t.ext.map((x) => x.toFixed(2)).join(' ')} · polegar: ${t.thumbOut.toFixed(2)} · pinça: ${t.pinch.toFixed(2)} · punho: ${t.fistIndex.toFixed(2)}<br>
      Alcance: ${calib.reach ? 'calibrado' : 'imagem inteira'} · profundidade: ${calib.depth.rawNear.toFixed(2)} → ${calib.depth.rawFar.toFixed(2)}</p>
      <p>Agora um mini-tutorial guiado.</p>`, [
      { label: 'Ir para o tutorial →', cls: 'primary', onClick: () => { this.app.setDebug(false); this.app.startTutorial(); } },
      { label: 'Refazer gestos', onClick: () => this.stepPose(0) },
    ]);
  }

  // ------------------------------------------------------------------
  // Ajuda do óculos
  // ------------------------------------------------------------------
  showHelp(back) {
    const app = this.app;
    if (app.stereo) app.setStereo(false);
    const prevState = app.state;
    const close = back || (() => { if (prevState === 'tutorial') app._refreshTutorial(); else this.hide(); });
    this._show('❓ Como usar no óculos', `
      <ol class="steps">
        <li><b>Abra a tampa da frente do óculos</b> (ou tire). A câmera traseira precisa <b>enxergar suas mãos</b>. Com a tampa fechada as mãos não funcionam, aí só os botões.</li>
        <li>Faça a <b>calibração e o tutorial fora do óculos</b> primeiro, segurando o celular na frente dos olhos.</li>
        <li>Toque em <b>👓 Óculos</b>. Se o celular tiver o <b>modo VR do Chrome</b>, ele abre e, na primeira vez, pede para <b>escanear o QR Code do seu óculos</b> (fica no óculos ou na caixa) — isso acerta as lentes sozinho. Sem QR, pode pular. Se não tiver esse modo, abre o modo próprio do jogo (tela cheia, deitada, dividida em duas).</li>
        <li>Encaixe o celular com a <b>linha do meio</b> (entre as duas imagens) bem no <b>centro do óculos</b>, na altura do nariz.</li>
        <li>Mexa nos <b>dois controles de cima do óculos</b> (os da sua foto):
          um aproxima/afasta as lentes — mexa até as <b>duas imagens virarem uma só</b>;
          o outro muda o foco — mexa até ficar <b>nítido</b>.</li>
        <li>Se ainda aparecer dobrado, torto ou com bordas curvas, use <b>🔧 Ajustar</b>: aparece uma grade com um anel vermelho para você acertar no jogo.</li>
        <li>Já no óculos, olhe para frente e toque na tela por fora → <b>⟲</b> (recentrar). No modo VR do Chrome, use o botão de voltar / ✕ da tela para sair.</li>
        <li><b>Para andar</b>: olhe para onde quer ir e <b>mostre a palma aberta</b> para a câmera — feche a mão para parar. Ou <b>segure o botão do óculos</b>.</li>
      </ol>
      <p class="small">Dicas: brilho da tela no máximo. Se o celular esquentar e o FPS cair, o jogo baixa a resolução sozinho. Para sair do modo óculos, toque na tela e use <b>👓 Óculos</b> de novo.</p>`, [
      { label: '👓 Entrar no modo óculos', cls: 'primary', onClick: () => { close(); app.toggleVR(); } },
      { label: '🔧 Ajustar óculos', onClick: () => this.showVrAdjust() },
      { label: 'Fechar', onClick: close },
    ]);
  }

  // ------------------------------------------------------------------
  // Ajuste do óculos (lentes, curvatura, campo de visão)
  // ------------------------------------------------------------------
  showVrAdjust() {
    const app = this.app, v = app.vrSettings;
    if (!app.stereo) app.setStereo(true);
    document.body.classList.add('vr-adjust');
    app.testPattern.visible = true;
    const prevState = app.state;
    const sliders = [
      { key: 'lensOffset', name: 'Distância entre as imagens', min: -0.3, max: 0.3, step: 0.005, fmt: (x) => `${(x * 100).toFixed(0)}` },
      { key: 'lensY', name: 'Altura das imagens', min: -0.3, max: 0.3, step: 0.005, fmt: (x) => `${(x * 100).toFixed(0)}` },
      { key: 'k1', name: 'Curvatura da lente', min: 0, max: 0.8, step: 0.01, fmt: (x) => x.toFixed(2) },
      { key: 'zoom', name: 'Ampliação', min: 0.55, max: 1.2, step: 0.01, invert: true, fmt: (x) => `${(1 / x).toFixed(2)}×` },
      { key: 'fov', name: 'Campo de visão', min: 60, max: 115, step: 1, fmt: (x) => `${x}°` },
      { key: 'ipd', name: 'Profundidade 3D (olhos)', min: 0.03, max: 0.09, step: 0.001, fmt: (x) => `${(x * 1000).toFixed(0)} mm` },
    ];
    const html = `
      <p class="small">Olhe pelo óculos: acerte até o <b>anel vermelho</b> virar um só e as <b>linhas da grade</b> ficarem retas. Ajuste um pouco, tire o celular, olhe de novo.</p>
      <div class="sliders">${sliders.map((sl) => {
        const val = sl.invert ? sl.max + sl.min - v[sl.key] : v[sl.key];
        return `<label class="slider"><span>${sl.name}</span><b id="sv-${sl.key}">${sl.fmt(v[sl.key])}</b>
          <input type="range" data-key="${sl.key}" min="${sl.min}" max="${sl.max}" step="${sl.step}" value="${val}"></label>`;
      }).join('')}</div>
      <label class="small"><input type="checkbox" id="sv-distortion" ${v.distortion ? 'checked' : ''}> Corrigir curvatura da lente</label><br>
      <label class="small"><input type="checkbox" id="sv-engine" ${v.engine !== 'proprio' ? 'checked' : ''}> Usar o modo VR do Chrome (QR Code do óculos) quando existir${app.xrSupported ? '' : ' — <i>não disponível neste aparelho</i>'}</label>
      <p class="small">Estes ajustes valem para o <b>modo próprio</b>. No modo VR do Chrome as lentes são acertadas pelo QR Code (ícone de engrenagem na tela do VR).</p>`;
    const done = () => {
      saveVrSettings(v);
      document.body.classList.remove('vr-adjust');
      app.testPattern.visible = false;
      if (prevState === 'tutorial') app._refreshTutorial(); else this.hide();
      app.toast('Ajustes do óculos salvos');
    };
    this._show('🔧 Ajustar óculos', html, [
      { label: '✔ Pronto', cls: 'primary', onClick: done },
      { label: 'Testar sem o painel', onClick: () => { saveVrSettings(v); document.body.classList.remove('vr-adjust'); app.showVrUi(6000); } },
      { label: 'Padrão', onClick: () => { Object.assign(v, defaultVrSettings()); saveVrSettings(v); this.showVrAdjust(); } },
    ]);
    this.el.querySelectorAll('input[type=range]').forEach((inp) => {
      inp.addEventListener('input', () => {
        const sl = sliders.find((x) => x.key === inp.dataset.key);
        let x = parseFloat(inp.value);
        if (sl.invert) x = sl.max + sl.min - x;
        v[sl.key] = x;
        if (sl.key === 'k1') v.k2 = x * 0.45;
        this.el.querySelector(`#sv-${sl.key}`).textContent = sl.fmt(x);
        if (sl.key === 'fov') app.resize();
        saveVrSettings(v);
      });
    });
    this.el.querySelector('#sv-distortion').addEventListener('change', (e) => { v.distortion = e.target.checked; saveVrSettings(v); });
    this.el.querySelector('#sv-engine').addEventListener('change', (e) => { v.engine = e.target.checked ? 'auto' : 'proprio'; saveVrSettings(v); });
  }

  // ------------------------------------------------------------------
  // Tutorial
  // ------------------------------------------------------------------
  showTutorial(progress) {
    const loco = this.app.calib.locomotion === 'left' ? 'esquerda' : 'direita';
    const inter = this.app.calib.locomotion === 'left' ? 'direita' : 'esquerda';
    const steps = [
      this.app.locoMode === 'palma'
        ? { done: progress.teleport, name: 'Andar', how: 'Olhe para onde quer ir e <b>mostre a palma aberta</b> para a câmera (qualquer mão): você anda. <b>Feche ou abaixe a mão</b> para parar. No óculos, <b>segurar o botão do óculos</b> também anda. Botão: 🏃 Andar.' }
        : this.app.locoMode === 'correr'
        ? { done: progress.teleport, name: 'Correr', how: 'Olhe para onde quer ir e <b>balance as mãos</b> na frente da câmera, como se estivesse correndo (ou <b>corra parado</b>). Quanto mais rápido, mais rápido você anda. Botão: 🏃 Correr.' }
        : { done: progress.teleport, name: 'Teleporte', how: `Mão ${loco}: <b>pistolinha</b> cobrindo o lugar do chão para onde quer ir, depois <b>abra a palma</b>. Botões: 🎯 Mirar + 🚀 Ir.` },
      { done: progress.touch, name: 'Tocar a caixa', how: `Chegue na caixa preta do pedestal cinza e encoste a <b>ponta do indicador</b> da mão ${inter}. Botão: 👆 Tocar.` },
      { done: progress.wire, name: 'Conectar o fio', how: 'No painel: <b>pinça</b> na bolinha colorida, arraste até o anel da mesma cor e solte. Também dá para arrastar com o dedo na tela.' },
    ];
    const current = steps.find((s) => !s.done);
    const chips = steps.map((s) => `<span class="chip ${s.done ? 'done' : s === current ? 'cur' : ''}">${s.done ? '✔' : '○'} ${s.name}</span>`).join('');
    this._show('Tutorial', `
      <div class="chips">${chips}</div>
      <p>${current ? current.how : '<b>Tudo certo!</b> Você já sabe andar, abrir caixas e conectar fios.'}</p>`, [
      { label: current ? 'Pular → partida' : 'Começar partida!', cls: current ? '' : 'primary', onClick: () => this.app.startGame() },
    ], { compact: true });
  }
}

// ===== js/debug.js =====
// Painel de depuração + botões na tela (alternativa a cada gesto) + teclado.

class DebugUI {
  constructor(app) {
    this.app = app;
    this.panel = document.getElementById('debug');
    this.stats = document.getElementById('debug-stats');
    this.preview = document.getElementById('preview');
    this.canvas = document.getElementById('cam2d');
    this.ctx = this.canvas.getContext('2d');
    this.enabled = false;
    this._t = 0;
    this._frames = 0;
    this._fpsT0 = performance.now();
    this.fps = 0;
    this.frameMs = 0;

    // Estado das entradas alternativas (lido pelo main.js)
    this.input = { aim: false, run: false, pinch: false, fist: false, keyAim: false, move: { f: 0, r: 0 } };
    this._wireButtons();
    this._wireKeyboard();
  }

  setEnabled(on) {
    this.enabled = on;
    this.panel.hidden = !on;
    this.preview.classList.toggle('offscreen', !on);
    document.getElementById('btn-debug').classList.toggle('on', on);
  }

  _btn(id, fn) {
    const el = document.getElementById(id);
    el.addEventListener('click', (e) => { e.stopPropagation(); fn(el); });
    return el;
  }

  _hold(id, key) {
    const el = document.getElementById(id);
    const on = (e) => { e.preventDefault(); e.stopPropagation(); this.input[key] = true; el.classList.add('on'); };
    const off = (e) => { e.preventDefault(); e.stopPropagation(); this.input[key] = false; el.classList.remove('on'); };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('pointerleave', off);
  }

  _wireButtons() {
    const app = this.app;
    this._btn('btn-recenter', () => { app.recenter(); app.toast('Direção recentrada'); });
    this._btn('btn-aim', (el) => { this.input.aim = !this.input.aim; el.classList.toggle('on', this.input.aim); });
    this._btn('btn-teleport', () => {
      app.teleport.tryJump(performance.now());
      this.input.aim = false;
      document.getElementById('btn-aim').classList.remove('on');
    });
    this._btn('btn-touch', () => { if (!app.interaction.openNearest()) app.toast('Nenhuma caixa perto (chegue a menos de 3 m)'); });
    this._hold('btn-run', 'run');
    this._hold('btn-pinch', 'pinch');
    this._hold('btn-fist', 'fist');
    this._btn('btn-stereo', () => app.toggleVR());
    this._btn('btn-vradjust', () => app.calibration.showVrAdjust());
    this._btn('btn-help', () => app.calibration.showHelp());
    this._btn('btn-sound', () => { app.setOption('sound', !app.options.sound); if (app.options.sound) { app.sfx.unlock(); app.sfx.wire(true); } app.toast(app.options.sound ? 'Som ligado' : 'Som desligado'); });
    this._btn('btn-full', () => {
      try {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
      } catch (e) { /* ignore */ }
    });
    this._btn('btn-debug', () => this.setEnabled(!this.enabled));
    this._btn('btn-calib', () => app.recalibrate());
  }

  _wireKeyboard() {
    // PC: Q segura = mirar, solta = teleportar · E = tocar · F segura = pinça
    // G segura = punho · R = recentrar · WASD = andar devagar (debug) · B = debug
    const app = this.app;
    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      const k = e.key.toLowerCase();
      if (k === 'q') this.input.keyAim = true;
      if (k === 'e') app.interaction.openNearest();
      if (k === 'f') this.input.pinch = true;
      if (k === 'g') this.input.fist = true;
      if (k === 'r') app.recenter();
      if (k === 'b') this.setEnabled(!this.enabled);
      if (k === 'w') this.input.move.f = 1;
      if (k === 's') this.input.move.f = -1;
      if (k === 'd') this.input.move.r = 1;
      if (k === 'a') this.input.move.r = -1;
    });
    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'q') { this.input.keyAim = false; app.teleport.tryJump(performance.now()); }
      if (k === 'f') this.input.pinch = false;
      if (k === 'g') this.input.fist = false;
      if (k === 'w' || k === 's') this.input.move.f = 0;
      if (k === 'a' || k === 'd') this.input.move.r = 0;
    });
  }

  // Chamado todo quadro
  frame(nowMs, dtMs) {
    this._frames++;
    this.frameMs = this.frameMs * 0.9 + dtMs * 0.1;
    if (nowMs - this._fpsT0 >= 500) {
      this.fps = (this._frames * 1000) / (nowMs - this._fpsT0);
      this._frames = 0;
      this._fpsT0 = nowMs;
      document.getElementById('fps').textContent = `${this.fps.toFixed(0)} FPS`;
    }
    if (!this.enabled) return;
    this._drawPreview();
    if (nowMs - this._t < 200) return;
    this._t = nowMs;
    this._writeStats();
  }

  _writeStats() {
    const a = this.app, h = a.hands, o = a.orientation, tp = a.teleport;
    const hand = (x) => {
      if (!x.visible) return `<div><b>${x.side === 'left' ? 'Esquerda' : 'Direita'}</b>: <span class="bad">não vista</span></div>`;
      const f = x.features;
      return `<div><b>${x.side === 'left' ? 'Esquerda' : 'Direita'}</b>${a.locoSide() === x.side ? ' (anda)' : ' (interage)'}: ` +
        `<span class="ok">${GESTURE_LABELS[x.gesture]}</span> conf ${(x.gestureConf * 100).toFixed(0)}% · ` +
        `MP "${x.rawLabel}" ${(x.score * 100).toFixed(0)}% · prof ${x.rawDepth.toFixed(2)}` +
        (f ? `<br><span class="small">dedos ${f.straight.map((s) => s.toFixed(2)).join(' ')} · pol ${f.thumbOut.toFixed(2)} · pin ${f.pinch.toFixed(2)}</span>` : '') + '</div>';
    };
    const p = a.rig.position;
    this.stats.innerHTML =
      `<div><b>${this.fps.toFixed(0)} FPS</b> (${this.frameMs.toFixed(1)} ms) · mãos ${h.detectFps.toFixed(0)}/s, ${h.detectMs.toFixed(1)} ms ${h.delegate}</div>` +
      `<div>Sensor: ${o.source} ${o.hasData ? '✔' : '✖'} (${o.eventCount}) · estado: ${a.state}</div>` +
      hand(h.left) + hand(h.right) +
      (a.locoMode !== 'teleporte' ? `<div>Andar (${a.locoMode}): ${a.runner.speed.toFixed(1)} m/s · mãos ${(a.runner.handEnergy * 100).toFixed(0)}% · corrida parada ${(a.runner.jogEnergy * 100).toFixed(0)}% · ${a.runner.source}</div>` : '') +
      `<div>Teleporte: ${tp.aiming ? 'mirando' : '—'} ${tp.reason} · espera ${tp.cooldownLeft(performance.now()).toFixed(1)}s · saltos ${tp.jumps}</div>` +
      `<div>Toque: ${isFinite(a.interaction.lastTouchDist) ? a.interaction.lastTouchDist.toFixed(2) + ' m' : '—'} · pos ${p.x.toFixed(1)}, ${p.z.toFixed(1)}</div>`;
  }

  _drawPreview() {
    const v = this.app.hands.video;
    const c = this.canvas;
    const w = v.videoWidth || 640, hgt = v.videoHeight || 480;
    if (c.width !== w || c.height !== hgt) { c.width = w; c.height = hgt; }
    const ctx = this.ctx;
    ctx.clearRect(0, 0, w, hgt);
    const res = this.app.hands.lastResult;
    if (!res || !res.landmarks) return;
    ctx.lineWidth = 3;
    for (const hand of this.app.hands.hands) {
      if (!hand.present || !hand.lm) continue;
      ctx.strokeStyle = hand.side === 'left' ? '#3d8bff' : '#ff7a1a';
      ctx.beginPath();
      for (const [a, b] of BONES) {
        ctx.moveTo(hand.lm[a].x * w, hand.lm[a].y * hgt);
        ctx.lineTo(hand.lm[b].x * w, hand.lm[b].y * hgt);
      }
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = '28px sans-serif';
      ctx.fillText(`${hand.side === 'left' ? 'E' : 'D'} ${GESTURE_LABELS[hand.gesture]}`, hand.lm[0].x * w, hand.lm[0].y * hgt + 30);
    }
  }
}

// ===== js/main.js =====
// Caçador de Sinal — protótipo. Loop principal e estados do jogo.
// Estados: boot -> calibration -> tutorial -> playing -> ended

class App {
  constructor() {
    this.calib = loadCalib() || defaultCalib();
    this.options = loadOptions();
    this.sfx = new Sfx(this.options);
    this.state = 'boot';
    this.stereo = false;
    this.devicesReady = false;
    this.lastError = '';

    const canvas = document.getElementById('gl');
    this.canvas = canvas;
    this.renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
    // resolução de render: começa em QUALITY.PIXEL_RATIO e se ajusta sozinha pelo FPS
    this.pixelRatio = Math.min(window.devicePixelRatio || 1, CONFIG.QUALITY.PIXEL_RATIO);
    this.renderer.setPixelRatio(this.pixelRatio);
    this._q = { t0: performance.now(), frames: 0, low: 0, high: 0 };
    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(CONFIG.CAMERA_FOV, 1, 0.03, 80);
    // rig (posição no chão) -> eye (altura dos olhos / recentrar no WebXR) -> câmera
    this.rig = new THREE.Group();
    this.eye = new THREE.Group();
    this.eye.position.y = CONFIG.EYE_HEIGHT;
    this.rig.add(this.eye);
    this.eye.add(this.camera);
    this.scene.add(this.rig);
    this.locoMode = CONFIG.LOCOMOTION;
    document.body.classList.add(`mode-${this.locoMode}`);
    this.xrSupported = false;
    this.xrActive = false;
    this.renderer.xr.enabled = true;
    this.renderer.xr.setReferenceSpaceType('local');
    if (navigator.xr && navigator.xr.isSessionSupported) {
      navigator.xr.isSessionSupported('immersive-vr').then((ok) => { this.xrSupported = ok; }).catch(() => {});
    }
    this.vrSettings = loadVrSettings();
    this.vr = new VRView(this.renderer, this.vrSettings);
    this.hud3d = new HUD3D(this.camera);
    this.testPattern = makeTestPattern();
    this.camera.add(this.testPattern);
    this.vignette = makeVignette();
    this.camera.add(this.vignette);
    this.vignetteK = 0;

    this.world = buildWorld(this.scene);
    this.rig.position.copy(this.world.spawn);
    this.floorY = this.rig.position.y;
    // a escola de verdade carrega em segundo plano; até lá vale o mapa de blocos
    this.mapDone = !CONFIG.MAP.USE_SCHOOL;
    this.mapText = this.mapDone ? '' : 'Carregando a escola…';
    this.mapPromise = this.mapDone ? Promise.resolve() : this._loadSchool();
    this.orientation = new OrientationController(this.camera);
    this.hands = new HandTracker(this.calib);
    this.handViews = [new HandView(this.camera, this.hands.left), new HandView(this.camera, this.hands.right)];

    this.tutorial = { teleport: false, touch: false, wire: false };
    this.teleport = new Teleport(this.scene, this.rig, this.camera, this.world, {
      onTeleport: () => { if (this.state === 'tutorial' && !this.tutorial.teleport) { this.tutorial.teleport = true; this._refreshTutorial(); } },
      onFail: (msg) => this.toast(`Teleporte: ${msg}`),
    });
    this.runner = new Runner(this.rig, this.eye, this.camera, this.world, {
      onMove: (d) => { if (this.state === 'tutorial' && !this.tutorial.teleport && d > 2) { this.tutorial.teleport = true; this._refreshTutorial(); } },
    });
    this.interaction = new Interaction(this.scene, this.camera, this.world, {
      onOpen: (t) => {
        this.sfx.open();
        const n = t.panelWires || t.wires;
        this.toast(n >= 5 ? `Caixa difícil: ${n} fios, com cores repetidas!` : `Caixa aberta! Conecte ${n === 1 ? 'o fio' : `os ${n} fios`}.`);
        if (this.state === 'tutorial' && !this.tutorial.touch) { this.tutorial.touch = true; this._refreshTutorial(); }
      },
      onWire: (ok, why) => { this.sfx.wire(ok); this.toast(ok ? 'Fio conectado ✔' : `Não encaixou (${why})`); },
      onGrab: () => this.sfx.grab(),
      wireCount: (t) => this._wireCount(t),
      onFixed: () => this._onFixed(),
    });
    this.handHint = new HandHint(this);
    this.debug = new DebugUI(this);
    this.calibration = new CalibrationFlow(this);

    this.mouse = new Map();      // ponteiros de toque/mouse na tela
    this.prevDown = new Map();   // id -> estava pegando no quadro anterior
    this.timeLeft = this.gameTime();
    this._v = new THREE.Vector3();
    this.applyOptions();
    // a tela apaga quando o app sai da frente: pede de novo ao voltar
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.requestWakeLock(); });
    document.addEventListener('fullscreenchange', () => this.requestWakeLock());
    this._wireCanvasPointers();
    window.addEventListener('resize', () => this.resize());
    if (screen.orientation) screen.orientation.addEventListener('change', () => { if (this.stereo) setTimeout(() => this.recenter(), 600); });
    this.resize();

    this._last = performance.now();
    this.renderer.setAnimationLoop(() => this._loop());
    this.calibration.welcome();
    window.__app = this; // para depuração no console / testes
    registerServiceWorker();
  }

  locoSide() { return this.calib.locomotion; }
  interSide() { return this.calib.locomotion === 'left' ? 'right' : 'left'; }

  // ---------------------------------------------------------------
  // Permissões / dispositivos
  // ---------------------------------------------------------------
  async initDevices(onStatus, withCamera = true) {
    if (!this.sensorsReady) {
      onStatus('Pedindo acesso aos sensores de movimento…');
      const perm = await this.orientation.requestPermission();
      try { if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) await DeviceMotionEvent.requestPermission(); } catch (e) { /* */ }
      this.runner.startSensors();
      const src = await this.orientation.start('auto');
      onStatus(`Sensores: ${perm ? src : 'permissão negada'}`);
      this.sensorsReady = true;
      this.requestWakeLock();
    }
    if (!withCamera || this.hands.landmarker) { this.devicesReady = true; return true; }
    try {
      onStatus('Pedindo acesso à câmera traseira…');
      if (!this.hands.stream) await this.hands.startCamera();
    } catch (e) {
      this.lastError = `Câmera: ${e.message || e.name}`;
      onStatus(`<span class="bad">${this.lastError}</span>`);
      return false;
    }
    try {
      await this.hands.loadModel((m) => onStatus(m));
    } catch (e) {
      this.lastError = `MediaPipe: ${e.message || e}`;
      onStatus(`<span class="bad">${this.lastError}</span>`);
      return false;
    }
    onStatus(`Pronto (${this.hands.delegate}).`);
    this.devicesReady = true;
    return true;
  }

  // Mantém a tela acesa. O Chrome solta a trava quando a aba sai da frente,
  // então isto é chamado de novo ao voltar (visibilitychange).
  async requestWakeLock() {
    if (!navigator.wakeLock || !this.sensorsReady || document.visibilityState !== 'visible') return;
    if (this.wakeLock && !this.wakeLock.released) return;
    try {
      this.wakeLock = await navigator.wakeLock.request('screen');
    } catch (e) { /* opcional: sem permissão ou bateria fraca */ }
  }

  // Carrega o modelo da escola e troca o mapa. Nunca rejeita: se der errado,
  // o jogo continua no mapa de blocos.
  async _loadSchool() {
    const setText = (t) => {
      this.mapText = t;
      const el = document.getElementById('map-status');
      if (el) el.innerHTML = t;
    };
    try {
      await loadSchool(this.world, this.scene, (msg, f) => setText(`🏫 ${msg}… ${Math.round(f * 100)}%`));
      this.rig.rotation.y = CONFIG.MAP.SPAWN_YAW;
      if (this.state === 'boot' || this.state === 'calibration') { this.rig.position.copy(this.world.spawn); this.floorY = this.world.spawn.y; }
      this.applyOptions();
      setText('<span class="ok">🏫 Escola carregada.</span>');
    } catch (e) {
      console.warn('Escola não carregou, usando o mapa de blocos', e);
      setText(`<span class="bad">🏫 A escola não carregou (${e.message || e}). Usando o mapa de blocos.</span>`);
    }
    this.mapDone = true;
  }

  // Se a escola ainda está carregando, mostra o progresso e chama again() no fim.
  _waitMap(again) {
    if (this.mapDone) return false;
    this.calibration._show('Carregando a escola…', `<p>Na primeira vez o modelo 3D da escola (17 MB) demora um pouco para baixar. Depois ele fica guardado no celular.</p><p id="map-status">${this.mapText}</p>`, []);
    this.mapPromise.then(again);
    return true;
  }

  // ---------------------------------------------------------------
  // Opções (som, vibração, vinheta, modo feira)
  // ---------------------------------------------------------------
  setOption(key, value) {
    this.options[key] = value;
    saveOptions(this.options);
    this.applyOptions();
  }

  applyOptions() {
    const feira = this.options.feira;
    document.body.classList.toggle('feira', feira);
    const feiraIds = this.world.feiraTargets || CONFIG.FEIRA.TARGETS;
    for (const t of this.world.targets) t.off = feira && !t.tutorial && !feiraIds.includes(t.id);
    const b = document.getElementById('btn-sound');
    if (b) { b.textContent = this.options.sound ? '🔊' : '🔇'; b.classList.toggle('on', this.options.sound); }
  }

  gameTime() { return this.options.feira ? CONFIG.FEIRA.GAME_TIME_S : CONFIG.GAME_TIME_S; }

  // ---------------------------------------------------------------
  // Fluxo do jogo
  // ---------------------------------------------------------------
  _resetWorld() {
    clearInterval(this._autoT);
    this.interaction.reset();
    this.teleport.cancel();
    this.runner.stop();
    this.runner.distance = 0;
    this.teleport.lastJump = -1e9;
    this.teleport.jumps = 0;
    this.rig.position.copy(this.world.spawn);
    this.floorY = this.world.spawn.y;
    this.recenter();
  }

  startTutorial() {
    if (this._waitMap(() => this.startTutorial())) return;
    this.state = 'tutorial';
    this._resetWorld();
    this.interaction.mode = 'tutorial';
    this.tutorial = { teleport: false, touch: false, wire: false };
    if (this.options.feira) {
      // modo feira: começa do lado do pedestal, sem o passo de andar
      if (this.world.tutorialSpawn) { this.rig.position.copy(this.world.tutorialSpawn); this.floorY = this.rig.position.y; } else this.rig.position.fromArray(CONFIG.FEIRA.TUTORIAL_SPAWN);
      this.tutorial.teleport = true;
    }
    this._refreshTutorial();
    document.body.classList.remove('playing');
  }

  _refreshTutorial() { if (this.state === 'tutorial') this.calibration.showTutorial(this.tutorial); }

  startGame() {
    if (this._waitMap(() => this.startGame())) return;
    this.calibration.hide();
    this.state = 'playing';
    this._resetWorld();
    // cada partida sorteia onde fica a caixa de cada lugar
    if (CONFIG.INTERACTION.RANDOM_SPOTS) { placeTargets(this.world, this.scene, true); this.applyOptions(); }
    this.interaction.mode = 'game';
    this.timeLeft = this.gameTime();
    this._alarmDone = false;
    this._lastTick = 0;
    this.gameStart = performance.now();
    document.body.classList.add('playing');
    this.toast('Valendo! Siga o detector de sinal.');
  }

  _gameTargets() { return this.world.targets.filter((t) => !t.tutorial && !t.off); }

  // Dificuldade crescente: a caixa que você abre agora tem mais fios que a anterior.
  _wireCount(t) {
    if (t.tutorial) return t.wires;
    const levels = this.options.feira ? CONFIG.FEIRA.WIRE_LEVELS : CONFIG.INTERACTION.WIRE_LEVELS;
    const fixed = this._gameTargets().filter((x) => x.state === 'fixed').length;
    return levels[Math.min(fixed, levels.length - 1)];
  }

  _onFixed() {
    this.sfx.fixed();
    if (this.state === 'tutorial') {
      this.tutorial.wire = true;
      this._refreshTutorial();
      this.toast('Caixa consertada! Tutorial completo.');
      return;
    }
    const all = this._gameTargets();
    const fixed = all.filter((t) => t.state === 'fixed').length;
    this.toast(`Sinal restaurado! ${fixed}/${all.length}`);
    if (fixed === all.length) this.endGame(true);
  }

  endGame(win) {
    if (this.state !== 'playing') return;
    this.state = 'ended';
    this.teleport.cancel();
    this.interaction.closePanel();
    document.body.classList.remove('playing');
    const all = this._gameTargets();
    const fixed = all.filter((t) => t.state === 'fixed').length;
    const used = Math.min((performance.now() - this.gameStart) / 1000, this.gameTime());
    setTimeout(() => (win ? this.sfx.win() : this.sfx.lose()), 350);
    const c = this.calibration;
    const feira = this.options.feira;
    const { rec, place } = addResult({ fixed, total: all.length, used, timeLeft: this.timeLeft, win, feira });
    c._show(win ? '🎉 Rede restaurada!' : '⏰ O tempo acabou', `
      <p>${win ? 'Você consertou todos os pontos de sinal.' : 'A rede caiu antes de você consertar tudo.'}</p>
      <p class="score"><b>${rec.points}</b> pontos · caixas <b>${fixed}/${all.length}</b> · tempo <b>${fmtTime(used)}</b>
      ${place ? `<br>${place === 1 ? '🏆 <b>Melhor do dia!</b>' : `Você ficou em <b>${place}º</b> hoje.`}` : ''}</p>
      <div class="name-row"><input id="rank-name" maxlength="${CONFIG.RANKING.NAME_MAX}" placeholder="Seu nome" autocomplete="off" enterkeyhint="done"><button id="rank-save">Salvar nome</button></div>
      <div id="rank-table">${rankingTable(feira, rec.id)}</div>
      ${feira ? '<p class="small" id="auto-return"></p>' : ''}`, [
      { label: '👤 Próximo jogador', cls: feira ? 'primary' : '', onClick: () => this.nextPlayer() },
      { label: '🔁 Jogar de novo', cls: feira ? '' : 'primary', onClick: () => this.startGame() },
      { label: 'Tutorial', onClick: () => this.startTutorial() },
      { label: 'Recalibrar', onClick: () => this.recalibrate() },
    ]);
    // nome no ranking (opcional)
    const input = document.getElementById('rank-name');
    const saveName = () => {
      if (!input.value.trim()) return;
      rename(rec.id, input.value);
      document.getElementById('rank-table').innerHTML = rankingTable(feira, rec.id);
      input.blur();
      this.toast('Nome salvo no ranking');
    };
    document.getElementById('rank-save').addEventListener('click', (e) => { e.stopPropagation(); saveName(); });
    input.addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Enter') saveName(); });
    input.addEventListener('focus', () => { clearInterval(this._autoT); const a = document.getElementById('auto-return'); if (a) a.textContent = ''; });
    if (feira) {
      // modo feira: volta sozinho para a tela do próximo jogador
      let left = CONFIG.FEIRA.AUTO_RETURN_S;
      const el = document.getElementById('auto-return');
      const tick = () => { if (el) el.textContent = `Voltando para o próximo jogador em ${left} s…`; };
      tick();
      clearInterval(this._autoT);
      this._autoT = setInterval(() => {
        left--;
        if (this.state !== 'ended') { clearInterval(this._autoT); return; }
        if (left <= 0) { clearInterval(this._autoT); this.nextPlayer(); } else tick();
      }, 1000);
    }
  }

  // Tela entre um visitante e outro: zera a partida e guarda a calibração.
  nextPlayer() {
    clearInterval(this._autoT);
    document.body.classList.remove('playing');
    if (this.xrActive) this.renderer.xr.getSession().end();
    this.state = 'next';
    this._resetWorld();
    this.calibration.nextPlayer();
  }

  recalibrate() {
    document.body.classList.remove('playing');
    Object.assign(this.calib, defaultCalib());
    this.state = 'calibration';
    this.interaction.closePanel();
    this.teleport.hide();
    if (this.devicesReady && this.hands.landmarker) { this.setDebug(true); this.calibration.stepRecenter(); } else this.calibration.welcome();
  }

  setDebug(on) { this.debug.setEnabled(on); }

  // ---------------------------------------------------------------
  // Modo óculos
  // ---------------------------------------------------------------
  // Entrar/sair do óculos. Usa o modo VR do Chrome (WebXR, configurado pelo
  // QR Code do óculos) quando existe; senão, o modo próprio do jogo.
  // Precisa ser chamado direto do toque no botão (o navegador exige).
  toggleVR() {
    if (this.xrActive) { this.renderer.xr.getSession().end(); return; }
    if (this.stereo) { this.setStereo(false); return; }
    // sempre tenta primeiro o modo VR do Chrome (igual ao teste-xr.html);
    // o modo próprio só entra se ele não existir ou falhar
    if (navigator.xr && this.vrSettings.engine !== 'proprio') this.startXR();
    else {
      if (!navigator.xr) this.toast('Este navegador não tem o modo VR do Chrome — usando o modo próprio');
      this.setStereo(true);
    }
  }

  startXR() {
    // requestSession é a PRIMEIRA chamada do toque (sem await antes), como no teste
    navigator.xr.requestSession('immersive-vr').then(async (session) => {
      session.addEventListener('end', () => this._onXREnd());
      // botão do óculos / dedo na tela: segurar = andar
      session.addEventListener('selectstart', () => { this.xrSelect = true; });
      session.addEventListener('selectend', () => { this.xrSelect = false; });
      await this.renderer.xr.setSession(session);
      this.xrActive = true;
      document.body.classList.add('xr');
      this.hud3d.show(true);
      this.hud3d.toast('Modo VR do Chrome');
      setTimeout(() => this.recenter(), 800);
    }).catch((e) => {
      console.warn('WebXR falhou, usando o modo próprio', e);
      this.toast(`VR do Chrome não abriu (${e.message || e.name || e}) — usando o modo próprio`);
      this.setStereo(true);
    });
  }

  _onXREnd() {
    this.xrActive = false;
    this.xrSelect = false;
    document.body.classList.remove('xr');
    this.hud3d.show(false);
    this.eye.rotation.y = 0;
    this.camera.position.set(0, 0, 0);
    this.resize();
    this.orientation.recenter();
  }

  // Recentrar: no WebXR gira o grupo dos olhos; fora dele, o sensor.
  recenter() {
    if (this.xrActive) {
      const f = new THREE.Vector3(0, 0, -1).applyQuaternion(this.camera.quaternion);
      this.eye.rotation.y = -Math.atan2(-f.x, -f.z);
    } else {
      this.orientation.recenter();
    }
  }

  async setStereo(on) {
    this.stereo = on;
    document.body.classList.toggle('stereo', on);
    document.getElementById('btn-stereo').classList.toggle('on', on);
    this.hud3d.show(on);
    if (on) {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
        if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
      } catch (e) { /* nem todo navegador deixa travar: o aviso "vire o celular" ajuda */ }
      this.showVrUi(4000);
      setTimeout(() => this.recenter(), 900);
      this.hud3d.toast('Modo óculos — toque na tela para opções');
    } else {
      try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) { /* */ }
      document.body.classList.remove('vr-ui', 'vr-adjust');
      this.testPattern.visible = false;
    }
    this.resize();
  }

  // No óculos os botões ficam escondidos; um toque na tela mostra por alguns segundos.
  showVrUi(ms = 5000) {
    document.body.classList.add('vr-ui');
    clearTimeout(this._vrUiT);
    this._vrUiT = setTimeout(() => document.body.classList.remove('vr-ui'), ms);
  }

  // Ajusta a resolução pelo FPS (mais FPS em celular fraco).
  _adaptQuality(now) {
    const q = this._q;
    q.frames++;
    const el = now - q.t0;
    if (el < 1000) return;
    const fps = (q.frames * 1000) / el;
    q.frames = 0; q.t0 = now;
    const Q = CONFIG.QUALITY;
    if (!Q.AUTO) return;
    const max = Math.min(window.devicePixelRatio || 1, Q.PIXEL_RATIO);
    if (fps < Q.LOW_FPS) { q.low++; q.high = 0; } else if (fps > Q.HIGH_FPS) { q.high++; q.low = 0; } else { q.low = 0; q.high = 0; }
    let pr = this.pixelRatio;
    if (q.low >= 2 && pr > Q.MIN_PIXEL_RATIO) { pr = Math.max(Q.MIN_PIXEL_RATIO, pr - 0.15); q.low = 0; }
    if (q.high >= 6 && pr < max) { pr = Math.min(max, pr + 0.1); q.high = 0; }
    if (pr !== this.pixelRatio) { this.pixelRatio = pr; this.renderer.setPixelRatio(pr); this.resize(); }
  }

  toast(msg) {
    this.hud3d.toast(msg);
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(this._toastT);
    this._toastT = setTimeout(() => el.classList.remove('show'), 2200);
  }

  resize() {
    if (this.renderer.xr.isPresenting) return;
    const w = window.innerWidth, h = window.innerHeight;
    this.renderer.setSize(w, h, false);
    if (this.stereo) this.vr.applyCamera(this.camera, w, h);
    else { this.camera.fov = CONFIG.CAMERA_FOV; this.camera.aspect = w / h; this.camera.updateProjectionMatrix(); }
  }

  // Mouse/toque na tela: arrasta fios do painel; sem sensor, gira a visão.
  _wireCanvasPointers() {
    const c = this.canvas;
    c.addEventListener('pointerdown', (e) => {
      if (this.stereo && !document.body.classList.contains('vr-adjust')) { this.showVrUi(); return; }
      c.setPointerCapture(e.pointerId);
      this.mouse.set(e.pointerId, { id: `m${e.pointerId}`, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, down: true, lx: e.clientX, ly: e.clientY });
    });
    c.addEventListener('pointermove', (e) => {
      const p = this.mouse.get(e.pointerId);
      if (!p) return;
      const dx = e.clientX - p.lx, dy = e.clientY - p.ly;
      p.lx = e.clientX; p.ly = e.clientY; p.x = e.clientX; p.y = e.clientY;
      if (!this.interaction.grabs.has(p.id) && !this.orientation.hasData) this.orientation.addManual(dx, dy);
    });
    const up = (e) => { const p = this.mouse.get(e.pointerId); if (p) p.down = false; };
    c.addEventListener('pointerup', up);
    c.addEventListener('pointercancel', up);
  }

  // ---------------------------------------------------------------
  // Loop
  // ---------------------------------------------------------------
  _loop() {
    const now = performance.now();
    const dtMs = Math.min(100, now - this._last);
    this._last = now;
    const dt = dtMs / 1000;
    const input = this.debug.input;

    // 1) cabeça (no WebXR o próprio Chrome move a câmera)
    if (this.xrActive) {
      // campo de visão real do óculos, para as mãos caírem no lugar certo
      const e = this.camera.projectionMatrix.elements;
      this.camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(1 / e[5]));
      this.camera.aspect = e[5] / e[0];
    } else {
      this.orientation.update();
    }
    if (this.locoMode !== 'correr' && (input.move.f || input.move.r)) this._debugWalk(dt, input.move);
    this._followFloor(dt);
    this.rig.updateMatrixWorld(true);

    // 2) mãos + gestos
    const fresh = this.hands.update(now, this.camera);
    for (const h of this.hands.hands) {
      if (fresh || !h.visible) updateHandGesture(h, this.calib.thresholds, now);
    }
    for (const v of this.handViews) v.update();

    const active = this.state === 'tutorial' || this.state === 'playing';
    const loco = this.hands.get(this.locoSide());
    const inter = this.hands.get(this.interSide());

    // 3) locomoção: correr (padrão) ou teleporte
    if (active && this.locoMode !== 'teleporte') {
      let manual = 0;
      this.runner.manualSource = 'botão';
      if (input.run || input.move.f > 0) manual = 1;
      if (this.xrSelect) { manual = 1; this.runner.manualSource = 'botão do óculos'; }
      if (this.locoMode === 'palma' && this.hands.hands.some((h) => h.visible && h.gesture === 'open')) { manual = 1; this.runner.manualSource = 'palma aberta'; }
      this.runner.useSwing = this.locoMode === 'correr';
      this.runner.maxSpeed = this.locoMode === 'correr' ? CONFIG.RUN.MAX_SPEED : CONFIG.RUN.WALK_SPEED;
      const busy = this.interaction.grabs.size > 0; // arrastando fio: não anda
      this.runner.update(now, dt, this.hands.hands, manual, busy);
      this.teleport.hide();
    } else if (active) {
      this.teleport.update(now, loco, input.aim || input.keyAim);
    } else {
      this.teleport.hide();
      if (this.runner.speed) this.runner.stop();
    }

    // 4) interação: tocar, painel, detector
    if (active) {
      if (inter.visible && inter.present) this.interaction.checkTouch(inter.worldPts[8]);
      this.interaction.updatePanel(this._collectPointers(), window.innerWidth, window.innerHeight, now);
      this.interaction.updateDetector(inter);
    } else {
      this.interaction.detector.group.visible = false;
    }
    animateTargets(this.world.targets, dt, now / 1000, this.rig.position, (t) => active && this.interaction.eligible(t));
    // bipe do detector (quieto com o painel aberto)
    if (active && !this.interaction.panel && this.interaction.nearest) this.sfx.detector(this.interaction.nearest.dist, now / 1000);

    // 5) tempo
    if (this.state === 'playing') {
      this.timeLeft -= dt;
      if (!this._alarmDone && this.timeLeft <= 60 && this.gameTime() > 90) { this._alarmDone = true; this.sfx.alarm(); this.toast('⚠ Falta 1 minuto!'); }
      const sec = Math.ceil(this.timeLeft);
      if (sec <= 10 && sec > 0 && sec !== this._lastTick) { this._lastTick = sec; this.sfx.tick(sec <= 3); }
      if (this.timeLeft <= 0) { this.timeLeft = 0; this.endGame(false); }
    }
    this._updateVignette(dt);
    this.handHint.update(now, active);
    this._updateHud(active);

    // 6) render
    this._render();
    this.debug.frame(now, dtMs);
    this._adaptQuality(now);
  }

  // Na escola o chão tem degraus e rampas: o jogador acompanha a altura do piso.
  _followFloor(dt) {
    if (!this.world.school) return;
    const p = this.rig.position;
    const f = this.world.floorAt(p.x, p.z);
    if (f != null) {
      this.world.grid.refY = f;
      const dy = f - this.floorY;
      this.floorY += Math.abs(dy) > 0.6 ? dy : dy * Math.min(1, dt * 12);
    }
    p.y = this.floorY;
  }

  // Vinheta de conforto: escurece as bordas da visão enquanto anda (menos enjoo).
  // Fica presa à câmera, então funciona na tela normal, no óculos e no WebXR.
  _updateVignette(dt) {
    const C = CONFIG.COMFORT;
    let goal = 0;
    if (this.options.vignette) {
      if (document.body.classList.contains('dashing')) goal = 1;
      else goal = Math.min(1, (this.runner.speed || 0) / C.VIGNETTE_SPEED);
    }
    this.vignetteK += (goal - this.vignetteK) * Math.min(1, dt * 8);
    const k = this.vignetteK * C.VIGNETTE_MAX;
    this.vignette.visible = k > 0.01;
    this.vignette.material.uniforms.strength.value = k;
  }

  _collectPointers() {
    const list = [];
    const w = window.innerWidth, h = window.innerHeight;
    for (const hand of this.hands.hands) {
      if (!hand.visible) continue;
      this._v.copy(hand.worldPts[4]).lerp(hand.worldPts[8], 0.5).project(this.camera);
      if (this._v.z > 1) continue;
      list.push({ id: `hand-${hand.side}`, x: (this._v.x * 0.5 + 0.5) * w, y: (-this._v.y * 0.5 + 0.5) * h, down: hand.gesture === 'pinch' || hand.gesture === 'fist' });
    }
    const input = this.debug.input;
    if (input.pinch || input.fist) list.push({ id: 'cross', x: w / 2, y: h / 2, down: true });
    for (const [pid, p] of this.mouse) {
      list.push({ id: p.id, x: p.x, y: p.y, sx: p.sx, sy: p.sy, down: p.down });
      if (!p.down) this.mouse.delete(pid);
    }
    for (const p of list) p.wasDown = this.prevDown.get(p.id) || false;
    this.prevDown.clear();
    for (const p of list) this.prevDown.set(p.id, p.down);
    return list;
  }

  _debugWalk(dt, move) {
    const fwd = this.camera.getWorldDirection(this._v);
    fwd.y = 0; fwd.normalize();
    const nx = this.rig.position.x + (fwd.x * move.f - fwd.z * move.r) * 2 * dt;
    const nz = this.rig.position.z + (fwd.z * move.f + fwd.x * move.r) * 2 * dt;
    if (this.world.isFree(nx, nz, 0.25)) { this.rig.position.x = nx; this.rig.position.z = nz; }
  }

  _updateHud(active) {
    const hud = document.getElementById('hud');
    hud.classList.toggle('active', active);
    if (!active) { if (this.stereo || this.xrActive) this.hud3d.update({ timer: this.state === 'ended' ? 'fim' : '' }); return; }
    const info = {};
    const tl = document.getElementById('timer');
    if (this.state === 'playing') {
      tl.textContent = info.timer = fmtTime(this.timeLeft);
      tl.classList.toggle('urgent', this.timeLeft < 30);
      const all = this._gameTargets();
      document.getElementById('count').textContent = info.count = `📡 ${all.filter((t) => t.state === 'fixed').length}/${all.length}`;
    } else {
      tl.textContent = info.timer = 'tutorial';
      document.getElementById('count').textContent = '';
    }
    // bússola do detector (ajuda quando a mão de interação não está visível)
    const near = this.interaction.nearest;
    const comp = document.getElementById('compass');
    if (!near) { comp.hidden = true; } else {
      comp.hidden = false;
      const local = this.camera.worldToLocal(this._v.copy(near.target.center));
      const ang = Math.atan2(local.x, -local.z);
      document.getElementById('compass-arrow').style.transform = `rotate(${ang}rad)`;
      const up = local.y > 0.6 && near.dist < 5 ? ' ↑ olhe para cima' : '';
      document.getElementById('compass-text').textContent = `${near.dist.toFixed(1)} m${up}`;
      info.dist = `${near.dist.toFixed(1)} m`; info.arrowAngle = ang; info.up = !!up;
    }
    if (this.locoMode !== 'teleporte' && this.runner.speed > 0.2) info.count = `${info.count || ''} 🏃`;
    if (this.stereo || this.xrActive) this.hud3d.update(info);
    const input = this.debug.input;
    document.getElementById('crosshair').classList.toggle('on', input.pinch || input.fist || input.aim);
  }

  _render() {
    const r = this.renderer;
    if (this.xrActive || !this.stereo) { r.setScissorTest(false); r.render(this.scene, this.camera); return; }
    this.vr.render(this.scene, this.camera);
  }
}

// Service worker: faz o link normal sempre abrir a versão mais nova
// (e o jogo abrir mesmo sem internet, com a última versão baixada).
function registerServiceWorker() {
  if (!('serviceWorker' in navigator) || !window.isSecureContext) return;
  if (!/\/(index\.html)?$/.test(location.pathname)) return; // só na página principal
  // servidor local por IP (certificado próprio): o navegador não aceita service worker
  if (location.protocol === 'https:' && /^\d+\.\d+\.\d+\.\d+$/.test(location.hostname)) return;
  navigator.serviceWorker.register('sw.js').catch((e) => console.warn('Service worker não registrado', e));
}

// Plano preso na frente da câmera; o shader escurece pelo ângulo a partir do
// centro da visão (independe do tamanho da tela e do campo de visão).
function makeVignette() {
  const D = 0.12;
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthTest: false, depthWrite: false,
    uniforms: {
      strength: { value: 0 },
      inner: { value: Math.tan(THREE.MathUtils.degToRad(22)) },
      outer: { value: Math.tan(THREE.MathUtils.degToRad(48)) },
    },
    vertexShader: 'varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `uniform float strength; uniform float inner; uniform float outer; varying vec2 vP;
      void main(){ float r = length(vP) / ${D.toFixed(3)}; float a = smoothstep(inner, outer, r) * strength; gl_FragColor = vec4(0.0, 0.0, 0.0, a); }`,
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(D * 8, D * 8), mat);
  m.position.z = -D;
  m.renderOrder = 40; // por cima do mundo, por baixo do HUD 3D e do painel
  m.frustumCulled = false;
  m.visible = false;
  return m;
}

function fmtTime(s) {
  s = Math.max(0, Math.ceil(s));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

try {
  new App();
} catch (e) {
  console.error(e);
  document.body.insertAdjacentHTML('beforeend', `<div class="fatal">Erro ao iniciar: ${e.message}</div>`);
}
