<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0b1118">
  <title>Caçador de Sinal — protótipo</title>
  <style>
:root {
  --bg: #0b1118;
  --panel: rgba(11, 17, 24, 0.86);
  --text: #f2f6fa;
  --muted: #9fb0c0;
  --accent: #00e5ff;
  --ok: #3ddc84;
  --bad: #ff5468;
  --btn: rgba(255, 255, 255, 0.14);
  --btn-on: rgba(0, 229, 255, 0.45);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 5; }

button {
  font: inherit; color: var(--text); background: var(--btn); border: 1px solid rgba(255,255,255,0.18);
  border-radius: 12px; padding: 10px 14px; min-height: 44px; cursor: pointer; touch-action: manipulation;
}
button.primary { background: var(--accent); color: #00222a; border-color: transparent; font-weight: 600; }
button.on { background: var(--btn-on); }
button:disabled { opacity: 0.5; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 2; display: none; }
#hud.active { display: block; }
#hud-top {
  position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
  display: flex; gap: 12px; align-items: center; background: var(--panel); padding: 6px 14px; border-radius: 999px;
  font-weight: 700; font-variant-numeric: tabular-nums;
}
#timer.urgent { color: var(--bad); }
#compass { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; font-size: 14px; white-space: nowrap; }
#compass[hidden] { display: none; }
#compass-arrow { display: inline-block; color: var(--accent); font-size: 16px; }
#crosshair {
  position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px;
  border: 2px solid rgba(255,255,255,0.35); border-radius: 50%; display: none;
}
#crosshair.on { display: block; border-color: var(--accent); }
#fps {
  position: fixed; left: calc(8px + env(safe-area-inset-left)); top: calc(8px + env(safe-area-inset-top));
  font: 12px ui-monospace, monospace; background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 6px; z-index: 6; pointer-events: none;
}

/* ---------- Botões ---------- */
#controls {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
  display: flex; gap: 6px; padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  overflow-x: auto; scrollbar-width: none; background: linear-gradient(transparent, rgba(0,0,0,0.45));
}
#controls::-webkit-scrollbar { display: none; }
#controls button { flex: 0 0 auto; padding: 8px 11px; font-size: 14px; }

/* ---------- Depuração ---------- */
#debug {
  position: fixed; right: calc(6px + env(safe-area-inset-right)); bottom: calc(66px + env(safe-area-inset-bottom));
  width: min(360px, calc(64vw - 12px)); max-height: 34vh; overflow: auto;
  background: rgba(0,0,0,0.72); border-radius: 10px; padding: 8px 10px; z-index: 6;
  font: 12px/1.4 ui-monospace, monospace; pointer-events: none;
}
#debug-stats > div { margin-bottom: 3px; }
#preview {
  position: fixed; left: calc(6px + env(safe-area-inset-left)); bottom: calc(66px + env(safe-area-inset-bottom));
  width: 34vw; max-width: 200px; z-index: 6; border-radius: 8px; overflow: hidden; pointer-events: none; border: 1px solid #fff4;
}
#preview video, #preview canvas { display: block; width: 100%; height: auto; }
#preview canvas { position: absolute; inset: 0; height: 100%; }
body.sheet-bottom #preview, body.sheet-bottom #debug { top: calc(34px + env(safe-area-inset-top)); bottom: auto; max-height: 24vh; }
/* vídeo continua tocando (MediaPipe precisa) mas fica invisível */
#preview.offscreen { width: 2px; height: 2px; opacity: 0.01; border: 0; }

.ok { color: var(--ok); }
.bad { color: var(--bad); }
.small { font-size: 12.5px; color: var(--muted); }

/* ---------- Overlay (calibração/tutorial/fim) ---------- */
#overlay {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; max-height: 72vh; display: flex; justify-content: center;
  padding: 0 10px calc(62px + env(safe-area-inset-bottom)); pointer-events: none;
}
#overlay[hidden] { display: none; }
#overlay .sheet {
  pointer-events: auto; width: min(560px, 100%); max-height: calc(72vh - 62px); overflow: auto;
  background: var(--panel); border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 14px 16px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
#overlay h2 { margin: 0 0 6px; font-size: 18px; }
#overlay p { margin: 6px 0; }
#overlay .live { margin: 8px 0; min-height: 1.4em; font-size: 14px; color: #dff; }
#overlay .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
#overlay.compact { top: calc(48px + env(safe-area-inset-top)); bottom: auto; padding-bottom: 0; }
#overlay.compact .sheet { padding: 10px 12px; font-size: 13.5px; max-height: 40vh; }
#overlay.compact h2 { font-size: 15px; }
#overlay.compact .btns { margin-top: 4px; }
#overlay.compact .btns button { min-height: 36px; padding: 6px 12px; }
#overlay.compact .live { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,0.08); color: var(--muted); }
.chip.cur { background: rgba(0,229,255,0.2); color: var(--text); }
.chip.done { color: var(--ok); }

#toast {
  position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 8;
  background: var(--panel); padding: 8px 16px; border-radius: 12px; opacity: 0; transition: opacity 0.2s; pointer-events: none;
  max-width: 86vw; text-align: center;
}
#toast.show { opacity: 1; }
.fatal { position: fixed; inset: 20px; background: #300; padding: 20px; border-radius: 12px; z-index: 99; }

/* ---------- Modo óculos ---------- */
#btn-vradjust { display: none; }
body.stereo #btn-vradjust { display: inline-block; }
body.stereo #hud, body.stereo #debug, body.stereo #preview, body.stereo #toast { display: none !important; }
body.stereo #overlay { display: none; }
body.stereo #fps { opacity: 0.5; }
/* botões escondidos no óculos; um toque na tela mostra */
body.stereo #controls { transform: translateY(110%); transition: transform 0.2s; }
body.stereo.vr-ui #controls, body.stereo.vr-adjust #controls { transform: none; }
/* tela de ajuste: folha compacta embaixo, sem cobrir o centro das lentes */
body.stereo.vr-adjust #overlay { display: flex; top: auto; bottom: 0; max-height: 46vh; padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
body.stereo.vr-adjust #overlay .sheet { max-height: calc(46vh - 60px); width: min(720px, 100%); font-size: 13px; padding: 8px 12px; }
#rotate-hint {
  display: none; position: fixed; inset: 0; z-index: 9; background: rgba(0,0,0,0.88);
  align-items: center; justify-content: center; text-align: center; padding: 30px; font-size: 20px;
}
@media (orientation: portrait) { body.stereo #rotate-hint { display: flex; } }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; margin: 4px 0; }
.slider input[type=range] { grid-column: 1 / 3; width: 100%; accent-color: var(--accent); }
.slider b { font-variant-numeric: tabular-nums; }
.sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
@media (max-width: 560px) { .sliders { grid-template-columns: 1fr; } }
.steps { margin: 6px 0; padding-left: 20px; }
.steps li { margin: 6px 0; }

/* ---------- Modo de locomoção ---------- */
body.mode-correr #btn-aim, body.mode-correr #btn-teleport, body.mode-palma #btn-aim, body.mode-palma #btn-teleport { display: none; }
body.mode-teleporte #btn-run { display: none; }

/* ---------- Opções (tela inicial / próximo jogador) ---------- */
.opts { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
.opts .opt { min-height: 40px; padding: 8px 12px; font-size: 14px; }
.opts .opt.on { background: var(--btn-on); border-color: var(--accent); }

/* ---------- Aviso de mão / luz ---------- */
#hand-hint {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  max-width: min(92vw, 520px); padding: 10px 16px; border-radius: 14px; z-index: 6; pointer-events: none;
  background: rgba(255, 196, 0, 0.92); color: #1d1400; font-weight: 600; text-align: center;
  opacity: 0; transition: opacity 0.25s;
}
#hand-hint.show { opacity: 1; }
body.stereo #hand-hint { display: none; }

/* ---------- Placar / ranking ---------- */
.score { font-size: 16px; }
.name-row { display: flex; gap: 8px; margin: 8px 0; }
.name-row input {
  flex: 1; min-width: 0; font: inherit; color: var(--text); background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.25); border-radius: 12px; padding: 8px 12px;
  user-select: text; -webkit-user-select: text; touch-action: manipulation;
}
table.rank { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.rank th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 6px; }
table.rank td { padding: 5px 6px; border-top: 1px solid rgba(255,255,255,0.08); }
table.rank tr.me td { background: rgba(0, 229, 255, 0.18); font-weight: 600; }
</style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
    }
  }
  </script>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="fade"></div>

  <!-- HUD do jogo -->
  <div id="hud">
    <div id="hud-top">
      <span id="timer">0:00</span>
      <span id="count"></span>
      <span id="compass" hidden><span id="compass-arrow">▲</span> <span id="compass-text"></span></span>
    </div>
    <div id="crosshair"></div>
  </div>
  <div id="fps">— FPS</div>

  <!-- Botões alternativos aos gestos (protótipo) -->
  <div id="controls">
    <button id="btn-recenter" title="Recentrar a direção">⟲</button>
    <button id="btn-run" title="Segure para andar para onde está olhando">🏃 Andar</button>
    <button id="btn-aim" title="Mirar teleporte (liga/desliga)">🎯 Mirar</button>
    <button id="btn-teleport" title="Confirmar teleporte">🚀 Ir</button>
    <button id="btn-touch" title="Tocar/abrir a caixa mais próxima">👆 Tocar</button>
    <button id="btn-pinch" title="Segure: pinça na mira do centro">🤏 Pinça</button>
    <button id="btn-fist" title="Segure: pegar na mira do centro">✊ Pegar</button>
    <button id="btn-stereo" title="Modo óculos (tela dividida)">👓 Óculos</button>
    <button id="btn-vradjust" title="Ajustar o óculos">🔧 Ajustar</button>
    <button id="btn-sound" title="Som liga/desliga">🔊</button>
    <button id="btn-help" title="Ajuda">❓</button>
    <button id="btn-full" title="Tela cheia">⛶</button>
    <button id="btn-debug" title="Painel de depuração">🐞</button>
    <button id="btn-calib" title="Recalibrar">⚙</button>
  </div>

  <!-- Depuração -->
  <div id="debug" hidden>
    <div id="debug-stats"></div>
  </div>
  <div id="preview" class="offscreen">
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="cam2d"></canvas>
  </div>

  <!-- Calibração / tutorial / fim -->
  <div id="overlay" hidden></div>
  <div id="toast"></div>
  <div id="hand-hint"></div>
  <div id="rotate-hint">📱↔ Vire o celular deitado para usar o óculos</div>

  <noscript>Este protótipo precisa de JavaScript.</noscript>
  <script type="module">
import * as THREE from 'three';
// ===== js/config.js =====
// =====================================================================
// Caçador de Sinal — configuração central.
// Todos os valores "de ajuste" do protótipo ficam aqui, para facilitar
// testes no celular sem caçar números espalhados pelo código.
// =====================================================================

const CONFIG = {
  // ---- Jogador / câmera ----
  EYE_HEIGHT: 1.6,          // altura dos olhos (m)
  CAMERA_FOV: 70,           // FOV vertical da câmera 3D (graus)

  // ---- Partida ----
  GAME_TIME_S: 360,         // duração da partida (6 min)

  // ---- Locomoção ----
  VERSION: 'v10',
  // 'palma' = palma aberta anda para onde olha (mais simples) · 'correr' = balançar as mãos / correr parado · 'teleporte'
  LOCOMOTION: 'palma',

  // ---- Corrida ----
  RUN: {
    WALK_SPEED: 2.0,        // m/s no modo 'palma' (andar rápido)
    MAX_SPEED: 3.2,         // m/s no modo 'correr' com balanço máximo
    ACCEL: 6,               // m/s² para ganhar velocidade
    DECEL: 8,               // m/s² para parar
    ENERGY_SMOOTH: 6,       // suavização da intensidade (1/s)
    BOB: 0.045,             // balanço do passo (m)
    USE_HANDS: true,        // balançar as mãos na frente da câmera
    USE_JOG: true,          // correr parado (sensor de movimento do celular)
    SWING_WINDOW_MS: 900,   // janela para medir o balanço
    SWING_FLIP_SPEED: 0.25, // velocidade mínima (m/s) para contar ida/volta
    SWING_MIN_FLIPS: 2,     // idas e voltas necessárias na janela (evita andar ao esticar a mão)
    SWING_START: 0.3,       // velocidade média da mão (m/s) para começar a andar
    SWING_FULL: 1.1,        // velocidade média da mão para correr no máximo
    JOG_WINDOW_MS: 900,
    JOG_FLIP_ACC: 1.2,      // m/s² mínimo de cada "quique"
    JOG_MIN_FLIPS: 3,
    JOG_START: 1.2,         // aceleração (RMS, m/s²) para começar a andar
    JOG_FULL: 4.0,          // para correr no máximo
  },

  // ---- Teleporte ----
  TELEPORT: {
    MAX_DIST: 4.0,          // distância máxima por salto (m, no plano do chão)
    MIN_DIST: 0.6,          // saltos menores que isso são ignorados
    COOLDOWN_S: 0.9,        // espera mínima entre saltos
    CONFIRM_WINDOW_S: 0.9,  // tempo para abrir a palma depois da pistolinha
    PLAYER_RADIUS: 0.3,     // não pousar a menos disso de um bloco
    FADE_MS: 160,
    MODE: 'dash',           // 'dash' = desliza rápido até o alvo · 'fade' = pisca a tela
    DASH_MS_BASE: 120,      // duração do deslize = base + por metro
    DASH_MS_PER_M: 45,      //   (4 m ≈ 0,3 s)
    DASH_BOB: 0.035,        // balanço vertical do "passo" (m)
    AIM_MODE: 'olhar',      // 'olhar' = alvo na direção olho→mão (estável) · 'dedo' = para onde o dedo aponta
    AIM_SMOOTH: 12,         // suavização da direção da mira (maior = responde mais rápido, treme mais)
    TARGET_SMOOTH: 10,      // suavização do marcador no chão
    AIM_GRACE_MS: 350,      // a mira continua esse tempo se a pistolinha "piscar"
    AIM_WRIST_BLEND: 0.4,   // (modo 'dedo') 0 = só o dedo indicador; 1 = só pulso→ponta
  },

  // ---- Mãos (MediaPipe) ----
  HANDS: {
    NUM_HANDS: 2,
    VIDEO_W: 640,
    VIDEO_H: 480,
    USE_WORKER: true,           // detecção numa thread separada (muito mais FPS)
    WORKER_MAX_SIDE: 480,       // reduz a imagem enviada ao worker (px do lado maior)
    MAX_DETECT_HZ: 30,          // detecções por segundo, no máximo
    DETECT_EVERY_N_FRAMES: 1,   // (modo normal) 2 = detecta em quadros alternados
    MIN_DETECTION_CONF: 0.5,
    MIN_PRESENCE_CONF: 0.5,
    MIN_TRACKING_CONF: 0.5,
    // MediaPipe supõe imagem espelhada (selfie). Na câmera traseira o rótulo
    // vem invertido, então por padrão invertemos. A calibração confirma.
    FLIP_HANDEDNESS: true,
    LOST_GRACE_MS: 220,         // segura a mão na tela por esse tempo se sumir
    TRACK_MEMORY_MS: 600,       // memória de posição p/ não trocar esquerda/direita
    LABEL_WEIGHT: 1.0,          // peso do rótulo do MediaPipe na atribuição
    POS_WEIGHT: 4.0,            // peso da continuidade de posição
    // Profundidade virtual (distância da mão à câmera no mundo 3D, em m)
    VIRTUAL_NEAR: 0.28,
    VIRTUAL_FAR: 0.85,
    // Estimativa bruta padrão (sem calibrar) para mão perto/longe
    RAW_NEAR: 0.25,
    RAW_FAR: 0.70,
    HAND_SCALE: 1.0,            // escala da mão virtual
    FOLLOW_RATE: 22,            // velocidade com que a mão desliza até a última detecção (1/s)
    REACH_MARGIN: 0.92,         // alcance calibrado ocupa 92% da tela
  },

  // ---- Filtros One Euro (suavização) ----
  // MIN_CUTOFF menor = mais suave parado (mais atraso); BETA maior = menos atraso rápido
  FILTER: {          // forma dos dedos (relativa ao centro da mão, em metros)
    MIN_CUTOFF: 2.0,
    BETA: 1.0,
    D_CUTOFF: 1.0,
  },
  FILTER_ANCHOR: {   // posição da mão na tela (-1..1)
    MIN_CUTOFF: 1.0,
    BETA: 1.5,
    D_CUTOFF: 1.0,
  },
  FILTER_DEPTH: {    // profundidade estimada (a medida mais tremida)
    MIN_CUTOFF: 0.5,
    BETA: 0.4,
    D_CUTOFF: 1.0,
  },

  // ---- Gestos ----
  GESTURE: {
    STABLE_FRAMES: 3,       // quadros seguidos para aceitar um gesto novo
    // Limiares padrão (a calibração substitui)
    DEFAULT_THRESHOLDS: {
      ext: [0.72, 0.72, 0.72, 0.72], // retidão p/ considerar dedo esticado (indicador..mínimo)
      thumbOut: 0.62,               // polegar afastado do indicador
      pinch: 0.32,                  // distância polegar-indicador (relativa à palma)
      fistIndex: 0.55,              // indicador abaixo disso = dobrado de punho
    },
  },

  // ---- Interação ----
  INTERACTION: {
    TOUCH_DIST: 0.30,       // ponta do indicador até a superfície da caixa (m)
    FALLBACK_TOUCH_DIST: 3.0, // botão "Tocar": abre caixa até essa distância
    WIRES_PER_BOX: 3,
    // dificuldade crescente: fios da 1ª, 2ª, 3ª... caixa consertada.
    // Com mais de 4 fios as cores se repetem (qualquer anel da mesma cor serve).
    WIRE_LEVELS: [3, 3, 4, 4, 5, 5],
    RANDOM_SPOTS: true,     // sorteia o lugar de cada caixa a cada partida
    PANEL_DIST: 0.55,       // painel aparece a essa distância da câmera
    PANEL_DROP: 0.15,       // inclina o painel um pouco abaixo do olhar (rad)
    GRAB_SCREEN_PX: 75,     // raio (px na tela) para pegar um fio
    SNAP_SCREEN_PX: 80,     // raio (px na tela) para encaixar um fio
    PANEL_CLOSE_DIST: 2.5,  // se afastar mais que isso fecha o painel
  },

  // ---- Detector ----
  DETECTOR: {
    NEAR: 1.5,   // verde quando mais perto que isso
    FAR: 15,     // vermelho a partir disso
  },

  // ---- Qualidade / FPS ----
  QUALITY: {
    PIXEL_RATIO: 1.0,       // resolução máxima (1 = um pixel por pixel CSS; celular fica bem mais leve)
    MIN_PIXEL_RATIO: 0.55,  // nunca abaixo disso
    AUTO: true,             // baixa a resolução se o FPS cair, sobe se sobrar
    LOW_FPS: 40,
    HIGH_FPS: 56,
  },

  // ---- Mapa: escola de verdade (modelo 3D original) ----
  MAP: {
    USE_SCHOOL: true,       // false = volta para o mapa de blocos
    // procura o modelo nesses endereços (o 2º é para o arquivo único em dist/)
    URLS: ['models/escola.glb', '../models/escola.glb'],
    SPAWN: [38.5, 0, -60.25], // onde o jogador começa: no corredor coberto do portão (muro oeste)
    SPAWN_YAW: -Math.PI / 2, // olhando para dentro da escola (leste, +x)
    CELL: 0.25,             // tamanho da célula da grade de colisão (m)
    CHAO_MAX: 1.3,          // superfícies horizontais até essa altura contam como chão
    DEGRAU: 0.36,           // maior degrau que dá para subir andando (m)
    PAREDE_DE: 0.35,        // parede só bloqueia entre essa altura...
    PAREDE_ATE: 1.75,       // ...e essa (acima do chão)
    RAIO_JOGADOR: 0.3,
    AREAS: 6,               // áreas com pontos de sinal (1 caixa por área na partida)
    LUGARES_POR_AREA: 4,    // lugares possíveis em cada área (sorteio)
    DIST_MIN: 3,            // distância mínima entre lugares (m)
    LONGE_DO_INICIO: 8,     // nenhum ponto a menos disso do início (m)
    FOG_NEAR: 25,
    FOG_FAR: 75,
  },

  // ---- Modo feira (liga na tela inicial ou com ?feira no link) ----
  FEIRA: {
    GAME_TIME_S: 180,       // partida de 3 min
    TARGETS: ['sala-vermelha', 'cantina', 'quadra', 'biblioteca'], // só 4 caixas
    WIRE_LEVELS: [3, 3, 4, 5], // fios de cada caixa, na ordem em que são abertas
    AUTO_RETURN_S: 25,      // depois do fim, volta sozinho para "próximo jogador"
    TUTORIAL_SPAWN: [0, 0, 7.2], // tutorial começa do lado do pedestal (sem passo de andar)
  },

  // ---- Som e vibração ----
  AUDIO: {
    VOLUME: 0.5,
    BEEP_FAR_S: 1.3,        // intervalo do bipe do detector longe da caixa
    BEEP_NEAR_S: 0.14,      // e perto
    BEEP_MAX_DIST: 18,      // além disso o detector fica quieto
  },

  // ---- Conforto ----
  COMFORT: {
    VIGNETTE_MAX: 0.75,     // escurecimento máximo das bordas ao andar (0..1)
    VIGNETTE_SPEED: 1.0,    // velocidade (m/s) em que a vinheta fica no máximo
  },

  // ---- Caixa perto: faíscas ----
  SPARKS: {
    DIST: 5,                // começa a soltar faíscas a essa distância (m)
    COUNT: 18,
  },

  // ---- Aviso de mão / luz ----
  HAND_HINT: {
    NO_HAND_MS: 3000,       // sem ver nenhuma mão por esse tempo -> "mostre a mão"
    DARK: 38,               // brilho médio da câmera (0..255) abaixo disso -> "pouca luz"
  },

  // ---- Ranking do dia (guardado no celular) ----

  STORAGE_KEY: 'cacador-sinal-calib-v1',
  OPTIONS_KEY: 'cacador-sinal-opcoes-v1',

const WIRE_COLORS = [0xff3b3b, 0x2ecc40, 0x2f7bff, 0xffd400];
const WIRE_NAMES = ['vermelho', 'verde', 'azul', 'amarelo'];

// ===== js/options.js =====
// Opções do jogador (som, vibração, vinheta, modo feira), salvas no aparelho.

const DEFAULTS = { sound: true, vibrate: true, vignette: true, feira: false };

function loadOptions() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(CONFIG.OPTIONS_KEY) || '{}') || {}; } catch (e) { /* sem armazenamento */ }
  const o = { ...DEFAULTS, ...saved };
  // ?feira no link liga o modo feira (?feira=0 desliga)
  try {
    const q = new URLSearchParams(location.search);
    if (q.has('feira')) o.feira = q.get('feira') !== '0';
  } catch (e) { /* */ }
  return o;
}

function saveOptions(o) {
  try { localStorage.setItem(CONFIG.OPTIONS_KEY, JSON.stringify(o)); } catch (e) { /* */ }
}

// ===== js/audio.js =====
// Sons e vibração, todos gerados no código (Web Audio): nenhum arquivo para baixar.
//  - bipe do detector: mais rápido e mais agudo quanto mais perto da caixa
//  - caixa aberta, fio certo/errado, caixa consertada, vitória, derrota
//  - alarme no último minuto e contagem nos últimos 10 s

const A = CONFIG.AUDIO;

class Sfx {
  constructor(options) {
    this.options = options;   // { sound, vibrate } (objeto compartilhado)
    this.ctx = null;
    this.master = null;
    this.nextBeep = 0;
    // o navegador só libera o som depois de um toque: destrava no primeiro
    const unlock = () => this.unlock();
    window.addEventListener('pointerdown', unlock, { capture: true });
    window.addEventListener('keydown', unlock, { capture: true });
  }

  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = A.VOLUME;
        this.master.connect(this.ctx.destination);
      } catch (e) { this.ctx = null; return; }
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  }

  get on() { return this.options.sound && this.ctx && this.ctx.state === 'running'; }

  // nota simples com envelope (ataque curto, queda exponencial)
  _tone(freq, dur, { type = 'sine', gain = 0.5, at = 0, slide = 0 } = {}) {
    if (!this.on) return;
    const c = this.ctx, t = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.master);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  _noise(dur, { gain = 0.3, at = 0, freq = 2000 } = {}) {
    if (!this.on) return;
    const c = this.ctx, t = c.currentTime + at;
    const n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource();
    src.buffer = buf;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
    const g = c.createGain();
    g.gain.value = gain;
    src.connect(f).connect(g).connect(this.master);
    src.start(t);
  }

  vibrate(pattern) {
    if (!this.options.vibrate || !navigator.vibrate) return;
    try { navigator.vibrate(pattern); } catch (e) { /* */ }
  }

  // ---------------- eventos do jogo ----------------
  open() {
    this._noise(0.12, { gain: 0.25, freq: 900 });
    this._tone(330, 0.12, { type: 'square', gain: 0.12, at: 0.03 });
    this._tone(660, 0.16, { type: 'square', gain: 0.1, at: 0.1 });
    this.vibrate(40);
  }

  grab() { this._tone(520, 0.06, { type: 'triangle', gain: 0.2 }); this.vibrate(15); }

  wire(ok) {
    if (ok) {
      this._tone(880, 0.09, { type: 'triangle', gain: 0.35 });
      this._tone(1320, 0.14, { type: 'triangle', gain: 0.3, at: 0.07 });
      this.vibrate(35);
    } else {
      this._tone(180, 0.22, { type: 'sawtooth', gain: 0.2, slide: -60 });
      this.vibrate([60, 40, 60]);
    }
  }

  fixed() {
    [523, 659, 784, 1047].forEach((f, i) => this._tone(f, 0.18, { type: 'triangle', gain: 0.32, at: i * 0.09 }));
    this._noise(0.4, { gain: 0.12, at: 0.3, freq: 5000 });
    this.vibrate([80, 50, 120]);
  }

  win() {
    const notes = [523, 659, 784, 1047, 784, 1047, 1319];
    notes.forEach((f, i) => this._tone(f, 0.22, { type: 'square', gain: 0.14, at: i * 0.13 }));
    this.vibrate([100, 60, 100, 60, 250]);
  }

  lose() {
    [392, 330, 262, 196].forEach((f, i) => this._tone(f, 0.35, { type: 'sawtooth', gain: 0.14, at: i * 0.28, slide: -20 }));
    this.vibrate([300, 100, 300]);
  }

  alarm() {
    for (let i = 0; i < 3; i++) this._tone(990, 0.16, { type: 'square', gain: 0.18, at: i * 0.24, slide: -300 });
    this.vibrate([150, 90, 150, 90, 150]);
  }

  tick(last) { this._tone(last ? 1400 : 1000, 0.07, { type: 'square', gain: 0.14 }); }

  // Bipe do detector: chame todo quadro com a distância até a caixa mais próxima.
  detector(dist, nowS) {
    if (!this.on || dist == null || dist > A.BEEP_MAX_DIST) return;
    if (nowS < this.nextBeep) return;
    const k = Math.min(1, Math.max(0, (dist - CONFIG.DETECTOR.NEAR) / (A.BEEP_MAX_DIST - CONFIG.DETECTOR.NEAR))); // 0 perto, 1 longe
    const interval = A.BEEP_NEAR_S + (A.BEEP_FAR_S - A.BEEP_NEAR_S) * k * k;
    this.nextBeep = nowS + interval;
    this._tone(1500 - 700 * k, 0.05, { type: 'sine', gain: 0.22 - 0.1 * k });
  }

  resetDetector() { this.nextBeep = 0; }
}

// ===== js/ranking.js =====
// Placar e ranking do dia, guardados só neste celular (localStorage).
// Pontos = 100 por caixa consertada + 2 por segundo que sobrou (só se consertou tudo).

const KEY = 'cacador-sinal-ranking-v1';

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function loadAll() {
  try { return JSON.parse(localStorage.getItem(KEY) || '[]') || []; } catch (e) { return []; }
}

function saveAll(list) {
  try { localStorage.setItem(KEY, JSON.stringify(list.slice(-300))); return true; } catch (e) { return false; }
}

function score(fixed, win, timeLeft) {
  return fixed * 100 + (win ? Math.max(0, Math.ceil(timeLeft)) * 2 : 0);
}

// Guarda uma partida e devolve o registro (com id) e a posição no ranking do dia.
function addResult({ fixed, total, used, timeLeft, win, feira }) {
  const list = loadAll();
  const date = today();
  const n = list.filter((r) => r.date === date && r.feira === feira).length + 1;
  const rec = {
    id: `${Date.now()}-${Math.floor(Math.random() * 1e6)}`,
    name: `Jogador ${n}`,
    fixed, total, used: Math.round(used), win, feira, date,
    points: score(fixed, win, timeLeft),
  };
  list.push(rec);
  saveAll(list);
  return { rec, place: topToday(feira, 1000).findIndex((r) => r.id === rec.id) + 1 };
}

function rename(id, name) {
  const list = loadAll();
  const r = list.find((x) => x.id === id);
  if (!r) return;
  r.name = String(name).trim().slice(0, CONFIG.RANKING.NAME_MAX) || r.name;
  saveAll(list);
}

// Melhores do dia: mais pontos, depois menos tempo.
function topToday(feira, n = CONFIG.RANKING.SIZE) {
  const date = today();
  return loadAll()
    .filter((r) => r.date === date && r.feira === feira)
    .sort((a, b) => b.points - a.points || a.used - b.used)
    .slice(0, n);
}

function clearToday(feira) {
  const date = today();
  saveAll(loadAll().filter((r) => !(r.date === date && r.feira === feira)));
}

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

function fmt(s) { return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }

function rankingTable(feira, highlightId = null) {
  const top = topToday(feira);
  if (!top.length) return '<p class="small">Ninguém jogou hoje ainda. Seja o primeiro!</p>';
  const rows = top.map((r, i) => `<tr class="${r.id === highlightId ? 'me' : ''}">
      <td>${['🥇', '🥈', '🥉'][i] || i + 1}</td><td>${esc(r.name)}</td><td>${r.points}</td>
      <td>${r.fixed}/${r.total}</td><td>${fmt(r.used)}</td></tr>`).join('');
  return `<table class="rank"><thead><tr><th></th><th>Nome</th><th>Pontos</th><th>Caixas</th><th>Tempo</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// ===== js/handhint.js =====
// Aviso quando o jogo não vê a mão: "mostre a mão" ou "pouca luz".
// Mede o brilho da câmera numa imagem pequenininha (32x24), duas vezes por segundo.

const HH = CONFIG.HAND_HINT;

class HandHint {
  constructor(app) {
    this.app = app;
    this.el = document.getElementById('hand-hint');
    this.canvas = document.createElement('canvas');
    this.canvas.width = 32;
    this.canvas.height = 24;
    this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
    this.brightness = null;   // 0..255 (média da imagem)
    this.lastSeen = performance.now();
    this.lastMeasure = 0;
    this.shown = '';
    this.lastHudToast = 0;
  }

  _measure() {
    const v = this.app.hands.video;
    if (!v || !v.videoWidth || v.readyState < 2) return;
    try {
      this.ctx.drawImage(v, 0, 0, 32, 24);
      const d = this.ctx.getImageData(0, 0, 32, 24).data;
      let sum = 0;
      for (let i = 0; i < d.length; i += 4) sum += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      this.brightness = sum / (d.length / 4);
    } catch (e) { this.brightness = null; }
  }

  // Chamar todo quadro. active = tutorial ou partida.
  update(now, active) {
    const app = this.app;
    const tracking = !!(app.hands.landmarker && app.hands.stream);
    if (app.hands.hands.some((h) => h.visible)) this.lastSeen = now;
    if (!active || !tracking) { this._set(''); this.lastSeen = now; return; }
    if (now - this.lastMeasure > 500) { this.lastMeasure = now; this._measure(); }
    let msg = '';
    const lost = now - this.lastSeen;
    if (lost > 1500 && this.brightness != null && this.brightness < HH.DARK) {
      msg = '💡 Pouca luz ou câmera tapada: vá para um lugar mais claro e deixe a câmera de trás livre.';
    } else if (lost > HH.NO_HAND_MS) {
      msg = app.stereo || app.xrActive
        ? '✋ Mostre a mão na frente do celular (a tampa da câmera do óculos precisa estar aberta)'
        : '✋ Mostre a mão para a câmera de trás do celular';
    }
    this._set(msg);
    // no óculos o aviso em HTML não aparece: manda para o painel 3D de vez em quando
    if (msg && (app.stereo || app.xrActive) && now - this.lastHudToast > 3000) {
      this.lastHudToast = now;
      app.hud3d.toast(msg.replace(/\(.*\)/, '').trim());
    }
  }

  _set(msg) {
    if (msg === this.shown || !this.el) return;
    this.shown = msg;
    this.el.textContent = msg;
    this.el.classList.toggle('show', !!msg);
  }
}

// ===== js/mapa.js =====
// Mapa da escola de verdade: carrega o modelo 3D original (models/escola.glb)
// e monta, a partir dos próprios triângulos dele, uma grade de colisão:
//  - chão: superfícies quase horizontais até CHAO_MAX de altura (calçada,
//    piso, degraus). Mesas e balcões viram "chão alto" e bloqueiam pelo degrau.
//  - parede: superfícies inclinadas/verticais, guardadas por faixa de altura
//    (assim uma verga em cima da porta não bloqueia a passagem).
//  - coberto: tem laje/telhado em cima (usado para escolher pontos dentro das salas).
// Os pontos de sinal (caixas) são escolhidos sozinhos: lugares alcançáveis a pé,
// encostados em parede, bem espalhados, agrupados em áreas.
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const M = CONFIG.MAP;
const BAND = 0.15;          // altura de cada faixa da parede (m)
const NB = 32;              // faixas (32 bits)

function loadSchoolModel(onProgress) {
  return new Promise((resolve, reject) => {
    const loader = new GLTFLoader();
    const urls = M.URLS.slice();
    const tryNext = () => {
      const url = urls.shift();
      if (!url) { reject(new Error('modelo da escola não encontrado')); return; }
      loader.load(url, (g) => resolve(g.scene), (e) => {
        if (e.total) onProgress && onProgress(e.loaded / e.total);
      }, () => tryNext());
    };
    tryNext();
  });
}

const tick = () => new Promise((r) => setTimeout(r, 0));

class CollisionGrid {
  // root: modelo já na posição final (matrixWorld atualizada)
  static async build(root, onProgress) {
    const g = new CollisionGrid();
    const box = new THREE.Box3().setFromObject(root);
    const C = M.CELL;
    g.cell = C;
    g.x0 = box.min.x - 1; g.z0 = box.min.z - 1;
    g.W = Math.ceil((box.max.x - box.min.x + 2) / C);
    g.H = Math.ceil((box.max.z - box.min.z + 2) / C);
    g.Y0 = box.min.y - 0.2;
    const N = g.W * g.H;
    g.floor = new Float32Array(N).fill(-Infinity);
    g.wall = new Uint32Array(N);
    g.wallY0 = new Float32Array(N).fill(Infinity); // faixa 0 da parede começa no chão da célula
    g.covered = new Uint8Array(N);

    const meshes = [];
    root.traverse((o) => { if (o.isMesh && o.geometry && o.geometry.attributes.position) meshes.push(o); });
    let total = 0;
    for (const m of meshes) total += (m.geometry.index ? m.geometry.index.count : m.geometry.attributes.position.count) / 3;

    // 1ª passada: chão e "coberto"; 2ª passada: paredes (precisa do chão de cada célula)
    const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
    const e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), n = new THREE.Vector3();
    const walls = [];
    let done = 0;
    for (const m of meshes) {
      const pos = m.geometry.attributes.position, idx = m.geometry.index;
      const mw = m.matrixWorld;
      const cnt = idx ? idx.count : pos.count;
      const wp = new Float32Array(pos.count * 3);
      for (let i = 0; i < pos.count; i++) {
        a.fromBufferAttribute(pos, i).applyMatrix4(mw);
        wp[i * 3] = a.x; wp[i * 3 + 1] = a.y; wp[i * 3 + 2] = a.z;
      }
      for (let t = 0; t < cnt; t += 3) {
        const i0 = idx ? idx.getX(t) : t, i1 = idx ? idx.getX(t + 1) : t + 1, i2 = idx ? idx.getX(t + 2) : t + 2;
        a.fromArray(wp, i0 * 3); b.fromArray(wp, i1 * 3); c.fromArray(wp, i2 * 3);
        n.crossVectors(e1.subVectors(b, a), e2.subVectors(c, a));
        const len = n.length();
        if (len < 1e-9) continue;
        const ny = Math.abs(n.y) / len;
        const minY = Math.min(a.y, b.y, c.y), maxY = Math.max(a.y, b.y, c.y);
        if (ny > 0.75) {
          if (maxY <= M.CHAO_MAX) g._raster(a, b, c, C * 0.7, (k, y) => { if (y > g.floor[k]) g.floor[k] = y; });
          else if (minY > 2.0) g._raster(a, b, c, C, (k) => { g.covered[k] = 1; });
        }
        if (ny < 0.75 && minY < M.CHAO_MAX + 2.2) walls.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
      }
      done += cnt / 3;
      onProgress && onProgress(0.5 * done / total);
      await tick();
    }
    // paredes: faixas de altura relativas ao chão da célula
    const nw = walls.length / 9;
    for (let w = 0; w < nw; w++) {
      a.fromArray(walls, w * 9); b.fromArray(walls, w * 9 + 3); c.fromArray(walls, w * 9 + 6);
      g._raster(a, b, c, C * 0.45, (k, y) => {
        const f = g.floor[k] === -Infinity ? 0 : g.floor[k];
        const band = Math.floor((y - f) / BAND);
        if (band >= 0 && band < NB) g.wall[k] |= (1 << band);
      });
      if ((w & 8191) === 0) { onProgress && onProgress(0.5 + 0.5 * w / nw); await tick(); }
    }
    // máscara das faixas que bloqueiam (joelho até a cabeça)
    let mask = 0;
    for (let i = 0; i < NB; i++) {
      const y0 = i * BAND, y1 = y0 + BAND;
      if (y1 > M.PAREDE_DE && y0 < M.PAREDE_ATE) mask |= (1 << i);
    }
    g.mask = mask >>> 0;
    g.refY = 0;
    onProgress && onProgress(1);
    return g;
  }

  // Amostra pontos no triângulo (espaçamento ~step) e chama fn(célula, y).
  _raster(a, b, c, step, fn) {
    const lab = a.distanceTo(b), lac = a.distanceTo(c), lbc = b.distanceTo(c);
    const nu = Math.max(1, Math.ceil(Math.max(lab, lac, lbc) / step));
    for (let i = 0; i <= nu; i++) {
      for (let j = 0; j <= nu - i; j++) {
        const u = i / nu, v = j / nu, w = 1 - u - v;
        const x = a.x * w + b.x * u + c.x * v;
        const y = a.y * w + b.y * u + c.y * v;
        const z = a.z * w + b.z * u + c.z * v;
        const k = this.key(x, z);
        if (k >= 0) fn(k, y);
      }
    }
  }

  key(x, z) {
    const i = Math.floor((x - this.x0) / this.cell), j = Math.floor((z - this.z0) / this.cell);
    if (i < 0 || j < 0 || i >= this.W || j >= this.H) return -1;
    return j * this.W + i;
  }

  floorAt(x, z) {
    const k = this.key(x, z);
    return k < 0 || this.floor[k] === -Infinity ? null : this.floor[k];
  }

  // célula onde dá para ficar em pé vindo da altura fromY
  _cellOk(k, fromY) {
    if (k < 0) return false;
    const f = this.floor[k];
    if (f === -Infinity || Math.abs(f - fromY) > M.DEGRAU) return false;
    return (this.wall[k] & this.mask) === 0;
  }

  isFree(x, z, r, fromY = this.refY) {
    const C = this.cell, n = Math.ceil(r / C);
    const ci = Math.floor((x - this.x0) / C), cj = Math.floor((z - this.z0) / C);
    for (let dj = -n; dj <= n; dj++) {
      for (let di = -n; di <= n; di++) {
        const i = ci + di, j = cj + dj;
        // só as células que encostam no círculo do jogador
        const cx = this.x0 + (i + 0.5) * C, cz = this.z0 + (j + 0.5) * C;
        if (Math.hypot(cx - x, cz - z) > r + C * 0.5) continue;
        if (i < 0 || j < 0 || i >= this.W || j >= this.H) return false;
        if (!this._cellOk(j * this.W + i, fromY)) return false;
      }
    }
    return true;
  }

  // primeiro ponto onde o segmento a->b bate em parede ou entra no chão
  segmentHit(a, b) {
    const len = a.distanceTo(b);
    const steps = Math.max(1, Math.ceil(len / 0.1));
    const p = new THREE.Vector3();
    for (let s = 1; s <= steps; s++) {
      p.lerpVectors(a, b, s / steps);
      const k = this.key(p.x, p.z);
      if (k < 0) return { point: p.clone() };
      const f = this.floor[k] === -Infinity ? 0 : this.floor[k];
      const band = Math.floor((p.y - f) / BAND);
      if (p.y < f - 0.05) return { point: p.clone() };
      if (band >= 0 && band < NB && (this.wall[k] & (1 << band))) return { point: p.clone() };
    }
    return null;
  }

  // Células alcançáveis a pé a partir de (x, z): busca em largura.
  reachable(x, z, r) {
    const N = this.W * this.H;
    const seen = new Uint8Array(N);
    const fy = new Float32Array(N);
    const start = this.key(x, z);
    if (start < 0) return seen;
    const q = new Int32Array(N);
    let h = 0, t = 0;
    q[t++] = start; seen[start] = 1; fy[start] = this.floor[start] === -Infinity ? 0 : this.floor[start];
    while (h < t) {
      const k = q[h++];
      const i = k % this.W, j = (k / this.W) | 0;
      for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const ni = i + di, nj = j + dj;
        if (ni < 0 || nj < 0 || ni >= this.W || nj >= this.H) continue;
        const nk = nj * this.W + ni;
        if (seen[nk]) continue;
        const cx = this.x0 + (ni + 0.5) * this.cell, cz = this.z0 + (nj + 0.5) * this.cell;
        if (!this.isFree(cx, cz, r, fy[k])) continue;
        seen[nk] = 1; fy[nk] = this.floor[nk]; q[t++] = nk;
      }
    }
    return seen;
  }

  // perto de parede (distância em células)?
  nearWall(k, dist) {
    const i = k % this.W, j = (k / this.W) | 0;
    for (let dj = -dist; dj <= dist; dj++) {
      for (let di = -dist; di <= dist; di++) {
        const ni = i + di, nj = j + dj;
        if (ni < 0 || nj < 0 || ni >= this.W || nj >= this.H) continue;
        if (this.wall[nj * this.W + ni] & this.mask) return true;
      }
    }
    return false;
  }
}

// Escolhe os pontos de sinal: alcançáveis, encostados em parede, de preferência
// cobertos (dentro das salas/corredores), espalhados. Agrupa em AREAS áreas,
// cada uma com alguns lugares (a partida sorteia um lugar por área).
function autoTargets(grid, spawn, boxHalf) {
  const seen = grid.reachable(spawn.x, spawn.z, M.RAIO_JOGADOR);
  const cand = [];
  const C = grid.cell;
  for (let k = 0; k < seen.length; k++) {
    if (!seen[k]) continue;
    const i = k % grid.W, j = (k / grid.W) | 0;
    if ((i + j) % 2) continue; // metade das células já basta
    const x = grid.x0 + (i + 0.5) * C, z = grid.z0 + (j + 0.5) * C;
    if (Math.hypot(x - spawn.x, z - spawn.z) < M.LONGE_DO_INICIO) continue;
    if (!grid.nearWall(k, 3)) continue;
    // a caixa precisa caber: livre num raio pequeno
    if (!grid.isFree(x, z, 0.3, grid.floor[k])) continue;
    cand.push({ x, z, y: grid.floor[k], covered: grid.covered[k] });
  }
  // prefere lugares cobertos (dentro); se tiver poucos, usa todos
  const inside = cand.filter((p) => p.covered);
  const pool = inside.length > 60 ? inside : cand;
  // espalha: escolhe o mais longe dos já escolhidos (farthest point)
  const spots = [];
  if (pool.length) {
    let best = pool[Math.floor(pool.length / 2)];
    spots.push(best);
    const dmin = new Float32Array(pool.length).fill(Infinity);
    while (spots.length < M.AREAS * M.LUGARES_POR_AREA) {
      let bi = -1, bd = -1;
      for (let p = 0; p < pool.length; p++) {
        const d = Math.hypot(pool[p].x - best.x, pool[p].z - best.z);
        if (d < dmin[p]) dmin[p] = d;
        if (dmin[p] > bd) { bd = dmin[p]; bi = p; }
      }
      if (bi < 0 || bd < M.DIST_MIN) break;
      best = pool[bi];
      spots.push(best);
    }
  }
  // agrupa em áreas: k-means simples (começa pelos primeiros, que já estão espalhados)
  const K = Math.min(M.AREAS, spots.length);
  let centers = spots.slice(0, K).map((p) => ({ x: p.x, z: p.z }));
  let groups = [];
  for (let it = 0; it < 12; it++) {
    groups = centers.map(() => []);
    for (const p of spots) {
      let bi = 0, bd = Infinity;
      centers.forEach((c, ci) => { const d = Math.hypot(c.x - p.x, c.z - p.z); if (d < bd) { bd = d; bi = ci; } });
      groups[bi].push(p);
    }
    centers = groups.map((g, gi) => (g.length ? { x: g.reduce((s, p) => s + p.x, 0) / g.length, z: g.reduce((s, p) => s + p.z, 0) / g.length } : centers[gi]));
  }
  // áreas em ordem de distância do início (área 1 = mais perto)
  const areas = groups.filter((g) => g.length).map((g, gi) => ({ g, d: Math.hypot(centers[gi].x - spawn.x, centers[gi].z - spawn.z) }))
    .sort((p, q) => p.d - q.d);
  return areas.map(({ g }, ai) => ({
    id: `area-${ai + 1}`,
    name: `área ${ai + 1}`,
    spots: g.map((p) => ({ pos: [p.x, p.y + boxHalf, p.z], normal: [0, 1, 0] })),
  }));
}

// ===== js/filters.js =====
// Filtro One Euro (Casiez et al. 2012): suaviza tremor quando a mão está
// parada e reduz atraso quando ela se move rápido.

function alpha(cutoff, dt) {
  const tau = 1 / (2 * Math.PI * cutoff);
  return 1 / (1 + tau / dt);
}

class OneEuro {
  constructor(minCutoff, beta, dCutoff) {
    this.minCutoff = minCutoff;
    this.beta = beta;
    this.dCutoff = dCutoff;
    this.x = null;
    this.dx = 0;
    this.t = 0;
  }

  reset() { this.x = null; this.dx = 0; }

  filter(value, tSec) {
    if (this.x === null) { this.x = value; this.t = tSec; return value; }
    const dt = Math.max(1e-3, tSec - this.t);
    this.t = tSec;
    const dxRaw = (value - this.x) / dt;
    this.dx += alpha(this.dCutoff, dt) * (dxRaw - this.dx);
    const cutoff = this.minCutoff + this.beta * Math.abs(this.dx);
    this.x += alpha(cutoff, dt) * (value - this.x);
    return this.x;
  }
}

// Filtro para um Vector3 (3 filtros escalares).
class OneEuro3 {
  constructor(cfg) {
    this.f = [0, 1, 2].map(() => new OneEuro(cfg.MIN_CUTOFF, cfg.BETA, cfg.D_CUTOFF));
  }
  reset() { this.f.forEach((f) => f.reset()); }
  filter(v, tSec) {
    v.x = this.f[0].filter(v.x, tSec);
    v.y = this.f[1].filter(v.y, tSec);
    v.z = this.f[2].filter(v.z, tSec);
    return v;
  }
}

// Troca o mapa de blocos pela escola de verdade (modelo 3D original).
// onStatus(texto, fração 0..1). Se falhar, o mapa de blocos continua.
async function loadSchool(world, scene, onStatus = () => {}) {
  const model = await loadSchoolModel((f) => onStatus('Baixando a escola', f * 0.7));
  onStatus('Montando a escola', 0.7);
  model.name = 'escola';
  scene.add(model);
  model.updateMatrixWorld(true);
  const grid = await CollisionGrid.build(model, (f) => onStatus('Calculando paredes e chão', 0.7 + f * 0.28));
  const S = CONFIG.MAP;
  const spawn = new THREE.Vector3(S.SPAWN[0], 0, S.SPAWN[2]);
  spawn.y = grid.floorAt(spawn.x, spawn.z) ?? 0;
  // pontos de sinal escolhidos sozinhos + caixa do tutorial na frente do início
  const defs = autoTargets(grid, spawn, BH);
  const tut = tutorialSpot(grid, spawn);
  defs.unshift({ id: 'tutorial', name: 'início', tutorial: true, wires: 1, spots: [{ pos: [tut.x, tut.y + BH, tut.z], normal: [0, 1, 0] }] });

  scene.remove(world.deco);
  world.deco.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
  world.blocks.length = 0;
  world.school = true;
  world.model = model;
  world.grid = grid;
  world.spawn = spawn;
  world.targetDefs = defs;
  // modo feira: o tutorial começa a 1,1 m da caixa (sem passo de andar)
  const yaw = S.SPAWN_YAW;
  world.tutorialSpawn = new THREE.Vector3(tut.x + Math.sin(yaw) * 1.1, tut.y, tut.z + Math.cos(yaw) * 1.1);
  world.feiraTargets = defs.filter((d) => !d.tutorial).slice(0, CONFIG.FEIRA.TARGETS.length).map((d) => d.id);
  world.isFree = (x, z, r, fromY) => grid.isFree(x, z, r, fromY);
  world.segmentHit = (a, b) => grid.segmentHit(a, b);
  world.floorAt = (x, z) => grid.floorAt(x, z);
  scene.fog = new THREE.Fog(0xcfe2f2, S.FOG_NEAR, S.FOG_FAR);
  placeTargets(world, scene, false);
  onStatus('Escola pronta', 1);
  return world;
}

// Lugar da caixa do tutorial: chão livre a ~2,5 m na frente do início.
function tutorialSpot(grid, spawn) {
  const yaw = CONFIG.MAP.SPAWN_YAW;
  for (let d = 2.5; d > 0.8; d -= 0.25) {
    for (const off of [0, 0.4, -0.4, 0.8, -0.8]) {
      const x = spawn.x - Math.sin(yaw + off) * d, z = spawn.z - Math.cos(yaw + off) * d;
      const f = grid.floorAt(x, z);
      if (f != null && Math.abs(f - spawn.y) < 0.3 && grid.isFree(x, z, 0.3, f)) return { x, y: f, z };
    }
  }
  return { x: spawn.x, y: spawn.y, z: spawn.z - 2 };
}

// Cria (ou recria) as caixas. random = sorteia um spot por lugar.
function placeTargets(world, scene, random = false) {
  for (const t of world.targets) {
    scene.remove(t.group);
    t.group.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
  }
  world.targets = (world.targetDefs || TARGET_DEFS).map((def) => {
    const spot = random ? def.spots[Math.floor(Math.random() * def.spots.length)] : def.spots[0];
    return createTarget(scene, { ...def, pos: spot.pos, normal: spot.normal });
  });
}

    blocks.push({ mesh, box: new THREE.Box3(new THREE.Vector3(x0, y0, z0), new THREE.Vector3(x1, y1, z1)) });
    // sombra de contato: escurece o chão em volta da base do bloco
    if (y0 === 0) addShadow((x0 + x1) / 2, (z0 + z1) / 2, (x1 - x0) + 0.9, (z1 - z0) + 0.9);
    else if (y0 > 2) addShadow((x0 + x1) / 2, (z0 + z1) / 2, (x1 - x0) + 0.4, (z1 - z0) + 0.4, 0.35); // teto
  }

  // árvores: tronco (bloco com colisão) + copa (só visual)
  const leafMat = new THREE.MeshLambertMaterial({ color: 0x3e8e41 });
  const leafGeo = new THREE.IcosahedronGeometry(1.1, 1);
  for (const [x, z] of TREES) {
    const trunk = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: 0x7b5233 }));
    trunk.scale.set(0.3, 1.8, 0.3);
    trunk.position.set(x, 0.9, z);
    deco.add(trunk);
    blocks.push({ mesh: trunk, box: new THREE.Box3(new THREE.Vector3(x - 0.15, 0, z - 0.15), new THREE.Vector3(x + 0.15, 1.8, z + 0.15)) });
    const crown = new THREE.Mesh(leafGeo, leafMat);
    crown.position.set(x, 2.5, z);
    crown.scale.set(1, 0.9, 1);
    deco.add(crown);
    addShadow(x, z, 2.4, 2.4, 0.45);
  }

  const world = {
    blocks,
    deco,
    targets: [],
    spawn: new THREE.Vector3(0, 0, 10),
    bounds: 19.5,
    school: false,
    floorAt() { return 0; },

    // Primeiro bloco atingido pelo segmento a->b (ou null).
    segmentHit(a, b) {
      const len = a.distanceTo(b);
      if (len < 1e-6) return null;
      tmpRay.origin.copy(a);
      tmpRay.direction.subVectors(b, a).divideScalar(len);
      let best = null;
      let bestD = len;
      for (const bl of blocks) {
        const p = tmpRay.intersectBox(bl.box, tmpV);
        if (!p) continue;
        const d = p.distanceTo(a);
        if (d <= bestD) { bestD = d; best = { point: p.clone(), block: bl }; }
      }
      return best;
    },

    // Ponto do chão livre de blocos (com raio do jogador)?
    isFree(x, z, r) {
      if (Math.abs(x) > this.bounds || Math.abs(z) > this.bounds) return false;
      for (const bl of blocks) {
        const b = bl.box;
        if (b.min.y > CONFIG.EYE_HEIGHT + 0.2) continue; // teto alto não bloqueia
        if (x > b.min.x - r && x < b.max.x + r && z > b.min.z - r && z < b.max.z + r) return false;
      }
      return true;
    },
  };

  placeTargets(world, scene, false);
  return world;
}

function createTarget(scene, def) {
  const group = new THREE.Group();
  group.position.fromArray(def.pos);
  scene.add(group);

  const normal = new THREE.Vector3().fromArray(def.normal);
  const black = new THREE.MeshLambertMaterial({ color: 0x111111 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(BOX_SIZE, BOX_SIZE, BOX_SIZE), black);
  group.add(body);

  // Tampa: placa fina na face exposta
  const lid = new THREE.Mesh(new THREE.BoxGeometry(BOX_SIZE * 1.04, 0.04, BOX_SIZE * 1.04), new THREE.MeshLambertMaterial({ color: 0x222222 }));
  lid.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);
  const lidClosed = normal.clone().multiplyScalar(BOX_SIZE / 2 + 0.02);
  lid.position.copy(lidClosed);
  group.add(lid);

  // LED piscando (ajuda a achar a caixa)
  const led = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), new THREE.MeshBasicMaterial({ color: 0xff2222 }));
  led.position.copy(normal).multiplyScalar(BOX_SIZE / 2 + 0.05);
  // desloca o LED para um canto da face
  const side = Math.abs(normal.y) > 0.5 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
  led.position.addScaledVector(side, BOX_SIZE * 0.32);
  group.add(led);

  // "Sinal" dentro da caixa
  const signal = new THREE.Mesh(new THREE.IcosahedronGeometry(0.11, 1), new THREE.MeshBasicMaterial({ color: 0xff4444, wireframe: true }));
  signal.visible = false;
  group.add(signal);

  // Faíscas (aparecem quando o jogador chega perto de uma caixa quebrada)
  const S = CONFIG.SPARKS;
  const sparkPos = new Float32Array(S.COUNT * 3);
  const sparkGeo = new THREE.BufferGeometry();
  sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
  const sparkMat = new THREE.PointsMaterial({ color: 0xffd54a, size: 0.05, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending });
  const sparks = new THREE.Points(sparkGeo, sparkMat);
  sparks.frustumCulled = false;
  sparks.visible = false;
  group.add(sparks);
  const sparkData = [];
  for (let i = 0; i < S.COUNT; i++) sparkData.push({ p: new THREE.Vector3(), v: new THREE.Vector3(), life: -Math.random() });
  // Brilho em volta (anel que pulsa virado para fora da face exposta)
  const glow = new THREE.Mesh(new THREE.RingGeometry(BOX_SIZE * 0.62, BOX_SIZE * 0.8, 32),
    new THREE.MeshBasicMaterial({ color: 0xff3b3b, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
  glow.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
  glow.position.copy(normal).multiplyScalar(BOX_SIZE / 2 + 0.03);
  glow.visible = false;
  group.add(glow);

  // sombra no chão (só para caixa no chão): vai junto com a caixa quando ela é sorteada
  if (def.normal[1] > 0.5) {
    const sh = new THREE.Mesh(new THREE.PlaneGeometry(BOX_SIZE + 0.5, BOX_SIZE + 0.5),
      new THREE.MeshBasicMaterial({ map: getShadowTexture(), transparent: true, opacity: 0.6, depthWrite: false }));
    sh.rotation.x = -Math.PI / 2;
    sh.position.y = 0.008 - BOX_SIZE / 2; // no apoio (chão, mesa, estante)
    group.add(sh);
  }

  const center = new THREE.Vector3().fromArray(def.pos);
  const half = BOX_SIZE / 2;
  return {
    id: def.id,
    name: def.name || def.id,
    tutorial: !!def.tutorial,
    wires: def.wires || CONFIG.INTERACTION.WIRES_PER_BOX,
    group, body, lid, led, signal, normal, lidClosed,
    sparks, sparkData, glow, near: 0,
    center,
    aabb: new THREE.Box3(center.clone().subScalar(half), center.clone().addScalar(half)),
    state: 'closed', // closed | open | fixed
    openT: 0,
  };
}

// Atualiza animações das caixas (tampa abrindo, LED piscando, sinal girando,
// faíscas quando o jogador está perto). isHot(t) diz se a caixa vale agora.
function animateTargets(targets, dt, timeSec, playerPos = null, isHot = null) {
  for (const t of targets) {
    t.group.visible = !t.off;
    if (t.off) continue;
    // 0 = longe, 1 = colado na caixa
    let near = 0;
    if (playerPos && t.state !== 'fixed' && (!isHot || isHot(t))) {
      tmpV.set(playerPos.x, t.center.y, playerPos.z);
      near = Math.max(0, 1 - tmpV.distanceTo(t.center) / CONFIG.SPARKS.DIST);
    }
    t.near += (near - t.near) * Math.min(1, dt * 4);
    animateSparks(t, dt, timeSec);
    const goal = t.state === 'closed' ? 0 : 1;
    t.openT += Math.sign(goal - t.openT) * Math.min(Math.abs(goal - t.openT), dt * 3);
    const k = t.state === 'fixed' ? 0.25 : t.openT; // consertada: tampa quase fechada
    t.lid.position.copy(t.lidClosed).addScaledVector(t.normal, k * 0.22);
    t.signal.visible = t.openT > 0.05;
    t.signal.position.copy(t.normal).multiplyScalar(0.1 + 0.25 * t.openT);
    t.signal.rotation.y += dt * 2;
    t.signal.rotation.x += dt * 1.3;
    if (t.state === 'fixed') {
      t.led.material.color.setHex(0x22ff55);
      t.signal.material.color.setHex(0x22ff55);
      t.body.material.color.setHex(0x1e8f3a);
    } else {
      t.led.visible = Math.sin(timeSec * 8) > -0.2;
      t.led.material.color.setHex(0xff2222);
      t.signal.material.color.setHex(0xff4444);
      t.body.material.color.setHex(0x111111);
    }
    if (t.state === 'fixed') t.led.visible = true;
    else if (t.near > 0.05) {
      // perto: LED pisca mais rápido e cresce
      t.led.visible = Math.sin(timeSec * (8 + 16 * t.near)) > -0.4;
      t.led.scale.setScalar(1 + t.near * 0.8);
    } else t.led.scale.setScalar(1);
  }
}

function animateSparks(t, dt, timeSec) {
  const k = t.near;
  const on = k > 0.02;
  t.glow.visible = on;
  t.sparks.visible = on || t.sparks.material.opacity > 0.02;
  if (on) {
    const pulse = 0.5 + 0.5 * Math.sin(timeSec * (5 + 6 * k));
    t.glow.material.opacity = k * (0.25 + 0.45 * pulse);
    t.glow.scale.setScalar(1 + 0.15 * pulse * k);
  }
  t.sparks.material.opacity += ((on ? 0.6 + 0.4 * k : 0) - t.sparks.material.opacity) * Math.min(1, dt * 6);
  if (!t.sparks.visible) return;
  const arr = t.sparks.geometry.attributes.position.array;
  const half = BOX_SIZE / 2;
  t.sparkData.forEach((s, i) => {
    s.life -= dt * 1.6;
    if (s.life <= 0) {
      if (!on || Math.random() > 0.25 + 0.75 * k) { s.p.set(0, -999, 0); s.life = Math.random() * 0.4; }
      else {
        // nasce num ponto da face exposta e sai voando para fora
        s.p.copy(t.normal).multiplyScalar(half + 0.02);
        s.p.x += (Math.random() - 0.5) * BOX_SIZE * (1 - Math.abs(t.normal.x));
        s.p.y += (Math.random() - 0.5) * BOX_SIZE * (1 - Math.abs(t.normal.y));
        s.p.z += (Math.random() - 0.5) * BOX_SIZE * (1 - Math.abs(t.normal.z));
        s.v.copy(t.normal).multiplyScalar(0.6 + Math.random() * 0.8);
        s.v.x += (Math.random() - 0.5) * 1.4; s.v.y += Math.random() * 1.2; s.v.z += (Math.random() - 0.5) * 1.4;
        s.life = 0.35 + Math.random() * 0.45;
      }
    } else {
      s.v.y -= 3.5 * dt; // gravidade
      s.p.addScaledVector(s.v, dt);
    }
    arr[i * 3] = s.p.x; arr[i * 3 + 1] = s.p.y; arr[i * 3 + 2] = s.p.z;
  });
  t.sparks.geometry.attributes.position.needsUpdate = true;
}

// Piso claro em placas de 1 m, com rejunte e leve variação de tom.
function makeFloorTexture(tiles) {
  const S = 256, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const N = 4; // 4x4 placas por imagem
  const t = S / N;
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const v = 238 + Math.floor(Math.random() * 12);
      g.fillStyle = `rgb(${v},${v},${v - 3})`;
      g.fillRect(i * t, j * t, t, t);
      for (let k = 0; k < 60; k++) { // pontinhos (textura de concreto)
        const w = Math.random() * 10 - 5;
        g.fillStyle = `rgba(${120 + w * 8},${120 + w * 8},${120 + w * 8},0.06)`;
        g.fillRect(i * t + Math.random() * t, j * t + Math.random() * t, 2, 2);
      }
    }
  }
  g.strokeStyle = 'rgba(150,150,150,0.55)';
  g.lineWidth = 2;
  for (let i = 0; i <= N; i++) {
    g.beginPath(); g.moveTo(i * t, 0); g.lineTo(i * t, S); g.stroke();
    g.beginPath(); g.moveTo(0, i * t); g.lineTo(S, i * t); g.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(tiles / N, tiles / N);
  tex.anisotropy = 4;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

let shadowTexCache = null;
function getShadowTexture() { return shadowTexCache || (shadowTexCache = makeShadowTexture()); }

// Sombra suave (centro escuro, bordas transparentes).
function makeShadowTexture() {
  const S = 128, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(S / 2, S / 2, S * 0.18, S / 2, S / 2, S * 0.5);
  grd.addColorStop(0, 'rgba(0,0,0,0.55)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, S, S);
  return new THREE.CanvasTexture(c);
}

// ===== js/orientation.js =====
// Rotação do celular -> rotação da câmera 3D.
// Usa RelativeOrientationSensor (Chrome Android, menor latência) e cai para
// DeviceOrientationEvent se não estiver disponível. No PC, arrastar o mouse gira.

const Q_WORLD = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2);
const Z_AXIS = new THREE.Vector3(0, 0, 1);
const Y_AXIS = new THREE.Vector3(0, 1, 0);
const DEG = Math.PI / 180;

class OrientationController {
  constructor(camera) {
    this.camera = camera;
    this.source = 'nenhum';
    this.deviceQ = new THREE.Quaternion();
    this.offset = new THREE.Quaternion();
    this.hasData = false;
    this.eventCount = 0;
    this.manualYaw = 0;
    this.manualPitch = 0;
    this._euler = new THREE.Euler();
    this._q0 = new THREE.Quaternion();
    this._fwd = new THREE.Vector3();
    this._onDO = this._onDeviceOrientation.bind(this);
  }

  // Precisa ser chamado a partir de um toque do usuário (iOS exige).
  async requestPermission() {
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const r = await DeviceOrientationEvent.requestPermission();
        if (r !== 'granted') return false;
      }
    } catch (e) { console.warn('Permissão de orientação:', e); return false; }
    return true;
  }

  async start(mode = 'auto') {
    this.stop();
    if (mode !== 'event' && 'RelativeOrientationSensor' in window) {
      const ok = await this._startSensor();
      if (ok) return this.source;
    }
    window.addEventListener('deviceorientation', this._onDO);
    this.source = 'deviceorientation';
    return this.source;
  }

  stop() {
    window.removeEventListener('deviceorientation', this._onDO);
    if (this.sensor) { try { this.sensor.stop(); } catch (e) { /* ignore */ } this.sensor = null; }
    this.hasData = false;
  }

  _startSensor() {
    return new Promise((resolve) => {
      let done = false;
      const finish = (ok) => { if (!done) { done = true; resolve(ok); } };
      try {
        const s = new RelativeOrientationSensor({ frequency: 60, referenceFrame: 'screen' });
        s.addEventListener('reading', () => {
          if (!s.quaternion) return;
          const [x, y, z, w] = s.quaternion;
          // Sensor: quaternion do aparelho em relação à Terra (Z para cima).
          // Three.js: Y para cima -> gira -90° em X.
          this.deviceQ.set(x, y, z, w).premultiply(Q_WORLD);
          this.hasData = true;
          this.eventCount++;
          finish(true);
        });
        s.addEventListener('error', (e) => { console.warn('Sensor falhou:', e.error); try { s.stop(); } catch (_) { /* */ } finish(false); });
        s.start();
        this.sensor = s;
        this.source = 'RelativeOrientationSensor';
        setTimeout(() => { if (!this.hasData) { try { s.stop(); } catch (_) { /* */ } this.sensor = null; finish(false); } }, 1200);
      } catch (e) {
        console.warn('Sensor indisponível:', e);
        finish(false);
      }
    });
  }

  _onDeviceOrientation(e) {
    if (e.alpha === null && e.beta === null && e.gamma === null) return; // PC sem sensor
    const alpha = (e.alpha || 0) * DEG;
    const beta = (e.beta || 0) * DEG;
    const gamma = (e.gamma || 0) * DEG;
    const orient = ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * DEG;
    // Fórmula clássica (antigo DeviceOrientationControls do three.js)
    this._euler.set(beta, alpha, -gamma, 'YXZ');
    this.deviceQ.setFromEuler(this._euler);
    this.deviceQ.multiply(this._q0.set(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)));
    this.deviceQ.multiply(this._q0.setFromAxisAngle(Z_AXIS, -orient));
    this.hasData = true;
    this.eventCount++;
  }

  // Faz a direção atual virar "frente" (-Z do mundo / do jogador).
  recenter() {
    if (this.hasData) {
      this._fwd.set(0, 0, -1).applyQuaternion(this.deviceQ);
      const yaw = Math.atan2(-this._fwd.x, -this._fwd.z);
      this.offset.setFromAxisAngle(Y_AXIS, -yaw);
    } else {
      this.manualYaw = 0;
      this.manualPitch = 0;
    }
  }

  // Arrastar com mouse/dedo (só quando não há sensor)
  addManual(dx, dy) {
    this.manualYaw -= dx * 0.005;
    this.manualPitch = THREE.MathUtils.clamp(this.manualPitch - dy * 0.005, -1.45, 1.45);
  }

  update() {
    if (this.hasData) {
      this.camera.quaternion.multiplyQuaternions(this.offset, this.deviceQ);
    } else {
      this._euler.set(this.manualPitch, this.manualYaw, 0, 'YXZ');
      this.camera.quaternion.setFromEuler(this._euler);
    }
  }
}

// ===== js/hands.js =====
// Rastreamento das mãos com MediaPipe Hand Landmarker (câmera traseira).
// - Atribui cada detecção à mão ESQUERDA ou DIREITA com estabilização
//   (rótulo do MediaPipe + continuidade de posição), para não trocar quando
//   a mão some por alguns quadros.
// - Recria a mão no espaço da câmera 3D (esqueleto de esferas e linhas),
//   usando a posição na imagem + estimativa de profundidade pelo tamanho.
// - Suaviza com filtro One Euro.

const MP_VERSION = '0.10.14';
const WASM_URL = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/wasm`;
const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const BUNDLE_CJS = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/vision_bundle.cjs`;

// Worker (thread separada): a detecção das mãos não trava mais o desenho da tela.
// Criado a partir de um Blob para funcionar também na versão em arquivo único.
const WORKER_SRC = `
let lm = null;
function opts(m, delegate) {
  return { baseOptions: { modelAssetPath: m.modelUrl, delegate }, runningMode: 'VIDEO', numHands: m.numHands,
    minHandDetectionConfidence: m.c1, minHandPresenceConfidence: m.c2, minTrackingConfidence: m.c3 };
}
self.onmessage = async (e) => {
  const m = e.data;
  if (m.type === 'init') {
    try {
      self.exports = {};
      importScripts(m.bundleUrl);
      const v = self.exports;
      const fs = await v.FilesetResolver.forVisionTasks(m.wasmUrl);
      let delegate = 'GPU';
      try { lm = await v.HandLandmarker.createFromOptions(fs, opts(m, 'GPU')); }
      catch (err) { delegate = 'CPU'; lm = await v.HandLandmarker.createFromOptions(fs, opts(m, 'CPU')); }
      postMessage({ type: 'ready', delegate });
    } catch (err) { postMessage({ type: 'error', message: String((err && err.message) || err) }); }
  } else if (m.type === 'frame') {
    let res = null;
    const t0 = performance.now();
    try { res = lm.detectForVideo(m.bitmap, m.ts); } catch (err) { /* quadro perdido */ }
    try { m.bitmap.close(); } catch (err) { /* */ }
    postMessage({ type: 'result', ms: performance.now() - t0, res: res && {
      landmarks: res.landmarks, worldLandmarks: res.worldLandmarks, handedness: res.handedness || res.handednesses } });
  }
};`;

const BONES = [
  [0, 1], [1, 2], [2, 3], [3, 4],
  [0, 5], [5, 6], [6, 7], [7, 8],
  [5, 9], [9, 10], [10, 11], [11, 12],
  [9, 13], [13, 14], [14, 15], [15, 16],
  [13, 17], [0, 17], [17, 18], [18, 19], [19, 20],
];

const H = CONFIG.HANDS;

class Hand {
  constructor(side) {
    this.side = side;            // 'left' | 'right' (mão real do jogador)
    this.visible = false;        // mostrar na tela (inclui tempo de tolerância)
    this.present = false;        // detectada no último quadro processado
    this.lastSeen = -1e9;        // ms
    this.lastC = { x: 0.5, y: 0.5 };
    this.lm = null;              // landmarks normalizados da imagem
    this.wlm = null;             // landmarks "world" (metros, centrados na mão)
    this.rawLabel = '';
    this.score = 0;
    this.rawDepth = 0;
    this.uv = { x: 0.5, y: 0.5 };
    this.camPts = Array.from({ length: 21 }, () => new THREE.Vector3());
    this.worldPts = Array.from({ length: 21 }, () => new THREE.Vector3());
    this.targetPts = Array.from({ length: 21 }, () => new THREE.Vector3()); // última detecção (filtrada)
    this.filters = Array.from({ length: 21 }, () => new OneEuro3(CONFIG.FILTER)); // forma dos dedos
    this.anchorFilter = new OneEuro3(CONFIG.FILTER_ANCHOR);  // posição da mão na tela
    this.depthFilter = new OneEuro(CONFIG.FILTER_DEPTH.MIN_CUTOFF, CONFIG.FILTER_DEPTH.BETA, CONFIG.FILTER_DEPTH.D_CUTOFF);
    this.rawDepthF = 0;
    this.snap = true;            // próxima atualização copia direto (sem deslizar)
    // preenchido por gestures.js
    this.features = null;
    this.gesture = 'none';
    this.gestureConf = 0;
    this.gestureSince = 0;
    this.candidate = 'none';
    this.candidateCount = 0;
    this.prevGesture = 'none';
  }
}

class HandTracker {
  constructor(calib) {
    this.calib = calib;
    this.video = document.getElementById('cam');
    this.landmarker = null;
    this.delegate = '';
    this.stream = null;
    this.lastVideoTime = -1;
    this.lastTs = 0;
    this.frame = 0;
    this.detectMs = 0;
    this.detectFps = 0;
    this._detCount = 0;
    this._detT0 = performance.now();
    this.lastResult = null;
    this.left = new Hand('left');
    this.right = new Hand('right');
    this.hands = [this.left, this.right];
    this._p = new THREE.Vector3();
  }

  get(side) { return side === 'left' ? this.left : this.right; }

  async startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('Este navegador não dá acesso à câmera (precisa de HTTPS).');
    }
    const video = { facingMode: { ideal: 'environment' }, width: { ideal: H.VIDEO_W }, height: { ideal: H.VIDEO_H }, frameRate: { ideal: 30 } };
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video });
    this.video.srcObject = this.stream;
    this.video.muted = true;
    this.video.setAttribute('playsinline', '');
    await this.video.play();
  }

  async loadModel(onStatus = () => {}) {
    if (H.USE_WORKER && typeof Worker !== 'undefined' && typeof createImageBitmap === 'function') {
      try { await this._initWorker(onStatus); return; } catch (e) {
        console.warn('Worker falhou, usando a thread principal', e);
        onStatus('Modo rápido indisponível, usando o modo normal…');
        if (this.worker) { this.worker.terminate(); this.worker = null; }
      }
    }
    await this._initMainThread(onStatus);
  }

  _initWorker(onStatus) {
    onStatus('Carregando modelo das mãos (modo rápido)…');
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }));
      const w = new Worker(url);
      this.worker = w;
      const timer = setTimeout(() => reject(new Error('tempo esgotado')), 45000);
      w.onerror = (e) => { clearTimeout(timer); reject(new Error(e.message || 'erro no worker')); };
      w.onmessage = (e) => {
        const m = e.data;
        if (m.type === 'ready') {
          clearTimeout(timer);
          this.delegate = `${m.delegate} worker`;
          this.landmarker = 'worker';
          w.onmessage = (ev) => this._onWorkerMessage(ev.data);
          resolve();
        } else if (m.type === 'error') { clearTimeout(timer); reject(new Error(m.message)); }
      };
      // endereços completos: o worker nasce de um Blob e não entende caminhos relativos
      // (o servidor local troca a CDN por /cdn/...)
      const abs = (u) => new URL(u, location.href).href;
      w.postMessage({ type: 'init', bundleUrl: abs(BUNDLE_CJS), wasmUrl: abs(WASM_URL), modelUrl: abs(MODEL_URL), numHands: H.NUM_HANDS,
        c1: H.MIN_DETECTION_CONF, c2: H.MIN_PRESENCE_CONF, c3: H.MIN_TRACKING_CONF });
    });
  }

  _onWorkerMessage(m) {
    if (m.type === 'result') { this._busy = false; if (m.res) this._workerResult = m; }
  }

  async _initMainThread(onStatus) {
    onStatus('Baixando MediaPipe…');
    const vision = await import('@mediapipe/tasks-vision');
    const fileset = await vision.FilesetResolver.forVisionTasks(WASM_URL);
    const opts = (delegate) => ({
      baseOptions: { modelAssetPath: MODEL_URL, delegate },
      runningMode: 'VIDEO',
      numHands: H.NUM_HANDS,
      minHandDetectionConfidence: H.MIN_DETECTION_CONF,
      minHandPresenceConfidence: H.MIN_PRESENCE_CONF,
      minTrackingConfidence: H.MIN_TRACKING_CONF,
    });
    onStatus('Carregando modelo das mãos (GPU)…');
    try {
      this.landmarker = await vision.HandLandmarker.createFromOptions(fileset, opts('GPU'));
      this.delegate = 'GPU';
    } catch (e) {
      console.warn('GPU falhou, usando CPU', e);
      onStatus('GPU indisponível, carregando em CPU…');
      this.landmarker = await vision.HandLandmarker.createFromOptions(fileset, opts('CPU'));
      this.delegate = 'CPU';
    }
  }

  // Chamar todo quadro, depois de atualizar a câmera 3D.
  // Retorna true se houve uma detecção nova neste quadro.
  update(nowMs, camera) {
    this.frame++;
    let fresh = this._pendingFresh || false;
    this._pendingFresh = false;
    const v = this.video;
    const minGap = 1000 / H.MAX_DETECT_HZ;
    if (this.worker && this.landmarker) {
      // ---- modo rápido: manda o quadro para o worker e segue desenhando ----
      if (this._busy && nowMs - this._lastSend > 4000) this._busy = false; // quadro perdido
      if (!this._busy && v.readyState >= 2 && v.currentTime !== this.lastVideoTime && nowMs - (this._lastSend || 0) >= minGap) {
        this._busy = true;
        this._lastSend = nowMs;
        this.lastVideoTime = v.currentTime;
        const ts = Math.max(nowMs, this.lastTs + 1);
        this.lastTs = ts;
        const vw = v.videoWidth, vh = v.videoHeight;
        const sc = Math.min(1, H.WORKER_MAX_SIDE / Math.max(vw, vh));
        createImageBitmap(v, { resizeWidth: Math.round(vw * sc), resizeHeight: Math.round(vh * sc), resizeQuality: 'low' })
          .then((bmp) => this.worker.postMessage({ type: 'frame', bitmap: bmp, ts }, [bmp]))
          .catch(() => { this._busy = false; });
      }
      if (this._workerResult) {
        const m = this._workerResult;
        this._workerResult = null;
        this.detectMs = this.detectMs * 0.85 + m.ms * 0.15;
        this._process(m.res, nowMs, camera);
        this.lastResult = m.res;
        fresh = true;
        this._countDetection(nowMs);
      }
    } else if (this.landmarker && v.readyState >= 2 && v.currentTime !== this.lastVideoTime &&
        this.frame % H.DETECT_EVERY_N_FRAMES === 0 && nowMs - (this._lastSend || 0) >= minGap) {
      this._lastSend = nowMs;
      this.lastVideoTime = v.currentTime;
      const ts = Math.max(nowMs, this.lastTs + 1);
      this.lastTs = ts;
      const t0 = performance.now();
      let res = null;
      try { res = this.landmarker.detectForVideo(v, ts); } catch (e) { console.warn(e); }
      const ms = performance.now() - t0;
      this.detectMs = this.detectMs * 0.85 + ms * 0.15;
      if (res) { this._process(res, nowMs, camera); this.lastResult = res; fresh = true; }
      this._countDetection(nowMs);
    }

    // A detecção chega a 15–30/s e a tela roda a ~60: os pontos exibidos
    // deslizam até o alvo a cada quadro, para a mão não andar "aos pulos".
    const dt = Math.min(0.1, Math.max(0, (nowMs - (this._lastUpdate || nowMs)) / 1000));
    this._lastUpdate = nowMs;
    const k = 1 - Math.exp(-dt * H.FOLLOW_RATE);
    for (const h of this.hands) {
      h.visible = nowMs - h.lastSeen < H.LOST_GRACE_MS;
      if (!h.visible) { h.present = false; h.snap = true; continue; }
      for (let i = 0; i < 21; i++) {
        if (h.snap) h.camPts[i].copy(h.targetPts[i]); else h.camPts[i].lerp(h.targetPts[i], k);
        h.worldPts[i].copy(h.camPts[i]).applyMatrix4(camera.matrixWorld);
      }
      h.snap = false;
    }
    return fresh;
  }

  _countDetection(nowMs) {
    this._detCount++;
    if (nowMs - this._detT0 > 1000) {
      this.detectFps = (this._detCount * 1000) / (nowMs - this._detT0);
      this._detCount = 0;
      this._detT0 = nowMs;
    }
  }

  // Injeta um resultado "falso" (usado pelos testes automáticos).
  injectResult(res, nowMs, camera) {
    this._process(res, nowMs, camera);
    this.lastResult = res;
    this._pendingFresh = true;
  }

  _process(res, nowMs, camera) {
    const handed = res.handedness || res.handednesses || [];
    const dets = (res.landmarks || []).map((lm, i) => {
      const cat = handed[i] && handed[i][0];
      const label = cat ? cat.categoryName : 'Left';
      const score = cat ? cat.score : 0.5;
      let isLeft = label === 'Left';
      if (this.calib.flipHandedness) isLeft = !isLeft;
      return { lm, wlm: res.worldLandmarks[i], label, score, pLeft: isLeft ? score : 1 - score, c: { x: lm[9].x, y: lm[9].y } };
    });

    const assigned = this._assign(dets, nowMs);
    for (const h of this.hands) h.present = false;
    for (const [hand, det] of assigned) this._applyDetection(hand, det, nowMs, camera);
  }

  _cost(det, hand, nowMs) {
    const labelCost = hand.side === 'left' ? 1 - det.pLeft : det.pLeft;
    let c = labelCost * H.LABEL_WEIGHT;
    if (nowMs - hand.lastSeen < H.TRACK_MEMORY_MS) {
      c += Math.hypot(det.c.x - hand.lastC.x, det.c.y - hand.lastC.y) * H.POS_WEIGHT;
    } else {
      c += 0.25 * H.POS_WEIGHT * 0.5; // sem memória: só o rótulo decide
    }
    return c;
  }

  _assign(dets, nowMs) {
    const L = this.left, R = this.right;
    if (dets.length === 0) return [];
    if (dets.length === 1) {
      const d = dets[0];
      return [[this._cost(d, L, nowMs) <= this._cost(d, R, nowMs) ? L : R, d]];
    }
    const [a, b] = dets;
    const ab = this._cost(a, L, nowMs) + this._cost(b, R, nowMs);
    const ba = this._cost(a, R, nowMs) + this._cost(b, L, nowMs);
    return ab <= ba ? [[L, a], [R, b]] : [[R, a], [L, b]];
  }

  // Converte posição na imagem (0..1) em coordenadas normalizadas da tela (-1..1)
  mapUV(u, v, camera) {
    const reach = this.calib.reach;
    if (reach && reach.uMax - reach.uMin > 0.1 && reach.vMax - reach.vMin > 0.1) {
      const m = H.REACH_MARGIN;
      return {
        x: (((u - reach.uMin) / (reach.uMax - reach.uMin)) * 2 - 1) * m,
        y: -(((v - reach.vMin) / (reach.vMax - reach.vMin)) * 2 - 1) * m,
      };
    }
    // Sem calibração de alcance: imagem "cobrindo" a tela (como object-fit: cover)
    const vw = this.video.videoWidth || H.VIDEO_W;
    const vh = this.video.videoHeight || H.VIDEO_H;
    const va = vw / vh;
    const sa = camera.aspect;
    if (va > sa) {
      const vis = sa / va;
      return { x: (u - 0.5) / (vis / 2), y: -(v - 0.5) / 0.5 };
    }
    const vis = va / sa;
    return { x: (u - 0.5) / 0.5, y: -(v - 0.5) / (vis / 2) };
  }

  depthFromRaw(raw) {
    const { rawNear, rawFar } = this.calib.depth;
    let t = (raw - rawNear) / Math.max(1e-3, rawFar - rawNear);
    t = THREE.MathUtils.clamp(t, -0.3, 1.3);
    return Math.max(0.15, THREE.MathUtils.lerp(H.VIRTUAL_NEAR, H.VIRTUAL_FAR, t));
  }

  _applyDetection(hand, det, nowMs, camera) {
    const { lm, wlm } = det;
    const vw = this.video.videoWidth || H.VIDEO_W;
    const vh = this.video.videoHeight || H.VIDEO_H;
    const m = Math.max(vw, vh);
    const d2 = (a, b) => Math.hypot((lm[a].x - lm[b].x) * vw / m, (lm[a].y - lm[b].y) * vh / m);
    const d3 = (a, b) => Math.hypot(wlm[a].x - wlm[b].x, wlm[a].y - wlm[b].y, wlm[a].z - wlm[b].z);
    const img = d2(0, 5) + d2(0, 17) + d2(5, 17) + d2(0, 9);
    const real = d3(0, 5) + d3(0, 17) + d3(5, 17) + d3(0, 9);
    hand.rawDepth = real / Math.max(img, 1e-4);

    if (nowMs - hand.lastSeen > H.LOST_GRACE_MS) {
      hand.filters.forEach((f) => f.reset());
      hand.anchorFilter.reset();
      hand.depthFilter.reset();
      hand.snap = true;
    }
    hand.lastSeen = nowMs;
    hand.present = true;
    hand.lastC = det.c;
    hand.uv = det.c;
    hand.lm = lm;
    hand.wlm = wlm;
    hand.rawLabel = det.label;
    hand.score = det.score;

    const tSec = nowMs / 1000;
    // 1) posição na tela e profundidade: filtros separados (a profundidade é o mais tremido)
    const ndc = this.mapUV(lm[9].x, lm[9].y, camera);
    this._p.set(ndc.x, ndc.y, 0);
    hand.anchorFilter.filter(this._p, tSec);
    hand.rawDepthF = hand.depthFilter.filter(hand.rawDepth, tSec);
    const d = this.depthFromRaw(hand.rawDepthF);
    const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
    const tanH = tanV * camera.aspect;
