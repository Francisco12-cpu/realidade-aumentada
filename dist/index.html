<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0b1118">
  <title>Escola Zumbi — protótipo</title>
  <style>
:root {
  --bg: #0b1118;
  --panel: rgba(11, 17, 24, 0.86);
  --text: #f2f6fa;
  --muted: #9fb0c0;
  --accent: #00e5ff;
  --ok: #3ddc84;
  --bad: #ff5468;
  --btn: rgba(255, 255, 255, 0.14);
  --btn-on: rgba(0, 229, 255, 0.45);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 5; }

button {
  font: inherit; color: var(--text); background: var(--btn); border: 1px solid rgba(255,255,255,0.18);
  border-radius: 12px; padding: 10px 14px; min-height: 44px; cursor: pointer; touch-action: manipulation;
}
button.primary { background: var(--accent); color: #00222a; border-color: transparent; font-weight: 600; }
button.on { background: var(--btn-on); }
button:disabled { opacity: 0.5; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 2; display: none; }
#hud.active { display: block; }
#hud-top {
  position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
  display: flex; gap: 12px; align-items: center; background: var(--panel); padding: 6px 14px; border-radius: 999px;
  font-weight: 700; font-variant-numeric: tabular-nums;
}
#timer.urgent { color: var(--bad); }
#compass { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; font-size: 14px; white-space: nowrap; }
#compass[hidden] { display: none; }
#compass-arrow { display: inline-block; color: var(--accent); font-size: 16px; }
#crosshair {
  position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px;
  border: 2px solid rgba(255,255,255,0.35); border-radius: 50%; display: none;
}
#crosshair.on { display: block; border-color: var(--accent); }
#fps {
  position: fixed; left: calc(8px + env(safe-area-inset-left)); top: calc(8px + env(safe-area-inset-top));
  font: 12px ui-monospace, monospace; background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 6px; z-index: 6; pointer-events: none;
}

/* ---------- Botões ---------- */
#controls {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
  display: flex; gap: 6px; padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  overflow-x: auto; scrollbar-width: none; background: linear-gradient(transparent, rgba(0,0,0,0.45));
}
#controls::-webkit-scrollbar { display: none; }
#controls button { flex: 0 0 auto; padding: 8px 11px; font-size: 14px; }

/* ---------- Depuração ---------- */
#debug {
  position: fixed; right: calc(6px + env(safe-area-inset-right)); bottom: calc(66px + env(safe-area-inset-bottom));
  width: min(360px, calc(64vw - 12px)); max-height: 34vh; overflow: auto;
  background: rgba(0,0,0,0.72); border-radius: 10px; padding: 8px 10px; z-index: 6;
  font: 12px/1.4 ui-monospace, monospace; pointer-events: none;
}
#debug-stats > div { margin-bottom: 3px; }
#preview {
  position: fixed; left: calc(6px + env(safe-area-inset-left)); bottom: calc(66px + env(safe-area-inset-bottom));
  width: 34vw; max-width: 200px; z-index: 6; border-radius: 8px; overflow: hidden; pointer-events: none; border: 1px solid #fff4;
}
#preview video, #preview canvas { display: block; width: 100%; height: auto; }
#preview canvas { position: absolute; inset: 0; height: 100%; }
body.sheet-bottom #preview, body.sheet-bottom #debug { top: calc(34px + env(safe-area-inset-top)); bottom: auto; max-height: 24vh; }
/* vídeo continua tocando (MediaPipe precisa) mas fica invisível */
/* v23: o vídeo fica ATRÁS do jogo (no canto, coberto pela imagem 3D): o
   navegador acha que ele está visível e não pausa (no Android ele pausava o
   vídeo escondido e a mão sumia) */
#gl { z-index: 1; }
#preview.offscreen { left: 0; top: 0; bottom: auto; width: 160px; max-width: none; height: 120px; opacity: 1; border: 0; border-radius: 0; z-index: 0; }
#preview.offscreen video { width: 100%; height: 100%; object-fit: cover; }
#preview.offscreen canvas { display: none; }

.ok { color: var(--ok); }
.bad { color: var(--bad); }
.small { font-size: 12.5px; color: var(--muted); }

/* ---------- Overlay (calibração/tutorial/fim) ---------- */
#overlay {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; max-height: 72vh; display: flex; justify-content: center;
  padding: 0 10px calc(62px + env(safe-area-inset-bottom)); pointer-events: none;
}
#overlay[hidden] { display: none; }
#overlay .sheet {
  pointer-events: auto; width: min(560px, 100%); max-height: calc(72vh - 62px); overflow: auto;
  background: var(--panel); border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 14px 16px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
#overlay h2 { margin: 0 0 6px; font-size: 18px; }
#overlay p { margin: 6px 0; }
#overlay .live { margin: 8px 0; min-height: 1.4em; font-size: 14px; color: #dff; }
#overlay .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
#overlay.compact { top: calc(48px + env(safe-area-inset-top)); bottom: auto; padding-bottom: 0; }
#overlay.compact .sheet { padding: 10px 12px; font-size: 13.5px; max-height: 40vh; }
#overlay.compact h2 { font-size: 15px; }
#overlay.compact .btns { margin-top: 4px; }
#overlay.compact .btns button { min-height: 36px; padding: 6px 12px; }
#overlay.compact .live { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,0.08); color: var(--muted); }
.chip.cur { background: rgba(0,229,255,0.2); color: var(--text); }
.chip.done { color: var(--ok); }

#toast {
  position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 8;
  background: var(--panel); padding: 8px 16px; border-radius: 12px; opacity: 0; transition: opacity 0.2s; pointer-events: none;
  max-width: 86vw; text-align: center;
}
#toast.show { opacity: 1; }
.fatal { position: fixed; inset: 20px; background: #300; padding: 20px; border-radius: 12px; z-index: 99; }

/* ---------- Modo óculos ---------- */
#btn-vradjust { display: none; }
body.stereo #btn-vradjust { display: inline-block; }
body.stereo #hud, body.stereo #debug, body.stereo #preview:not(.offscreen), body.stereo #toast { display: none !important; }
body.stereo #overlay { display: none; }
body.stereo #fps { opacity: 0.5; }
/* botões escondidos no óculos; um toque na tela mostra */
body.stereo #controls { transform: translateY(110%); transition: transform 0.2s; }
body.stereo.vr-ui #controls, body.stereo.vr-adjust #controls { transform: none; }
/* tela de ajuste: folha compacta embaixo, sem cobrir o centro das lentes */
body.stereo.vr-adjust #overlay { display: flex; top: auto; bottom: 0; max-height: 46vh; padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
body.stereo.vr-adjust #overlay .sheet { max-height: calc(46vh - 60px); width: min(720px, 100%); font-size: 13px; padding: 8px 12px; }
#rotate-hint {
  display: none; position: fixed; inset: 0; z-index: 9; background: rgba(0,0,0,0.88);
  align-items: center; justify-content: center; text-align: center; padding: 30px; font-size: 20px;
}
@media (orientation: portrait) { body.stereo #rotate-hint { display: flex; } }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; margin: 4px 0; }
.slider input[type=range] { grid-column: 1 / 3; width: 100%; accent-color: var(--accent); }
.slider b { font-variant-numeric: tabular-nums; }
.sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
@media (max-width: 560px) { .sliders { grid-template-columns: 1fr; } }
.steps { margin: 6px 0; padding-left: 20px; }
.steps li { margin: 6px 0; }

/* ---------- Modo de locomoção ---------- */
body.mode-correr #btn-aim, body.mode-correr #btn-teleport, body.mode-palma #btn-aim, body.mode-palma #btn-teleport { display: none; }
body.mode-teleporte #btn-run { display: none; }

/* ---------- Opções (tela inicial / próximo jogador) ---------- */
.opts { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
.opts .opt { min-height: 40px; padding: 8px 12px; font-size: 14px; }
.opts .opt.on { background: var(--btn-on); border-color: var(--accent); }

/* ---------- Aviso de mão / luz ---------- */
#hand-hint {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  max-width: min(92vw, 520px); padding: 10px 16px; border-radius: 14px; z-index: 6; pointer-events: none;
  background: rgba(255, 196, 0, 0.92); color: #1d1400; font-weight: 600; text-align: center;
  opacity: 0; transition: opacity 0.25s;
}
#hand-hint.show { opacity: 1; }
body.stereo #hand-hint { display: none; }

/* ---------- Placar / ranking ---------- */
.score { font-size: 16px; }
.name-row { display: flex; gap: 8px; margin: 8px 0; }
.name-row input {
  flex: 1; min-width: 0; font: inherit; color: var(--text); background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.25); border-radius: 12px; padding: 8px 12px;
  user-select: text; -webkit-user-select: text; touch-action: manipulation;
}
table.rank { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.rank th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 6px; }
table.rank td { padding: 5px 6px; border-top: 1px solid rgba(255,255,255,0.08); }
table.rank tr.me td { background: rgba(0, 229, 255, 0.18); font-weight: 600; }

/* ---- Dica dos gestos (cantinho da tela) ---- */
#coach {
  position: fixed; left: 10px; bottom: 74px; z-index: 6; max-width: min(300px, 62vw);
  background: rgba(14, 8, 8, 0.72); color: #fff; border-radius: 14px; padding: 8px 10px;
  font-size: 13px; line-height: 1.3; pointer-events: none; box-shadow: 0 2px 10px rgba(0,0,0,.35);
}
#coach .title { font-weight: 700; color: #ffd36b; margin-bottom: 4px; }
#coach .row { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 8px; }
#coach .row .ic { font-size: 18px; width: 30px; text-align: center; }
#coach .row.cur { background: rgba(255, 60, 60, 0.35); font-weight: 700; }
#coach .row.act { background: rgba(80, 220, 120, 0.3); }
#coach .row.done { color: #8fe3a8; }
#coach .row .ok { margin-left: auto; }
#coach .gun { display: block; margin-top: 4px; font-weight: 700; }
#coach .gun.ready { color: #ff4a4a; }
#coach .gun.reload { color: #b0b4ba; }
#coach .note { margin-top: 6px; font-size: 12px; color: #e8e8e8; }
body.stereo #coach, body.xr #coach { display: none; }
#btn-skip { display: none; position: fixed; right: 10px; bottom: 74px; z-index: 6; }
body.tutorial:not(.stereo):not(.xr) #btn-skip { display: block; }

/* v25: escolha do modo (mãos / controle) */
#overlay .modes { display: flex; gap: 8px; margin: 4px 0 8px; }
#overlay .modes .mode { flex: 1; min-height: 58px; font-size: 17px; line-height: 1.2; opacity: 0.6; }
#overlay .modes .mode.on { opacity: 1; background: var(--accent); color: #00222a; font-weight: 600; border-color: transparent; }

/* v14: botão grande "Jogar no óculos" e código do perfil */
#overlay .btns button.big { flex: 1 1 100%; min-height: 64px; font-size: 20px; }
#overlay textarea { width: 100%; box-sizing: border-box; font: 12px monospace; background: #0b1118; color: #d8e2ea; border: 1px solid #2a3a48; border-radius: 8px; padding: 6px; word-break: break-all; }
</style>

    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

    }

<body>
  <canvas id="gl"></canvas>
  <div id="fade"></div>

  <!-- HUD do jogo -->
  <div id="hud">
    <div id="hud-top">
      <span id="timer">0:00</span>
      <span id="count"></span>
      <span id="compass" hidden><span id="compass-arrow">▲</span> <span id="compass-text"></span></span>
    </div>
    <div id="crosshair"></div>
  </div>
  <div id="fps">— FPS</div>

  <!-- Botões alternativos aos gestos (protótipo) -->
  <div id="controls">
    <button id="btn-recenter" title="Recentrar a direção">⟲</button>
    <button id="btn-run" title="Segure para andar para onde está olhando">🏃 Andar</button>
    <button id="btn-aim" title="Mirar teleporte (liga/desliga)">🎯 Mirar</button>
    <button id="btn-teleport" title="Confirmar teleporte">🚀 Ir</button>
    <button id="btn-shoot" title="Atirar no centro da tela (tecla espaço)">🔫 Atirar</button>
    <button id="btn-stereo" title="Modo óculos (tela dividida)">👓 Óculos</button>
    <button id="btn-vradjust" title="Ajustar o óculos">🔧 Ajustar</button>
    <button id="btn-sound" title="Som liga/desliga">🔊</button>
    <button id="btn-help" title="Ajuda">❓</button>
    <button id="btn-full" title="Tela cheia">⛶</button>
    <button id="btn-debug" title="Painel de depuração">🐞</button>
    <button id="btn-calib" title="Recalibrar">⚙</button>
  </div>

  <!-- Depuração -->
  <div id="debug" hidden>
    <div id="debug-stats"></div>
  </div>
  <div id="preview" class="offscreen">
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="cam2d"></canvas>
  </div>

  <!-- Calibração / tutorial / fim -->
  <div id="overlay" hidden></div>
  <div id="toast"></div>
  <div id="hand-hint"></div>
  <!-- dica dos gestos no cantinho -->
  <div id="coach" hidden></div>
  <button id="btn-skip">Pular tutorial ⏭</button>
  <div id="rotate-hint">📱↔ Vire o celular deitado para usar o óculos</div>

  <noscript>Este protótipo precisa de JavaScript.</noscript>
  <script type="module">
import * as THREE from 'three';
// ===== js/config.js =====
// =====================================================================
// Caçador de Sinal — configuração central.
// Todos os valores "de ajuste" do protótipo ficam aqui, para facilitar
// testes no celular sem caçar números espalhados pelo código.
// =====================================================================

const CONFIG = {
  // ---- Jogador / câmera ----
  EYE_HEIGHT: 1.6,          // altura dos olhos (m)
  CAMERA_FOV: 70,           // FOV vertical da câmera 3D (graus)

  // ---- Partida ----
  GAME_TIME_S: 300,         // duração da partida (5 min)

  // ---- Locomoção ----
  VERSION: 'v26',
  // 'palma' = palma aberta anda para onde olha (mais simples) · 'correr' = balançar as mãos / correr parado · 'teleporte'
  LOCOMOTION: 'palma',

  // ---- Corrida ----
  RUN: {
    WALK_SPEED: 2.0,        // m/s no modo 'palma' (andar rápido)
    MAX_SPEED: 3.2,         // m/s no modo 'correr' com balanço máximo
    ACCEL: 6,               // m/s² para ganhar velocidade
    DECEL: 8,               // m/s² para parar
    ENERGY_SMOOTH: 6,       // suavização da intensidade (1/s)
    BOB: 0.045,             // balanço do passo (m)
    USE_HANDS: true,        // balançar as mãos na frente da câmera
    USE_JOG: true,          // correr parado (sensor de movimento do celular)
    SWING_WINDOW_MS: 900,   // janela para medir o balanço
    SWING_FLIP_SPEED: 0.25, // velocidade mínima (m/s) para contar ida/volta
    SWING_MIN_FLIPS: 2,     // idas e voltas necessárias na janela (evita andar ao esticar a mão)
    SWING_START: 0.3,       // velocidade média da mão (m/s) para começar a andar
    SWING_FULL: 1.1,        // velocidade média da mão para correr no máximo
    JOG_WINDOW_MS: 900,
    JOG_FLIP_ACC: 1.2,      // m/s² mínimo de cada "quique"
    JOG_MIN_FLIPS: 3,
    JOG_START: 1.2,         // aceleração (RMS, m/s²) para começar a andar
    JOG_FULL: 4.0,          // para correr no máximo
  },

  // ---- Teleporte ----
  TELEPORT: {
    MAX_DIST: 4.0,          // distância máxima por salto (m, no plano do chão)
    MIN_DIST: 0.6,          // saltos menores que isso são ignorados
    COOLDOWN_S: 0.9,        // espera mínima entre saltos
    CONFIRM_WINDOW_S: 0.9,  // tempo para abrir a palma depois da pistolinha
    PLAYER_RADIUS: 0.3,     // não pousar a menos disso de um bloco
    FADE_MS: 160,
    MODE: 'dash',           // 'dash' = desliza rápido até o alvo · 'fade' = pisca a tela
    DASH_MS_BASE: 120,      // duração do deslize = base + por metro
    DASH_MS_PER_M: 45,      //   (4 m ≈ 0,3 s)
    DASH_BOB: 0.035,        // balanço vertical do "passo" (m)
    AIM_MODE: 'olhar',      // 'olhar' = alvo na direção olho→mão (estável) · 'dedo' = para onde o dedo aponta
    AIM_SMOOTH: 12,         // suavização da direção da mira (maior = responde mais rápido, treme mais)
    TARGET_SMOOTH: 10,      // suavização do marcador no chão
    AIM_GRACE_MS: 350,      // a mira continua esse tempo se a pistolinha "piscar"
    AIM_WRIST_BLEND: 0.4,   // (modo 'dedo') 0 = só o dedo indicador; 1 = só pulso→ponta
  },

  // ---- Mãos (MediaPipe) ----
  HANDS: {
    NUM_HANDS: 2,
    VIDEO_W: 640,
    VIDEO_H: 480,
    USE_WORKER: true,           // detecção numa thread separada (muito mais FPS)
    WORKER_MAX_SIDE: 480,       // reduz a imagem enviada ao worker (px do lado maior)
    WORKER_MIN_SIDE: 480,       // (igual ao máximo: diminuir a imagem piorava a detecção das mãos)
    MAX_DETECT_HZ: 30,          // detecções por segundo, no máximo
    DETECT_EVERY_N_FRAMES: 1,   // (modo normal) 2 = detecta em quadros alternados
    MIN_DETECTION_CONF: 0.4,    // mais baixo = acha a mão mais fácil (com pouca luz também)
    MIN_PRESENCE_CONF: 0.4,
    MIN_TRACKING_CONF: 0.4,
    // MediaPipe supõe imagem espelhada (selfie). Na câmera traseira o rótulo
    // vem invertido, então por padrão invertemos. A calibração confirma.
    FLIP_HANDEDNESS: true,
    LOST_GRACE_MS: 500,         // segura a mão na tela por esse tempo se sumir
    EDGE_MARGIN: 0.12,          // v24: mão sumiu a menos disso da borda da imagem = seta "saiu por aqui"
    DUP_DIST: 0.08,             // duas detecções mais perto que isso (fração da imagem) = a mesma mão
    GHOST_DIST: 0.15,           // mão "pulou" de lado: a cópia antiga perto disso some na hora
    // 'real' = mão no mesmo ângulo e distância da mão de verdade (v16) · 'tela' = imagem esticada na tela (antigo)
    MAP_MODE: 'real',
    CAM_FOV_LONG: 64,           // ângulo de visão da câmera traseira no lado maior da imagem (graus)
    REAL_NEAR: 0.2,             // (real) distância mínima/máxima da mão (m)
    REAL_FAR: 0.75,
    TRACK_MEMORY_MS: 600,       // memória de posição p/ não trocar esquerda/direita
    LABEL_WEIGHT: 1.0,          // peso do rótulo do MediaPipe na atribuição
    SIDE_WEIGHT: 0.8,           // v22: peso do lado da imagem (esquerda/direita) na atribuição
    SIDE_AVG: 0.12,             // v22: média do rótulo por detecção (~1 s)
    SWAP_BELOW: 0.25,           // v22: se a média do rótulo cair abaixo disso, a mão troca de lado
    POS_WEIGHT: 4.0,            // peso da continuidade de posição
    // Profundidade virtual (distância da mão à câmera no mundo 3D, em m)
    VIRTUAL_NEAR: 0.28,
    VIRTUAL_FAR: 0.85,
    // Estimativa bruta padrão (sem calibrar) para mão perto/longe
    RAW_NEAR: 0.25,
    RAW_FAR: 0.70,
    HAND_SCALE: 1.0,            // escala da mão virtual
    FOLLOW_RATE: 22,            // velocidade com que a mão desliza até a última detecção (1/s)
    REACH_MARGIN: 0.92,         // alcance calibrado ocupa 92% da tela
  },

  // ---- Filtros One Euro (suavização) ----
  // MIN_CUTOFF menor = mais suave parado (mais atraso); BETA maior = menos atraso rápido
  FILTER: {          // forma dos dedos (relativa ao centro da mão, em metros)
    MIN_CUTOFF: 2.0,
    BETA: 1.0,
    D_CUTOFF: 1.0,
  },
  FILTER_ANCHOR: {   // posição da mão na tela (-1..1)
    MIN_CUTOFF: 0.8,
    BETA: 0.8,
    D_CUTOFF: 1.0,
  },
  FILTER_DEPTH: {    // profundidade estimada (a medida mais tremida)
    MIN_CUTOFF: 0.3,
    BETA: 0.2,
    D_CUTOFF: 1.0,
  },

  // ---- Gestos ----
  GESTURE: {
    STABLE_FRAMES: 2,       // quadros seguidos para aceitar um gesto novo

const DEFAULTS = { sound: true, vibrate: true, vignette: true, feira: false, tutorial: true, parado: false, controle: false, music: true };

function loadOptions() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(CONFIG.OPTIONS_KEY) || '{}') || {}; } catch (e) { /* sem armazenamento */ }
  const o = { ...DEFAULTS, ...saved };
  // ?feira no link liga o modo feira (?feira=0 desliga)
  try {
    const q = new URLSearchParams(location.search);
    if (q.has('feira')) o.feira = q.get('feira') !== '0';
  } catch (e) { /* */ }
  return o;
}

function saveOptions(o) {
  try { localStorage.setItem(CONFIG.OPTIONS_KEY, JSON.stringify(o)); } catch (e) { /* */ }
}

// ===== js/audio.js =====
// Sons e vibração, todos gerados no código (Web Audio): nenhum arquivo para baixar.
//  - bipe do detector: mais rápido e mais agudo quanto mais perto da caixa
//  - caixa aberta, fio certo/errado, caixa consertada, vitória, derrota
//  - alarme no último minuto e contagem nos últimos 10 s

const A = CONFIG.AUDIO;

class Sfx {
  constructor(options) {
    this.options = options;   // { sound, vibrate } (objeto compartilhado)
    this.ctx = null;
    this.master = null;
    this.nextBeep = 0;
    // o navegador só libera o som depois de um toque: destrava no primeiro
    const unlock = () => this.unlock();
    window.addEventListener('pointerdown', unlock, { capture: true });
    window.addEventListener('keydown', unlock, { capture: true });
  }

  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = A.VOLUME;
        this.master.connect(this.ctx.destination);
        // v26: música baixa num canal separado
        this.musicBus = this.ctx.createGain();
        this.musicBus.gain.value = 0;
        this.musicBus.connect(this.ctx.destination);
      } catch (e) { this.ctx = null; return; }
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  }

  get on() { return this.options.sound && this.ctx && this.ctx.state === 'running'; }

  // nota simples com envelope (ataque curto, queda exponencial)
  _tone(freq, dur, { type = 'sine', gain = 0.5, at = 0, slide = 0, dest = null } = {}) {
    if (!this.on) return;
    const c = this.ctx, t = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(dest || this.master);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  _noise(dur, { gain = 0.3, at = 0, freq = 2000, q = 0.8, dest = null } = {}) {
    if (!this.on) return;
    const c = this.ctx, t = c.currentTime + at;
    const n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource();
    src.buffer = buf;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain();
    g.gain.value = gain;
    src.connect(f).connect(g).connect(dest || this.master);
    src.start(t);
  }

  vibrate(pattern) {
    if (!this.options.vibrate || !navigator.vibrate) return;
    try { navigator.vibrate(pattern); } catch (e) { /* */ }
  }

  // ---------------- eventos do jogo ----------------
  open() {
    this._noise(0.12, { gain: 0.25, freq: 900 });
    this._tone(330, 0.12, { type: 'square', gain: 0.12, at: 0.03 });
    this._tone(660, 0.16, { type: 'square', gain: 0.1, at: 0.1 });
    this.vibrate(40);
  }

  grab() { this._tone(520, 0.06, { type: 'triangle', gain: 0.2 }); this.vibrate(15); }

  wire(ok) {
    if (ok) {
      this._tone(880, 0.09, { type: 'triangle', gain: 0.35 });
      this._tone(1320, 0.14, { type: 'triangle', gain: 0.3, at: 0.07 });
      this.vibrate(35);
    } else {
      this._tone(180, 0.22, { type: 'sawtooth', gain: 0.2, slide: -60 });
      this.vibrate([60, 40, 60]);
    }
  }

  fixed() {
    [523, 659, 784, 1047].forEach((f, i) => this._tone(f, 0.18, { type: 'triangle', gain: 0.32, at: i * 0.09 }));
    this._noise(0.4, { gain: 0.12, at: 0.3, freq: 5000 });
    this.vibrate([80, 50, 120]);
  }

  win() {
    const notes = [523, 659, 784, 1047, 784, 1047, 1319];
    notes.forEach((f, i) => this._tone(f, 0.22, { type: 'square', gain: 0.14, at: i * 0.13 }));
    this.vibrate([100, 60, 100, 60, 250]);
  }

  lose() {
    [392, 330, 262, 196].forEach((f, i) => this._tone(f, 0.35, { type: 'sawtooth', gain: 0.14, at: i * 0.28, slide: -20 }));
    this.vibrate([300, 100, 300]);
  }

  alarm() {
    for (let i = 0; i < 3; i++) this._tone(990, 0.16, { type: 'square', gain: 0.18, at: i * 0.24, slide: -300 });
    this.vibrate([150, 90, 150, 90, 150]);
  }

  tick(last) { this._tone(last ? 1400 : 1000, 0.07, { type: 'square', gain: 0.14 }); }

  // Bipe do detector: chame todo quadro com a distância até a caixa mais próxima.
  detector(dist, nowS) {
    if (!this.on || dist == null || dist > A.BEEP_MAX_DIST) return;
    if (nowS < this.nextBeep) return;
    const k = Math.min(1, Math.max(0, (dist - CONFIG.DETECTOR.NEAR) / (A.BEEP_MAX_DIST - CONFIG.DETECTOR.NEAR))); // 0 perto, 1 longe
    const interval = A.BEEP_NEAR_S + (A.BEEP_FAR_S - A.BEEP_NEAR_S) * k * k;
    this.nextBeep = nowS + interval;
    this._tone(1500 - 700 * k, 0.05, { type: 'sine', gain: 0.22 - 0.1 * k });
  }

  // ---------------- zumbis ----------------
  shot() {
    this._noise(0.16, { gain: 0.55, freq: 1400 });
    this._noise(0.32, { gain: 0.28, freq: 300, at: 0.01 });
    this._tone(140, 0.14, { type: 'square', gain: 0.25, slide: -90 });
    this.vibrate(30);
  }

  cock() { this._tone(1900, 0.03, { type: 'square', gain: 0.12 }); this._tone(1200, 0.03, { type: 'square', gain: 0.1, at: 0.05 }); }

  zombieHit(kill) {
    this._noise(0.1, { gain: 0.35, freq: 600 });
    if (kill) {
      this._tone(220, 0.5, { type: 'sawtooth', gain: 0.2, slide: -150, at: 0.05 });
      this._tone(160, 0.6, { type: 'sawtooth', gain: 0.12, slide: -100, at: 0.12 });
    } else this._tone(300, 0.18, { type: 'sawtooth', gain: 0.16, slide: -120 });
  }

  // v19: soco/tapa (pancada seca, mais forte no golpe final)
  punch(kill) {
    this._noise(0.07, { gain: 0.6, freq: 900 });
    this._tone(110, 0.12, { type: 'sine', gain: 0.5, slide: -60 });
    if (kill) this._tone(200, 0.45, { type: 'sawtooth', gain: 0.18, slide: -140, at: 0.06 });
    this.vibrate(kill ? [40, 30, 60] : 35);
  }

  // ---------------- v26: som 3D (fone de ouvido) ----------------
  // Cada som de zumbi sai do lugar onde ele está (HRTF): com fone, dá para
  // saber se ele vem pela esquerda, pela direita ou por TRÁS.
  _at(pos) {
    const c = this.ctx, p = c.createPanner();
    p.panningModel = 'HRTF';
    p.distanceModel = 'inverse';
    p.refDistance = A.REF_DIST;
    p.maxDistance = 60;
    p.rolloffFactor = A.ROLLOFF;
    if (p.positionX) { p.positionX.value = pos.x; p.positionY.value = pos.y; p.positionZ.value = pos.z; } else p.setPosition(pos.x, pos.y, pos.z);
    p.connect(this.master);
    return p;
  }

  // posição e direção da cabeça (chamar todo quadro)
  listener(pos, fwd, up) {
    if (!this.ctx) return;
    const L = this.ctx.listener;
    if (L.positionX) {
      const t = this.ctx.currentTime;
      L.positionX.setValueAtTime(pos.x, t); L.positionY.setValueAtTime(pos.y, t); L.positionZ.setValueAtTime(pos.z, t);
      L.forwardX.setValueAtTime(fwd.x, t); L.forwardY.setValueAtTime(fwd.y, t); L.forwardZ.setValueAtTime(fwd.z, t);
      L.upX.setValueAtTime(up.x, t); L.upY.setValueAtTime(up.y, t); L.upZ.setValueAtTime(up.z, t);
    } else {
      L.setPosition(pos.x, pos.y, pos.z);
      L.setOrientation(fwd.x, fwd.y, fwd.z, up.x, up.y, up.z);
    }
  }

  // gemido de zumbi saindo do lugar dele (alto; o fone faz a direção)
  groanAt(pos, angry = false) {
    if (!this.on) return;
    const dest = this._at(pos);
    const f = (angry ? 95 : 70) + Math.random() * 45;
    const g = A.ZOMBIE_VOL;
    this._tone(f, 1.1, { type: 'sawtooth', gain: 0.5 * g, slide: -30, dest });
    this._tone(f * 1.48, 0.9, { type: 'square', gain: 0.18 * g, slide: -40, at: 0.06, dest });
    this._noise(0.8, { gain: 0.35 * g, freq: 420 + Math.random() * 200, q: 3, dest });
  }

  // passo arrastado
  stepAt(pos) {
    if (!this.on) return;
    const dest = this._at(pos);
    this._noise(0.09, { gain: 0.55 * A.ZOMBIE_VOL, freq: 160 + Math.random() * 90, q: 1.2, dest });
    this._tone(58, 0.08, { type: 'sine', gain: 0.25 * A.ZOMBIE_VOL, dest });
  }

  // grito do susto (jumpscare): bem alto, de onde ele está e também "na cara"
  screamAt(pos) {
    if (!this.on) return;
    const dest = this._at(pos);
    this._noise(1.0, { gain: 1.2, freq: 2400, q: 0.6, dest });
    this._tone(520, 0.9, { type: 'sawtooth', gain: 0.6, slide: 900, dest });
    this._tone(780, 0.8, { type: 'square', gain: 0.35, slide: 700, at: 0.05, dest });
    this._noise(0.5, { gain: 0.6, freq: 900 });
    this._tone(60, 0.6, { type: 'sine', gain: 0.8, slide: -30 });
    this.vibrate([200, 50, 200]);
  }

  // coração batendo (zumbi perto)
  heartbeat(k = 1) {
    if (!this.on) return;
    this._tone(52, 0.13, { type: 'sine', gain: 0.55 * k });
    this._tone(48, 0.16, { type: 'sine', gain: 0.45 * k, at: 0.2 });
  }

  // música de fundo de terror (baixinha): zumbido grave, vento e sininhos
  music(on) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    if (on && !this._mus) {
      const out = c.createGain(); out.gain.value = 1; out.connect(this.musicBus);
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260; lp.Q.value = 4; lp.connect(out);
      const o1 = c.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 55;
      const o2 = c.createOscillator(); o2.type = 'triangle'; o2.frequency.value = 55 * 1.5 + 0.7;
      const o3 = c.createOscillator(); o3.type = 'sine'; o3.frequency.value = 55 * 1.059;
      for (const o of [o1, o2, o3]) { o.connect(lp); o.start(); }
      const lfo = c.createOscillator(); lfo.frequency.value = 0.07; const lg = c.createGain(); lg.gain.value = 120; lfo.connect(lg).connect(lp.frequency); lfo.start();
      // vento: ruído em loop, filtrado, subindo e descendo
      const n = c.sampleRate * 3, buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 500; bp.Q.value = 0.7;
      const wg = c.createGain(); wg.gain.value = 0.25;
      const lfo2 = c.createOscillator(); lfo2.frequency.value = 0.11; const lg2 = c.createGain(); lg2.gain.value = 0.18; lfo2.connect(lg2).connect(wg.gain); lfo2.start();
      src.connect(bp).connect(wg).connect(out); src.start();
      this._mus = { nodes: [o1, o2, o3, lfo, lfo2, src], out };
      // sininho dissonante de vez em quando
      this._musT = setInterval(() => {
        if (!this.on || !this._mus) return;
        const f = [622, 740, 831, 1108][Math.floor(Math.random() * 4)];
        const g = c.createGain(); g.connect(this.musicBus);
        const o = c.createOscillator(); o.frequency.value = f; o.connect(g);
        const tt = c.currentTime; g.gain.setValueAtTime(0.0001, tt); g.gain.exponentialRampToValueAtTime(0.25, tt + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, tt + 3.5);
        o.start(tt); o.stop(tt + 3.6);
      }, 9000);
    }
    const vol = on && this.options.sound && this.options.music !== false ? A.MUSIC_VOL : 0;
    this.musicBus.gain.cancelScheduledValues(t);
    this.musicBus.gain.setTargetAtTime(vol, t, 0.8);
  }

  // gemido: mais alto quanto mais perto
  groan(dist) {
    const k = Math.max(0.15, 1 - dist / 10);
    const f = 85 + Math.random() * 40;
    this._tone(f, 0.9, { type: 'sawtooth', gain: 0.16 * k, slide: -25 });
    this._tone(f * 1.5, 0.7, { type: 'triangle', gain: 0.08 * k, slide: -30, at: 0.08 });
  }

  hurt() {
    this._noise(0.25, { gain: 0.45, freq: 250 });
    this._tone(110, 0.3, { type: 'square', gain: 0.22, slide: -40 });
    this.vibrate([120, 40, 120]);
  }

  resetDetector() { this.nextBeep = 0; }
}

// ===== js/ranking.js =====
// Placar e ranking do dia, guardados só neste celular (localStorage).
// Pontos = 100 por zumbi eliminado + 2 por segundo que sobrou (só se eliminou todos).

const KEY = 'cacador-sinal-ranking-v1';

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function loadAll() {
  try { return JSON.parse(localStorage.getItem(KEY) || '[]') || []; } catch (e) { return []; }
}

function saveAll(list) {
  try { localStorage.setItem(KEY, JSON.stringify(list.slice(-300))); return true; } catch (e) { return false; }
}

function score(fixed, win, timeLeft) {
  return fixed * 100 + (win ? Math.max(0, Math.ceil(timeLeft)) * 2 : 0);
}

// Guarda uma partida e devolve o registro (com id) e a posição no ranking do dia.
function addResult({ fixed, total, used, timeLeft, win, feira }) {
  const list = loadAll();
  const date = today();
  const n = list.filter((r) => r.date === date && r.feira === feira).length + 1;
  const rec = {
    id: `${Date.now()}-${Math.floor(Math.random() * 1e6)}`,
    name: `Jogador ${n}`,
    fixed, total, used: Math.round(used), win, feira, date,
    points: score(fixed, win, timeLeft),
  };
  list.push(rec);
  saveAll(list);
  return { rec, place: topToday(feira, 1000).findIndex((r) => r.id === rec.id) + 1 };
}

function rename(id, name) {
  const list = loadAll();
  const r = list.find((x) => x.id === id);
  if (!r) return;
  r.name = String(name).trim().slice(0, CONFIG.RANKING.NAME_MAX) || r.name;
  saveAll(list);
}

// Melhores do dia: mais pontos, depois menos tempo.
function topToday(feira, n = CONFIG.RANKING.SIZE) {
  const date = today();
  return loadAll()
    .filter((r) => r.date === date && r.feira === feira)
    .sort((a, b) => b.points - a.points || a.used - b.used)
    .slice(0, n);
}

function clearToday(feira) {
  const date = today();
  saveAll(loadAll().filter((r) => !(r.date === date && r.feira === feira)));
}

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

function fmt(s) { return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }

function rankingTable(feira, highlightId = null) {
  const top = topToday(feira);
  if (!top.length) return '<p class="small">Ninguém jogou hoje ainda. Seja o primeiro!</p>';
  const rows = top.map((r, i) => `<tr class="${r.id === highlightId ? 'me' : ''}">
      <td>${['🥇', '🥈', '🥉'][i] || i + 1}</td><td>${esc(r.name)}</td><td>${r.points}</td>
      <td>${r.fixed}/${r.total}</td><td>${fmt(r.used)}</td></tr>`).join('');
  return `<table class="rank"><thead><tr><th></th><th>Nome</th><th>Pontos</th><th>🧟</th><th>Tempo</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// ===== js/handhint.js =====
// Aviso quando o jogo não vê a mão: "mostre a mão" ou "pouca luz".
// Mede o brilho da câmera numa imagem pequenininha (32x24), duas vezes por segundo.

const HH = CONFIG.HAND_HINT;

class HandHint {
  constructor(app) {
    this.app = app;
    this.el = document.getElementById('hand-hint');
    this.canvas = document.createElement('canvas');
    this.canvas.width = 32;
    this.canvas.height = 24;
    this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
    this.brightness = null;   // 0..255 (média da imagem)
    this.lastSeen = performance.now();
    this.lastMeasure = 0;
    this.shown = '';
    this.lastHudToast = 0;
  }

  _measure() {
    const v = this.app.hands.video;
    if (!v || !v.videoWidth || v.readyState < 2) return;
    try {
      this.ctx.drawImage(v, 0, 0, 32, 24);
      const d = this.ctx.getImageData(0, 0, 32, 24).data;
      let sum = 0;
      for (let i = 0; i < d.length; i += 4) sum += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      this.brightness = sum / (d.length / 4);
    } catch (e) { this.brightness = null; }
  }

  // Chamar todo quadro. active = tutorial ou partida.
  update(now, active) {
    const app = this.app;
    const tracking = !!(app.hands.landmarker && app.hands.stream);
    if (app.hands.hands.some((h) => h.visible)) this.lastSeen = now;
    if (!active || !tracking) { this._set(''); this.lastSeen = now; return; }
    if (now - this.lastMeasure > 500) { this.lastMeasure = now; this._measure(); }
    let msg = '';
    const lost = now - this.lastSeen;
    if (lost > 1500 && app.hands.stalled && !app.hands._ic) {
      msg = '📷 A câmera parou: toque na tela para religar.';
    } else
    if (lost > 1500 && this.brightness != null && this.brightness < HH.DARK) {
      msg = '💡 Pouca luz ou câmera tapada: vá para um lugar mais claro e deixe a câmera de trás livre.';
    } else if (lost > HH.NO_HAND_MS) {
      msg = app.stereo || app.xrActive
        ? '✋ Mostre a mão na frente do celular (a tampa da câmera do óculos precisa estar aberta)'
        : '✋ Mostre a mão para a câmera de trás do celular';
    }
    this._set(msg);
    // no óculos o aviso em HTML não aparece: manda para o painel 3D de vez em quando
    if (msg && (app.stereo || app.xrActive) && now - this.lastHudToast > 3000) {
      this.lastHudToast = now;
      app.hud3d.toast(msg.replace(/\(.*\)/, '').trim());
    }
  }

  _set(msg) {
    if (msg === this.shown || !this.el) return;
    this.shown = msg;
    this.el.textContent = msg;
    this.el.classList.toggle('show', !!msg);
  }
}

// ===== js/mapa.js =====
// Mapa da escola de verdade: carrega o modelo 3D original (models/escola.glb)
// e monta, a partir dos próprios triângulos dele, uma grade de colisão:
//  - chão: superfícies quase horizontais até CHAO_MAX de altura (calçada,
//    piso, degraus). Mesas e balcões viram "chão alto" e bloqueiam pelo degrau.
//  - parede: superfícies inclinadas/verticais, guardadas por faixa de altura
//    (assim uma verga em cima da porta não bloqueia a passagem).
//  - coberto: tem laje/telhado em cima (usado para escolher pontos dentro das salas).
// Os pontos de sinal (caixas) são escolhidos sozinhos: lugares alcançáveis a pé,
// encostados em parede, bem espalhados, agrupados em áreas.
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const M = CONFIG.MAP;
const BAND = 0.15;          // altura de cada faixa da parede (m)
const NB = 32;              // faixas (32 bits)

function loadSchoolModel(onProgress) {
  return new Promise((resolve, reject) => {
    const loader = new GLTFLoader();
    const urls = M.URLS.slice();
    const tryNext = () => {
      const url = urls.shift();
      if (!url) { reject(new Error('modelo da escola não encontrado')); return; }
      loader.load(url, (g) => resolve(g.scene), (e) => {
        if (e.total) onProgress && onProgress(e.loaded / e.total);
      }, () => tryNext());
    };
    tryNext();
  });
}

const tick = () => new Promise((r) => setTimeout(r, 0));

class CollisionGrid {
  // root: modelo já na posição final (matrixWorld atualizada)
  static async build(root, onProgress) {
    const g = new CollisionGrid();
    const box = new THREE.Box3().setFromObject(root);
    const C = M.CELL;
    g.cell = C;
    // origem alinhada à célula: a grade não muda se o tamanho do modelo mudar
    g.x0 = Math.floor(box.min.x / C) * C - 1; g.z0 = Math.floor(box.min.z / C) * C - 1;
    g.W = Math.ceil((box.max.x - box.min.x + 2) / C);
    g.H = Math.ceil((box.max.z - box.min.z + 2) / C);
    g.Y0 = box.min.y - 0.2;
    const N = g.W * g.H;
    g.floor = new Float32Array(N).fill(-Infinity);
    g.wall = new Uint32Array(N);
    g.wallY0 = new Float32Array(N).fill(Infinity); // faixa 0 da parede começa no chão da célula
    g.covered = new Uint8Array(N);

    const meshes = [];
    root.traverse((o) => { if (o.isMesh && o.geometry && o.geometry.attributes.position) meshes.push(o); });
    let total = 0;
    for (const m of meshes) total += (m.geometry.index ? m.geometry.index.count : m.geometry.attributes.position.count) / 3;

    // 1ª passada: chão e "coberto"; 2ª passada: paredes (precisa do chão de cada célula)
    const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
    const e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), n = new THREE.Vector3();
    const walls = [];
    let done = 0;
    for (const m of meshes) {
      const pos = m.geometry.attributes.position, idx = m.geometry.index;
      const mw = m.matrixWorld;
      const cnt = idx ? idx.count : pos.count;
      const wp = new Float32Array(pos.count * 3);
      for (let i = 0; i < pos.count; i++) {
        a.fromBufferAttribute(pos, i).applyMatrix4(mw);
        wp[i * 3] = a.x; wp[i * 3 + 1] = a.y; wp[i * 3 + 2] = a.z;
      }
      for (let t = 0; t < cnt; t += 3) {
        const i0 = idx ? idx.getX(t) : t, i1 = idx ? idx.getX(t + 1) : t + 1, i2 = idx ? idx.getX(t + 2) : t + 2;
        a.fromArray(wp, i0 * 3); b.fromArray(wp, i1 * 3); c.fromArray(wp, i2 * 3);
        n.crossVectors(e1.subVectors(b, a), e2.subVectors(c, a));
        const len = n.length();
        if (len < 1e-9) continue;
        const ny = Math.abs(n.y) / len;
        const minY = Math.min(a.y, b.y, c.y), maxY = Math.max(a.y, b.y, c.y);
        if (ny > 0.75) {
          if (maxY <= M.CHAO_MAX) g._raster(a, b, c, C * 0.7, (k, y) => { if (y > g.floor[k]) g.floor[k] = y; });
          else if (minY > 2.0) g._raster(a, b, c, C, (k) => { g.covered[k] = 1; });
        }
        if (ny < 0.75 && minY < M.CHAO_MAX + 2.2) walls.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
      }
      done += cnt / 3;
      onProgress && onProgress(0.5 * done / total);
      await tick();
    }
    // paredes: faixas de altura relativas ao chão da célula
    const nw = walls.length / 9;
    for (let w = 0; w < nw; w++) {
      a.fromArray(walls, w * 9); b.fromArray(walls, w * 9 + 3); c.fromArray(walls, w * 9 + 6);
      g._raster(a, b, c, C * 0.45, (k, y) => {
        const f = g.floor[k] === -Infinity ? 0 : g.floor[k];
        const band = Math.floor((y - f) / BAND);
        if (band >= 0 && band < NB) g.wall[k] |= (1 << band);
      });
      if ((w & 8191) === 0) { onProgress && onProgress(0.5 + 0.5 * w / nw); await tick(); }
    }
    // máscara das faixas que bloqueiam (joelho até a cabeça)
    let mask = 0;
    for (let i = 0; i < NB; i++) {
      const y0 = i * BAND, y1 = y0 + BAND;
      if (y1 > M.PAREDE_DE && y0 < M.PAREDE_ATE) mask |= (1 << i);
    }
    g.mask = mask >>> 0;
    g.refY = 0;
    onProgress && onProgress(1);
    return g;
  }

  // Amostra pontos no triângulo (espaçamento ~step) e chama fn(célula, y).
  _raster(a, b, c, step, fn) {
    const lab = a.distanceTo(b), lac = a.distanceTo(c), lbc = b.distanceTo(c);
    const nu = Math.max(1, Math.ceil(Math.max(lab, lac, lbc) / step));
    for (let i = 0; i <= nu; i++) {
      for (let j = 0; j <= nu - i; j++) {
        const u = i / nu, v = j / nu, w = 1 - u - v;
        const x = a.x * w + b.x * u + c.x * v;
        const y = a.y * w + b.y * u + c.y * v;
        const z = a.z * w + b.z * u + c.z * v;
        const k = this.key(x, z);
        if (k >= 0) fn(k, y);
      }
    }
  }

  key(x, z) {
    const i = Math.floor((x - this.x0) / this.cell), j = Math.floor((z - this.z0) / this.cell);
    if (i < 0 || j < 0 || i >= this.W || j >= this.H) return -1;
    return j * this.W + i;
  }

  floorAt(x, z) {
    const k = this.key(x, z);
    return k < 0 || this.floor[k] === -Infinity ? null : this.floor[k];
  }

  // célula onde dá para ficar em pé vindo da altura fromY
  _cellOk(k, fromY) {
    if (k < 0) return false;
    const f = this.floor[k];
    if (f === -Infinity || Math.abs(f - fromY) > M.DEGRAU) return false;
    return (this.wall[k] & this.mask) === 0;
  }

  isFree(x, z, r, fromY = this.refY) {
    const C = this.cell, n = Math.ceil(r / C);
    const ci = Math.floor((x - this.x0) / C), cj = Math.floor((z - this.z0) / C);
    for (let dj = -n; dj <= n; dj++) {
      for (let di = -n; di <= n; di++) {
        const i = ci + di, j = cj + dj;
        // só as células que encostam no círculo do jogador
        const cx = this.x0 + (i + 0.5) * C, cz = this.z0 + (j + 0.5) * C;
        if (Math.hypot(cx - x, cz - z) > r + C * 0.5) continue;
        if (i < 0 || j < 0 || i >= this.W || j >= this.H) return false;
        if (!this._cellOk(j * this.W + i, fromY)) return false;
      }
    }
    return true;
  }

  // primeiro ponto onde o segmento a->b bate em parede ou entra no chão
  segmentHit(a, b) {
    const len = a.distanceTo(b);
    const steps = Math.max(1, Math.ceil(len / 0.1));
    const p = new THREE.Vector3();
    for (let s = 1; s <= steps; s++) {
      p.lerpVectors(a, b, s / steps);
      const k = this.key(p.x, p.z);
      if (k < 0) return { point: p.clone() };
      const f = this.floor[k] === -Infinity ? 0 : this.floor[k];
      const band = Math.floor((p.y - f) / BAND);
      if (p.y < f - 0.05) return { point: p.clone() };
      if (band >= 0 && band < NB && (this.wall[k] & (1 << band))) return { point: p.clone() };
    }
    return null;
  }

  // Células alcançáveis a pé a partir de (x, z): busca em largura.
  reachable(x, z, r) {
    const N = this.W * this.H;
    const seen = new Uint8Array(N);
    const fy = new Float32Array(N);
    const start = this.key(x, z);
    if (start < 0) return seen;
    const q = new Int32Array(N);
    let h = 0, t = 0;
    q[t++] = start; seen[start] = 1; fy[start] = this.floor[start] === -Infinity ? 0 : this.floor[start];
    while (h < t) {
      const k = q[h++];
      const i = k % this.W, j = (k / this.W) | 0;
      for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const ni = i + di, nj = j + dj;
        if (ni < 0 || nj < 0 || ni >= this.W || nj >= this.H) continue;
        const nk = nj * this.W + ni;
        if (seen[nk]) continue;
        const cx = this.x0 + (ni + 0.5) * this.cell, cz = this.z0 + (nj + 0.5) * this.cell;
        if (!this.isFree(cx, cz, r, fy[k])) continue;
        seen[nk] = 1; fy[nk] = this.floor[nk]; q[t++] = nk;
      }
    }
    return seen;
  }

  // perto de parede (distância em células)?
  nearWall(k, dist) {
    const i = k % this.W, j = (k / this.W) | 0;
    for (let dj = -dist; dj <= dist; dj++) {
      for (let di = -dist; di <= dist; di++) {
        const ni = i + di, nj = j + dj;
        if (ni < 0 || nj < 0 || ni >= this.W || nj >= this.H) continue;
        if (this.wall[nj * this.W + ni] & this.mask) return true;
      }
    }
    return false;
  }
}

// Escolhe os pontos de sinal: alcançáveis, encostados em parede, de preferência
// cobertos (dentro das salas/corredores), espalhados. Agrupa em AREAS áreas,
// cada uma com alguns lugares (a partida sorteia um lugar por área).
function autoTargets(grid, spawn, boxHalf) {
  const seen = grid.reachable(spawn.x, spawn.z, M.RAIO_JOGADOR);
  const cand = [];
  const C = grid.cell;
  for (let k = 0; k < seen.length; k++) {
    if (!seen[k]) continue;
    const i = k % grid.W, j = (k / grid.W) | 0;
    if ((i + j) % 2) continue; // metade das células já basta
    const x = grid.x0 + (i + 0.5) * C, z = grid.z0 + (j + 0.5) * C;
    if (Math.hypot(x - spawn.x, z - spawn.z) < M.LONGE_DO_INICIO) continue;
    if (!grid.nearWall(k, 3)) continue;
    // a caixa precisa caber: livre num raio pequeno
    if (!grid.isFree(x, z, 0.3, grid.floor[k])) continue;
    cand.push({ x, z, y: grid.floor[k], covered: grid.covered[k] });
  }
  // prefere lugares cobertos (dentro); se tiver poucos, usa todos
  const inside = cand.filter((p) => p.covered);
  const pool = inside.length > 60 ? inside : cand;
  // espalha: escolhe o mais longe dos já escolhidos (farthest point)
  const spots = [];
  if (pool.length) {
    let best = pool[Math.floor(pool.length / 2)];
    spots.push(best);
    const dmin = new Float32Array(pool.length).fill(Infinity);
    while (spots.length < M.AREAS * M.LUGARES_POR_AREA) {
      let bi = -1, bd = -1;
      for (let p = 0; p < pool.length; p++) {
        const d = Math.hypot(pool[p].x - best.x, pool[p].z - best.z);
        if (d < dmin[p]) dmin[p] = d;
        if (dmin[p] > bd) { bd = dmin[p]; bi = p; }
      }
      if (bi < 0 || bd < M.DIST_MIN) break;
      best = pool[bi];
      spots.push(best);
    }
  }
  // agrupa em áreas: k-means simples (começa pelos primeiros, que já estão espalhados)
  const K = Math.min(M.AREAS, spots.length);
  let centers = spots.slice(0, K).map((p) => ({ x: p.x, z: p.z }));
  let groups = [];
  for (let it = 0; it < 12; it++) {
    groups = centers.map(() => []);
    for (const p of spots) {
      let bi = 0, bd = Infinity;
      centers.forEach((c, ci) => { const d = Math.hypot(c.x - p.x, c.z - p.z); if (d < bd) { bd = d; bi = ci; } });
      groups[bi].push(p);
    }
    centers = groups.map((g, gi) => (g.length ? { x: g.reduce((s, p) => s + p.x, 0) / g.length, z: g.reduce((s, p) => s + p.z, 0) / g.length } : centers[gi]));
  }
  // áreas em ordem de distância do início (área 1 = mais perto)
  const areas = groups.filter((g) => g.length).map((g, gi) => ({ g, d: Math.hypot(centers[gi].x - spawn.x, centers[gi].z - spawn.z) }))
    .sort((p, q) => p.d - q.d);
  return areas.map(({ g }, ai) => ({
    id: `area-${ai + 1}`,
    name: `área ${ai + 1}`,
    spots: g.map((p) => ({ pos: [p.x, p.y + boxHalf, p.z], normal: [0, 1, 0] })),
  }));
}

// ===== js/filters.js =====
// Filtro One Euro (Casiez et al. 2012): suaviza tremor quando a mão está
// parada e reduz atraso quando ela se move rápido.

function alpha(cutoff, dt) {
  const tau = 1 / (2 * Math.PI * cutoff);
  return 1 / (1 + tau / dt);
}

class OneEuro {
  constructor(minCutoff, beta, dCutoff) {
    this.minCutoff = minCutoff;
    this.beta = beta;
    this.dCutoff = dCutoff;
    this.x = null;
    this.dx = 0;
    this.t = 0;
  }

  reset() { this.x = null; this.dx = 0; }

  filter(value, tSec) {
    if (this.x === null) { this.x = value; this.t = tSec; return value; }
    const dt = Math.max(1e-3, tSec - this.t);
    this.t = tSec;
    const dxRaw = (value - this.x) / dt;
    this.dx += alpha(this.dCutoff, dt) * (dxRaw - this.dx);
    const cutoff = this.minCutoff + this.beta * Math.abs(this.dx);
    this.x += alpha(cutoff, dt) * (value - this.x);
    return this.x;
  }
}

// Filtro para um Vector3 (3 filtros escalares).
class OneEuro3 {
  constructor(cfg) {
    this.f = [0, 1, 2].map(() => new OneEuro(cfg.MIN_CUTOFF, cfg.BETA, cfg.D_CUTOFF));
  }
  reset() { this.f.forEach((f) => f.reset()); }
  filter(v, tSec) {
    v.x = this.f[0].filter(v.x, tSec);
    v.y = this.f[1].filter(v.y, tSec);
    v.z = this.f[2].filter(v.z, tSec);
    return v;
  }
}

// ===== js/cenario.js =====
// Cenário em volta da escola (v24), todo feito por código (sem arquivos):
//  céu com nuvens que acompanha o jogador · chão de terra e grama · ruas com
//  faixa e calçadas · prédios com janelas (alguns acesos, outros quebrados) ·
//  carros batidos, postes, árvores, barris pegando fogo e fumaça ao longe.
// Tudo junto em poucas peças (poucos desenhos = leve no celular). Fica FORA
// da escola, então não muda a colisão.

const C = () => CONFIG.CENARIO;

// gerador de números "aleatórios" fixo (o cenário é sempre o mesmo)
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

function canvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return { c, g: c.getContext('2d') };
}

function tex(c, repeat = true) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}

// pontinhos de ruído por cima de uma cor (terra, asfalto, concreto)
function speckle(g, w, h, base, n, colors, r, size = 2) {
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < n; i++) {
    g.fillStyle = colors[Math.floor(r() * colors.length)];
    g.globalAlpha = 0.25 + r() * 0.5;
    const s = size * (0.5 + r());
    g.fillRect(r() * w, r() * h, s, s);
  }
  g.globalAlpha = 1;
}

// ---------------- texturas ----------------
function groundTex() {
  const r = rng(11), { c, g } = canvas(512, 512);
  speckle(g, 512, 512, '#6f6a4a', 9000, ['#5d6b3a', '#7d7550', '#57513a', '#8a8060', '#4c5a33'], r, 3);
  // manchas de terra
  for (let i = 0; i < 26; i++) {
    const x = r() * 512, y = r() * 512, rad = 20 + r() * 60;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, 'rgba(120,100,70,0.55)'); gr.addColorStop(1, 'rgba(120,100,70,0)');
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  return tex(c);
}

function asphaltTex() {
  const r = rng(22), { c, g } = canvas(256, 512);
  speckle(g, 256, 512, '#3a3b3e', 6000, ['#2c2d30', '#47484c', '#333438', '#55565a'], r, 2);
  // rachaduras
  g.strokeStyle = 'rgba(20,20,22,0.7)'; g.lineWidth = 1.5;
  for (let i = 0; i < 10; i++) {
    let x = r() * 256, y = r() * 512; g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 6; k++) { x += (r() - 0.5) * 30; y += (r() - 0.5) * 30; g.lineTo(x, y); }
    g.stroke();
  }
  // faixa tracejada no meio e linhas das bordas
  g.fillStyle = '#d8c25a';
  for (let y = 0; y < 512; y += 128) g.fillRect(122, y + 10, 12, 70);
  g.fillStyle = '#cfcfc8'; g.fillRect(8, 0, 6, 512); g.fillRect(242, 0, 6, 512);
  return tex(c);
}

function concreteTex() {
  const r = rng(33), { c, g } = canvas(256, 256);
  speckle(g, 256, 256, '#8d8a84', 4000, ['#7c7973', '#9d9a94', '#85827c'], r, 2);
  g.strokeStyle = 'rgba(60,58,55,0.6)'; g.lineWidth = 2;
  for (let i = 0; i <= 256; i += 64) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 256); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(256, i); g.stroke(); }
  return tex(c);
}

// fachada: grade de janelas (escuras, algumas acesas, algumas quebradas)
function facadeTex() {
  const r = rng(44), { c, g } = canvas(256, 256);
  speckle(g, 256, 256, '#bdb6aa', 3000, ['#aaa396', '#c9c2b6', '#9e978a'], r, 2);
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
    const px = 14 + x * 64, py = 12 + y * 64;
    const k = r();
    g.fillStyle = k < 0.12 ? '#f2c66b' : k < 0.2 ? '#151515' : '#2c3640';
    g.fillRect(px, py, 36, 42);
    if (k >= 0.12 && k < 0.2) { // quebrada: cacos
      g.strokeStyle = '#6d7a86'; g.beginPath(); g.moveTo(px, py); g.lineTo(px + 20, py + 26); g.lineTo(px + 36, py + 8); g.stroke();
    } else if (k >= 0.2) { g.fillStyle = 'rgba(160,190,210,0.25)'; g.fillRect(px + 2, py + 2, 12, 38); }
    g.fillStyle = '#8b857a'; g.fillRect(px - 3, py + 42, 42, 5); // peitoril
  }
  // canto de cima à esquerda: cor lisa do telhado (UV 0..0.04)
  g.fillStyle = '#4a4744'; g.fillRect(0, 0, 10, 10);
  return tex(c);
}

function skyTex() {
  const r = rng(55), W = 1024, H = 512, { c, g } = canvas(W, H);
  const gr = g.createLinearGradient(0, 0, 0, H / 2);
  const S = C();
  gr.addColorStop(0, S.SKY_TOP); gr.addColorStop(0.75, S.SKY_MID); gr.addColorStop(1, S.SKY_HORIZON);
  g.fillStyle = gr; g.fillRect(0, 0, W, H / 2);
  g.fillStyle = S.SKY_HORIZON; g.fillRect(0, H / 2, W, H / 2);
  // nuvens: muitas manchas suaves, mais perto do horizonte
  for (let i = 0; i < 260; i++) {
    const y = Math.pow(r(), 0.7) * H * 0.47, x = r() * W, rad = 18 + r() * 70 * (1 - y / H);
    const a = 0.05 + r() * 0.12;
    for (const off of [0, -W, W]) { // repete nas bordas (sem emenda)
      const cg = g.createRadialGradient(x + off, y, 0, x + off, y, rad);
      cg.addColorStop(0, `rgba(235,226,212,${a})`); cg.addColorStop(1, 'rgba(235,226,212,0)');
      g.fillStyle = cg; g.fillRect(x + off - rad, y - rad, rad * 2, rad * 2);
    }
  }
  const t = tex(c, false);
  t.wrapS = THREE.RepeatWrapping;
  return t;
}

function smokeTex() {
  const { c, g } = canvas(128, 128);
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(70,66,62,0.85)'); gr.addColorStop(0.5, 'rgba(70,66,62,0.4)'); gr.addColorStop(1, 'rgba(70,66,62,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return tex(c, false);
}

function fireTex() {
  const { c, g } = canvas(64, 64);
  const gr = g.createRadialGradient(32, 40, 0, 32, 36, 32);
  gr.addColorStop(0, 'rgba(255,240,170,1)'); gr.addColorStop(0.35, 'rgba(255,150,40,0.9)'); gr.addColorStop(1, 'rgba(200,40,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return tex(c, false);
}

// ---------------- materiais ----------------
// "Neblina de longe": os prédios usam uma neblina própria, bem mais distante
// que a da escola, para aparecerem no horizonte (silhueta da cidade).
function hazeMaterial(params, near, far) {
  const m = new THREE.MeshLambertMaterial(params);
  m.onBeforeCompile = (sh) => {
    sh.uniforms.cenNear = { value: near };
    sh.uniforms.cenFar = { value: far };
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <fog_pars_fragment>', THREE.ShaderChunk.fog_pars_fragment.replace(/fogNear/g, 'cenNear').replace(/fogFar/g, 'cenFar'))
      .replace('#include <fog_fragment>', THREE.ShaderChunk.fog_fragment.replace(/fogNear/g, 'cenNear').replace(/fogFar/g, 'cenFar'));
  };
  m.customProgramCacheKey = () => `haze-${near}-${far}`;
  return m;
}

// ---------------- geometria juntada ----------------
// Junta várias caixas/cilindros (cada um com sua matriz e cor) numa peça só.
class Merger {
  constructor() { this.pos = []; this.nor = []; this.uv = []; this.col = []; }
  add(geo, matrix, color, uvMode = null) {
    const g = geo.index ? geo.toNonIndexed() : geo.clone();
    g.applyMatrix4(matrix);
    const p = g.attributes.position, n = g.attributes.normal, u = g.attributes.uv;
    const c = new THREE.Color(color);
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      this.pos.push(x, y, z);
      const nx = n.getX(i), ny = n.getY(i), nz = n.getZ(i);
      this.nor.push(nx, ny, nz);
      if (uvMode) {
        // fachada: janelas repetem pelo tamanho do prédio; telhado = cor lisa
        if (Math.abs(ny) > 0.5) this.uv.push(0.02, 0.98);
        else this.uv.push((Math.abs(nx) > 0.5 ? z : x) / uvMode.w, y / uvMode.h);
      } else this.uv.push(u ? u.getX(i) : 0, u ? u.getY(i) : 0);
      this.col.push(c.r, c.g, c.b);
    }
    g.dispose();
  }
  mesh(material) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.nor, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(this.uv, 2));
    g.setAttribute('color', new THREE.Float32BufferAttribute(this.col, 3));
    g.computeBoundingSphere();
    const m = new THREE.Mesh(g, material);
    m.matrixAutoUpdate = false;
    return m;
  }
  get count() { return this.pos.length / 3; }
}

const M4 = (x, y, z, ry = 0, sx = 1, sy = 1, sz = 1, rx = 0, rz = 0) =>
  new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), new THREE.Vector3(sx, sy, sz));

const BOX = new THREE.BoxGeometry(1, 1, 1);
const CYL = new THREE.CylinderGeometry(0.5, 0.5, 1, 10);
const CONE = new THREE.ConeGeometry(0.5, 1, 8);

// ---------------- montagem ----------------
// box: Box3 da escola · y0: altura do chão
function buildCenario(scene, box, y0 = 0) {
  const S = C();
  const r = rng(77);
  const group = new THREE.Group();
  group.name = 'cenario';
  const x0 = box.min.x - S.MARGIN, x1 = box.max.x + S.MARGIN;
  const z0 = box.min.z - S.MARGIN, z1 = box.max.z + S.MARGIN;
  const RW = S.ROAD_W, SW = S.SIDEWALK_W;
  const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;

  // chão grande (terra e grama), um pouco abaixo do piso da escola
  const gt = groundTex(); gt.repeat.set(S.GROUND_SIZE / 14, S.GROUND_SIZE / 14);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(S.GROUND_SIZE, S.GROUND_SIZE), new THREE.MeshLambertMaterial({ map: gt }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(cx, y0 - 0.08, cz);
  group.add(ground);

  // ruas em volta (anel) + calçadas
  const at = asphaltTex();
  const roadMat = new THREE.MeshLambertMaterial({ map: at });
  const ct = concreteTex();
  const walkMat = new THREE.MeshLambertMaterial({ map: ct });
  const strip = (mat, ax, az, bx, bz, w, y, texLen) => {
    const len = Math.hypot(bx - ax, bz - az);
    const geo = new THREE.PlaneGeometry(w, len);
    const uv = geo.attributes.uv;
    for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i), uv.getY(i) * len / texLen);
    const m = new THREE.Mesh(geo, mat);
    m.rotation.x = -Math.PI / 2;
    m.rotation.z = -Math.atan2(bx - ax, bz - az) + Math.PI;
    m.position.set((ax + bx) / 2, y, (az + bz) / 2);
    m.updateMatrix(); m.matrixAutoUpdate = false;
    group.add(m);
  };
  const ro = SW + RW / 2; // centro da rua a partir da borda da escola
  strip(roadMat, x0 - ro, z0 - ro - RW / 2, x0 - ro, z1 + ro + RW / 2, RW, y0 - 0.05, 16);
  strip(roadMat, x1 + ro, z0 - ro - RW / 2, x1 + ro, z1 + ro + RW / 2, RW, y0 - 0.05, 16);
  strip(roadMat, x0 - ro + RW / 2, z0 - ro, x1 + ro - RW / 2, z0 - ro, RW, y0 - 0.049, 16);
  strip(roadMat, x0 - ro + RW / 2, z1 + ro, x1 + ro - RW / 2, z1 + ro, RW, y0 - 0.049, 16);
  const so = SW / 2;
  strip(walkMat, x0 - so, z0 - SW, x0 - so, z1 + SW, SW, y0 - 0.04, 4);
  strip(walkMat, x1 + so, z0 - SW, x1 + so, z1 + SW, SW, y0 - 0.04, 4);
  strip(walkMat, x0, z0 - so, x1, z0 - so, SW, y0 - 0.039, 4);
  strip(walkMat, x0, z1 + so, x1, z1 + so, SW, y0 - 0.039, 4);

  // prédios: anel depois da rua (do outro lado), alturas variadas
  const ft = facadeTex();
  const bMat = hazeMaterial({ map: ft, vertexColors: true }, S.HAZE_NEAR, S.HAZE_FAR);
  const bm = new Merger();
  const inner = SW + RW + S.BUILD_GAP; // do muro da escola até a frente dos prédios
  const wallColors = [0xd8cfc0, 0xc9b9a3, 0xb8c0c4, 0xd6c3a5, 0xa9a49c, 0xc7a891, 0xe0d8cc];
  const row = (ax, az, bx, bz, nx, nz) => {
    // ao longo do segmento a->b; (nx, nz) = para fora (longe da escola)
    const len = Math.hypot(bx - ax, bz - az), dx = (bx - ax) / len, dz = (bz - az) / len;
    for (let rowK = 0; rowK < S.BUILD_ROWS; rowK++) {
      let t = -10 + r() * 6;
      const back = rowK * 22;
      while (t < len + 10) {
        const w = 8 + r() * 12, d = 9 + r() * 8;
        const h = (rowK ? 14 : 6) + r() * (rowK ? 30 : 18);
        const off = inner + back + d / 2 + r() * 3;
        const px = ax + dx * (t + w / 2) + nx * off, pz = az + dz * (t + w / 2) + nz * off;
        const ry = Math.atan2(dx, dz) + Math.PI / 2;
        bm.add(BOX, M4(px, y0 + h / 2, pz, ry, w, h, d), wallColors[Math.floor(r() * wallColors.length)], { w: 4, h: 3.2 });
        t += w + 1.5 + r() * 4;
      }
    }
  };
  row(x0, z0, x1, z0, 0, -1);
  row(x1, z1, x0, z1, 0, 1);
  row(x0, z1, x0, z0, -1, 0);
  row(x1, z0, x1, z1, 1, 0);
  const buildings = bm.mesh(bMat);
  group.add(buildings);

  // ruas: carros batidos/abandonados, postes, árvores na calçada
  const pm = new Merger();
  const carColors = [0x8b1e1e, 0x1f3f73, 0xd9d6cf, 0x2b2b2b, 0x6b6f2a, 0x3d5c4a, 0x9a6a2a, 0x3a3a3a];
  const car = (x, z, ry, tilt, burnt) => {
    const col = burnt ? 0x1c1a18 : carColors[Math.floor(r() * carColors.length)];
    const base = new THREE.Matrix4().compose(new THREE.Vector3(x, y0, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(tilt, ry, tilt * 0.6)), new THREE.Vector3(1, 1, 1));
    const part = (m) => new THREE.Matrix4().multiplyMatrices(base, m);
    pm.add(BOX, part(M4(0, 0.55, 0, 0, 1.8, 0.6, 4.2)), col);
    pm.add(BOX, part(M4(0, 1.05, -0.2, 0, 1.6, 0.5, 2.2)), burnt ? 0x111111 : 0x2a3540);
    for (const [wx, wz] of [[-0.85, 1.3], [0.85, 1.3], [-0.85, -1.3], [0.85, -1.3]]) pm.add(CYL, part(M4(wx, 0.33, wz, 0, 0.66, 0.25, 0.66, 0, Math.PI / 2)), 0x151515);
  };
  const roadPts = [];
  const edges = [
    [x0 - ro, z0 - ro, x0 - ro, z1 + ro], [x1 + ro, z0 - ro, x1 + ro, z1 + ro],
    [x0 - ro, z0 - ro, x1 + ro, z0 - ro], [x0 - ro, z1 + ro, x1 + ro, z1 + ro],
  ];
  for (const [ax, az, bx, bz] of edges) {
    const len = Math.hypot(bx - ax, bz - az), dx = (bx - ax) / len, dz = (bz - az) / len;
    const ry = Math.atan2(dx, dz);
    for (let t = 6 + r() * 10; t < len - 6; t += S.CAR_EVERY * (0.6 + r() * 0.9)) {
      const side = (r() < 0.5 ? -1 : 1) * RW * 0.22;
      const x = ax + dx * t - dz * side, z = az + dz * t + dx * side;
      const crashed = r() < 0.45;
      car(x, z, ry + (crashed ? (r() - 0.5) * 1.6 : (r() < 0.5 ? 0 : Math.PI)), crashed && r() < 0.3 ? 0.25 : 0, r() < 0.2);
      roadPts.push([x, z]);
    }
    // postes e árvores na calçada do outro lado da rua (perto dos prédios)
    const nx = (bz - az) / len, nz = -(bx - ax) / len; // um dos lados
    for (let t = 4; t < len - 4; t += S.POLE_EVERY) {
      const outSign = Math.sign((ax + dx * t + nx * 5 - cx) * nx + (az + dz * t + nz * 5 - cz) * nz) || 1;
      const off = RW / 2 + 1;
      const px = ax + dx * t + nx * off * outSign, pz = az + dz * t + nz * off * outSign;
      pm.add(BOX, M4(px, y0 + 3.5, pz, 0, 0.15, 7, 0.15), 0x55585c);
      pm.add(BOX, M4(px - nx * outSign * 0.7, y0 + 7, pz - nz * outSign * 0.7, ry, 0.15, 0.12, 1.6), 0x55585c);
      if (r() < 0.6) {
        const tx = px + dx * S.POLE_EVERY / 2, tz = pz + dz * S.POLE_EVERY / 2, th = 3 + r() * 2.5;
        pm.add(CYL, M4(tx, y0 + th / 2, tz, 0, 0.35, th, 0.35), 0x5a4330);
        pm.add(CONE, M4(tx, y0 + th + 1.4, tz, r() * 6, 3 + r(), 3.6 + r() * 1.5, 3 + r()), r() < 0.3 ? 0x6b5a33 : 0x3f5a2e);
      }
    }
  }
  // barris (fogo em cima)
  const fires = [];
  for (let i = 0; i < S.FIRES; i++) {
    const p = roadPts[Math.floor(r() * roadPts.length)] || [x0 - ro, z0];
    const fx = p[0] + 2.5, fz = p[1] + 1.5;
    pm.add(CYL, M4(fx, y0 + 0.45, fz, 0, 0.6, 0.9, 0.6), 0x4a3a2c);
    fires.push(new THREE.Vector3(fx, y0 + 1.25, fz));
  }
  const props = pm.mesh(new THREE.MeshLambertMaterial({ vertexColors: true }));
  group.add(props);

  // fogo dos barris: sprites que piscam
  const fireMat = new THREE.SpriteMaterial({ map: fireTex(), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false });
  const fireSprites = fires.map((p) => { const s = new THREE.Sprite(fireMat); s.position.copy(p); s.scale.set(1.2, 1.6, 1); group.add(s); return s; });

  // fumaça subindo ao longe (colunas de sprites que sobem e somem)
  const smokeMat = new THREE.SpriteMaterial({ map: smokeTex(), transparent: true, depthWrite: false, fog: false, opacity: 0.6 });
  const smoke = [];
  for (let k = 0; k < S.SMOKES; k++) {
    const ang = r() * Math.PI * 2, dist = Math.max(x1 - x0, z1 - z0) * 0.5 + 40 + r() * 60;
    const base = new THREE.Vector3(cx + Math.cos(ang) * dist, y0 + 10, cz + Math.sin(ang) * dist);
    for (let i = 0; i < 6; i++) {
      const s = new THREE.Sprite(smokeMat.clone());
      s.userData = { base, t: i / 6, drift: (r() - 0.5) * 8 };
      group.add(s);
      smoke.push(s);
    }
  }

  // céu: esfera grande que acompanha o jogador
  const sky = new THREE.Mesh(new THREE.SphereGeometry(S.SKY_R, 32, 16), new THREE.MeshBasicMaterial({ map: skyTex(), side: THREE.BackSide, fog: false, depthWrite: false }));
  sky.renderOrder = -1;
  sky.frustumCulled = false;
  group.add(sky);

  scene.add(group);

  let t0 = 0;
  return {
    group, sky, buildings, props,
    // chamar todo quadro (p = posição da câmera)
    update(dt, p) {
      sky.position.copy(p);
      t0 += dt;
      for (let i = 0; i < fireSprites.length; i++) {
        const k = 0.85 + Math.sin(t0 * 13 + i * 2.1) * 0.1 + Math.sin(t0 * 7.3 + i) * 0.08;
        fireSprites[i].scale.set(1.1 * k, 1.6 * k, 1);
      }
      for (const s of smoke) {
        const u = s.userData;
        u.t = (u.t + dt * 0.035) % 1;
        const k = u.t;
        s.position.set(u.base.x + u.drift * k, u.base.y + k * 45, u.base.z + u.drift * k * 0.5);
        const sc = 8 + k * 26;
        s.scale.set(sc, sc, 1);
        s.material.opacity = 0.55 * Math.sin(Math.PI * k);
      }
    },
  };
}

// Materiais mais baratos para o celular: Lambert (sem reflexo PBR) e folhas
// com recorte (alphaTest) em vez de transparência (que é cara e precisa ordenar).
function simplifyMaterials(root, aniso = 1) {
  const cache = new Map();
  root.traverse((o) => {
    if (!o.isMesh) return;
    o.updateMatrix();
    o.matrixAutoUpdate = false;
    const old = o.material;
    if (cache.has(old)) { o.material = cache.get(old); return; }
    const leaf = old.transparent && old.map;
    const m = new THREE.MeshLambertMaterial({
      color: old.color, map: old.map || null, side: old.side,
      transparent: old.transparent && !leaf, opacity: old.opacity,
      alphaTest: leaf ? 0.5 : old.alphaTest || 0,
      depthWrite: leaf ? true : old.depthWrite,
    });
    // textura do chão/parede mais nítida quando vista de lado (barato)
    if (m.map) { m.map.anisotropy = aniso; m.map.needsUpdate = true; }
    m.name = old.name;
    cache.set(old, m);
    old.dispose();
    o.material = m;
  });
}

// Troca o mapa de blocos pela escola de verdade (modelo 3D original).
// onStatus(texto, fração 0..1). Se falhar, o mapa de blocos continua.
async function loadSchool(world, scene, onStatus = () => {}, aniso = 1) {
  const model = await loadSchoolModel((f) => onStatus('Baixando a escola', f * 0.7));
  onStatus('Montando a escola', 0.7);
  simplifyMaterials(model, aniso);
  world.details = collectDetails(model);
  model.name = 'escola';
  scene.add(model);
  model.updateMatrixWorld(true);
  const grid = await CollisionGrid.build(model, (f) => onStatus('Calculando paredes e chão', 0.7 + f * 0.28));
  const S = CONFIG.MAP;
  const spawn = new THREE.Vector3(S.SPAWN[0], 0, S.SPAWN[2]);
  spawn.y = grid.floorAt(spawn.x, spawn.z) ?? 0;
  // pontos de sinal escolhidos sozinhos + caixa do tutorial na frente do início
  const defs = autoTargets(grid, spawn, BH);
  const tut = tutorialSpot(grid, spawn);
  defs.unshift({ id: 'tutorial', name: 'início', tutorial: true, wires: 1, spots: [{ pos: [tut.x, tut.y + BH, tut.z], normal: [0, 1, 0] }] });

  scene.remove(world.deco);
  world.deco.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
  world.blocks.length = 0;
  world.school = true;
  world.model = model;
  world.grid = grid;
  world.spawn = spawn;
  world.targetDefs = defs;
  // modo feira: o tutorial começa a 1,1 m da caixa (sem passo de andar)
  const yaw = S.SPAWN_YAW;
  world.tutorialSpawn = new THREE.Vector3(tut.x + Math.sin(yaw) * 1.1, tut.y, tut.z + Math.cos(yaw) * 1.1);
  world.feiraTargets = defs.filter((d) => !d.tutorial).slice(0, CONFIG.FEIRA.TARGETS.length).map((d) => d.id);
  world.isFree = (x, z, r, fromY) => grid.isFree(x, z, r, fromY);
  world.segmentHit = (a, b) => grid.segmentHit(a, b);
  world.floorAt = (x, z) => grid.floorAt(x, z);
  scene.fog = new THREE.Fog(S.FOG_COLOR, S.FOG_NEAR, S.FOG_FAR);
  scene.background = new THREE.Color(S.FOG_COLOR);
  // v24: mundo em volta (ruas, prédios, céu); o céu antigo (parado no início) sai
  if (CONFIG.CENARIO.ON) {
    try {
      if (scene.userData.sky) { scene.remove(scene.userData.sky); scene.userData.sky = null; }
      const box = new THREE.Box3();
      model.traverse((o) => { if (o.isMesh && /^s_/.test(o.name)) box.expandByObject(o); });
      if (box.isEmpty()) box.setFromObject(model);
      world.cenario = buildCenario(scene, box, spawn.y);
    } catch (e) { console.warn('Cenário não montou', e); }
  }
  placeTargets(world, scene, false);
  onStatus('Escola pronta', 1);
  return world;
}

// v15: a escola vem em blocos (s_* = estrutura, d_* = detalhe: carro, pessoa,
// planta, móvel). O celular já pula os blocos fora da visão; os detalhes
// também somem quando estão longe (a neblina já esconde quase tudo lá).
function collectDetails(model) {
  const list = [];
  model.updateMatrixWorld(true);
  model.traverse((o) => {
    if (!o.isMesh || !/^[ds]_/.test(o.name)) return;
    o.geometry.computeBoundingSphere();
    const s = o.geometry.boundingSphere.clone().applyMatrix4(o.matrixWorld);
    list.push({ m: o, c: s.center, r: s.radius, det: o.name[0] === 'd' });
  });
  return list;
}

// Chamar de vez em quando: mostra os detalhes perto, esconde os longe (com folga
// para não ficar piscando na borda).
function updateDetails(world, p) {
  const D0 = CONFIG.MAP.DETAIL_DIST, DS = CONFIG.MAP.FOG_FAR + 4;
  for (const d of world.details || []) {
    // detalhes somem além de DETAIL_DIST; blocos da escola além da neblina (v24)
    const D = d.det ? D0 : DS;
    if (!d.det && !CONFIG.MAP.CHUNK_CULL) continue;
    const dist = Math.hypot(d.c.x - p.x, d.c.z - p.z) - d.r;
    if (d.m.visible && dist > D + 2) d.m.visible = false;
    else if (!d.m.visible && dist < D) d.m.visible = true;
  }
}

// Lugar da caixa do tutorial: chão livre a ~2,5 m na frente do início.
function tutorialSpot(grid, spawn) {
  const yaw = CONFIG.MAP.SPAWN_YAW;
  for (let d = 2.5; d > 0.8; d -= 0.25) {
    for (const off of [0, 0.4, -0.4, 0.8, -0.8]) {
      const x = spawn.x - Math.sin(yaw + off) * d, z = spawn.z - Math.cos(yaw + off) * d;
      const f = grid.floorAt(x, z);
      if (f != null && Math.abs(f - spawn.y) < 0.3 && grid.isFree(x, z, 0.3, f)) return { x, y: f, z };
    }
  }
  return { x: spawn.x, y: spawn.y, z: spawn.z - 2 };
}

// Cria (ou recria) as caixas. random = sorteia um spot por lugar.
function placeTargets(world, scene, random = false) {
  for (const t of world.targets) {
    scene.remove(t.group);
    t.group.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
  }
  world.targets = (world.targetDefs || TARGET_DEFS).map((def) => {
    const spot = random ? def.spots[Math.floor(Math.random() * def.spots.length)] : def.spots[0];
    return createTarget(scene, { ...def, pos: spot.pos, normal: spot.normal });
  });
}

const tmpRay = new THREE.Ray();
const tmpV = new THREE.Vector3();

function buildWorld(scene) {
  scene.background = new THREE.Color(0xbfd8ee);

  scene.add(new THREE.HemisphereLight(0xf0e6d6, 0x857a6a, 1.05));
