  // Céu: esfera com degradê (azul em cima, claro no horizonte)
  const sky = new THREE.Mesh(new THREE.SphereGeometry(60, 24, 12), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(0x5d9fe0) }, horizon: { value: new THREE.Color(0xdcebf7) } },
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 horizon; varying vec3 vP; void main(){ float h = clamp(vP.y, 0.0, 1.0); gl_FragColor = vec4(mix(horizon, top, pow(h, 0.6)), 1.0); }',
  }));
  sky.renderOrder = -1;
  scene.add(sky);
  scene.userData.sky = sky;

  // tudo do mapa de blocos fica neste grupo (sai quando a escola de verdade carrega)
  const deco = new THREE.Group();
  deco.name = 'mapa-de-blocos';
  scene.add(deco);

  // Chão: piso claro com rejunte e leve variação (textura gerada no código)
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40),
    new THREE.MeshLambertMaterial({ map: makeFloorTexture(40) }),
  );
  ground.rotation.x = -Math.PI / 2;
  deco.add(ground);
  // caminhos (cinza-claro) ligando as áreas
  const roadMat = new THREE.MeshLambertMaterial({ color: 0xd9dcdf });
  for (const [w, d, x, z] of [[3, 23, 0, 3.5], [34, 2.4, 0, -6.2], [6, 2.4, 6, 1], [2.4, 6, -5.6, 1]]) {
    const road = new THREE.Mesh(new THREE.PlaneGeometry(w, d), roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.set(x, 0.004, z);
    deco.add(road);
  }
  // quadra: piso verde com linhas brancas
  const court = new THREE.Mesh(new THREE.PlaneGeometry(9.6, 10), new THREE.MeshLambertMaterial({ color: 0x3f9b5b }));
  court.rotation.x = -Math.PI / 2;
  court.position.set(-12.55, 0.006, 0);
  deco.add(court);
  const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  for (const [w, d, x, z] of [[9.2, 0.08, -12.55, 4.8], [9.2, 0.08, -12.55, -4.8], [0.08, 9.6, -17.15, 0], [0.08, 9.6, -7.95, 0], [0.08, 9.6, -12.55, 0]]) {
    const l = new THREE.Mesh(new THREE.PlaneGeometry(w, d), lineMat);
    l.rotation.x = -Math.PI / 2;
    l.position.set(x, 0.008, z);
    deco.add(l);
  }
  const ring = new THREE.Mesh(new THREE.RingGeometry(1.15, 1.23, 40), lineMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.set(-12.55, 0.008, 0);
  deco.add(ring);
  // bandeira no mastro
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.7), new THREE.MeshLambertMaterial({ color: 0x00a3ad, side: THREE.DoubleSide }));
  flag.position.set(0.63, 4.55, -3);
  deco.add(flag);
  scene.userData.flag = flag;

  const shadowTex = getShadowTexture();
  const addShadow = (cx, cz, w, d, opacity = 0.55) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d),
      new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, opacity, depthWrite: false }));
    m.rotation.x = -Math.PI / 2;
    m.position.set(cx, 0.008, cz);
    deco.add(m);
  };

  const blocks = [];
  const geo = new THREE.BoxGeometry(1, 1, 1);
  for (const [x0, x1, z0, z1, y0, y1, color] of BLOCKS) {
    const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color }));
    mesh.scale.set(x1 - x0, y1 - y0, z1 - z0);
    mesh.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
    deco.add(mesh);
    blocks.push({ mesh, box: new THREE.Box3(new THREE.Vector3(x0, y0, z0), new THREE.Vector3(x1, y1, z1)) });
    // sombra de contato: escurece o chão em volta da base do bloco
    if (y0 === 0) addShadow((x0 + x1) / 2, (z0 + z1) / 2, (x1 - x0) + 0.9, (z1 - z0) + 0.9);
    else if (y0 > 2) addShadow((x0 + x1) / 2, (z0 + z1) / 2, (x1 - x0) + 0.4, (z1 - z0) + 0.4, 0.35); // teto
  }

  // árvores: tronco (bloco com colisão) + copa (só visual)
  const leafMat = new THREE.MeshLambertMaterial({ color: 0x3e8e41 });
  const leafGeo = new THREE.IcosahedronGeometry(1.1, 1);
  for (const [x, z] of TREES) {
    const trunk = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: 0x7b5233 }));
    trunk.scale.set(0.3, 1.8, 0.3);
    trunk.position.set(x, 0.9, z);
    deco.add(trunk);
    blocks.push({ mesh: trunk, box: new THREE.Box3(new THREE.Vector3(x - 0.15, 0, z - 0.15), new THREE.Vector3(x + 0.15, 1.8, z + 0.15)) });
    const crown = new THREE.Mesh(leafGeo, leafMat);
    crown.position.set(x, 2.5, z);
    crown.scale.set(1, 0.9, 1);
    deco.add(crown);
    addShadow(x, z, 2.4, 2.4, 0.45);
  }

  const world = {
    blocks,
    deco,
    targets: [],
    spawn: new THREE.Vector3(0, 0, 10),
    bounds: 19.5,
    school: false,
    floorAt() { return 0; },

    // Primeiro bloco atingido pelo segmento a->b (ou null).
    segmentHit(a, b) {
      const len = a.distanceTo(b);
      if (len < 1e-6) return null;
      tmpRay.origin.copy(a);
      tmpRay.direction.subVectors(b, a).divideScalar(len);
      let best = null;
      let bestD = len;
      for (const bl of blocks) {
        const p = tmpRay.intersectBox(bl.box, tmpV);
        if (!p) continue;
        const d = p.distanceTo(a);
        if (d <= bestD) { bestD = d; best = { point: p.clone(), block: bl }; }
      }
      return best;
    },

    // Ponto do chão livre de blocos (com raio do jogador)?
    isFree(x, z, r) {
      if (Math.abs(x) > this.bounds || Math.abs(z) > this.bounds) return false;
      for (const bl of blocks) {
        const b = bl.box;
        if (b.min.y > CONFIG.EYE_HEIGHT + 0.2) continue; // teto alto não bloqueia
        if (x > b.min.x - r && x < b.max.x + r && z > b.min.z - r && z < b.max.z + r) return false;
      }
      return true;
    },
  };

  placeTargets(world, scene, false);
  return world;
}

function createTarget(scene, def) {
  const group = new THREE.Group();
  group.position.fromArray(def.pos);
  scene.add(group);

  const normal = new THREE.Vector3().fromArray(def.normal);
  const black = new THREE.MeshLambertMaterial({ color: 0x111111 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(BOX_SIZE, BOX_SIZE, BOX_SIZE), black);
  group.add(body);

  // Tampa: placa fina na face exposta
  const lid = new THREE.Mesh(new THREE.BoxGeometry(BOX_SIZE * 1.04, 0.04, BOX_SIZE * 1.04), new THREE.MeshLambertMaterial({ color: 0x222222 }));
  lid.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);
  const lidClosed = normal.clone().multiplyScalar(BOX_SIZE / 2 + 0.02);
  lid.position.copy(lidClosed);
  group.add(lid);

  // LED piscando (ajuda a achar a caixa)
  const led = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), new THREE.MeshBasicMaterial({ color: 0xff2222 }));
  led.position.copy(normal).multiplyScalar(BOX_SIZE / 2 + 0.05);
  // desloca o LED para um canto da face
  const side = Math.abs(normal.y) > 0.5 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
  led.position.addScaledVector(side, BOX_SIZE * 0.32);
  group.add(led);

  // "Sinal" dentro da caixa
  const signal = new THREE.Mesh(new THREE.IcosahedronGeometry(0.11, 1), new THREE.MeshBasicMaterial({ color: 0xff4444, wireframe: true }));
  signal.visible = false;
  group.add(signal);

  // Faíscas (aparecem quando o jogador chega perto de uma caixa quebrada)
  const S = CONFIG.SPARKS;
  const sparkPos = new Float32Array(S.COUNT * 3);
  const sparkGeo = new THREE.BufferGeometry();
  sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
  const sparkMat = new THREE.PointsMaterial({ color: 0xffd54a, size: 0.05, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending });
  const sparks = new THREE.Points(sparkGeo, sparkMat);
  sparks.frustumCulled = false;
  sparks.visible = false;
  group.add(sparks);
  const sparkData = [];
  for (let i = 0; i < S.COUNT; i++) sparkData.push({ p: new THREE.Vector3(), v: new THREE.Vector3(), life: -Math.random() });
  // Brilho em volta (anel que pulsa virado para fora da face exposta)
  const glow = new THREE.Mesh(new THREE.RingGeometry(BOX_SIZE * 0.62, BOX_SIZE * 0.8, 32),
    new THREE.MeshBasicMaterial({ color: 0xff3b3b, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
  glow.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
  glow.position.copy(normal).multiplyScalar(BOX_SIZE / 2 + 0.03);
  glow.visible = false;
  group.add(glow);

  // sombra no chão (só para caixa no chão): vai junto com a caixa quando ela é sorteada
  if (def.normal[1] > 0.5) {
    const sh = new THREE.Mesh(new THREE.PlaneGeometry(BOX_SIZE + 0.5, BOX_SIZE + 0.5),
      new THREE.MeshBasicMaterial({ map: getShadowTexture(), transparent: true, opacity: 0.6, depthWrite: false }));
    sh.rotation.x = -Math.PI / 2;
    sh.position.y = 0.008 - BOX_SIZE / 2; // no apoio (chão, mesa, estante)
    group.add(sh);
  }

  const center = new THREE.Vector3().fromArray(def.pos);
  const half = BOX_SIZE / 2;
  return {
    id: def.id,
    name: def.name || def.id,
    tutorial: !!def.tutorial,
    wires: def.wires || CONFIG.INTERACTION.WIRES_PER_BOX,
    group, body, lid, led, signal, normal, lidClosed,
    sparks, sparkData, glow, near: 0,
    center,
    aabb: new THREE.Box3(center.clone().subScalar(half), center.clone().addScalar(half)),
    state: 'closed', // closed | open | fixed
    openT: 0,
  };
}

// Atualiza animações das caixas (tampa abrindo, LED piscando, sinal girando,
// faíscas quando o jogador está perto). isHot(t) diz se a caixa vale agora.
function animateTargets(targets, dt, timeSec, playerPos = null, isHot = null) {
  for (const t of targets) {
    t.group.visible = !t.off;
    if (t.off) continue;
    // 0 = longe, 1 = colado na caixa
    let near = 0;
    if (playerPos && t.state !== 'fixed' && (!isHot || isHot(t))) {
      tmpV.set(playerPos.x, t.center.y, playerPos.z);
      near = Math.max(0, 1 - tmpV.distanceTo(t.center) / CONFIG.SPARKS.DIST);
    }
    t.near += (near - t.near) * Math.min(1, dt * 4);
    animateSparks(t, dt, timeSec);
    const goal = t.state === 'closed' ? 0 : 1;
    t.openT += Math.sign(goal - t.openT) * Math.min(Math.abs(goal - t.openT), dt * 3);
    const k = t.state === 'fixed' ? 0.25 : t.openT; // consertada: tampa quase fechada
    t.lid.position.copy(t.lidClosed).addScaledVector(t.normal, k * 0.22);
    t.signal.visible = t.openT > 0.05;
    t.signal.position.copy(t.normal).multiplyScalar(0.1 + 0.25 * t.openT);
    t.signal.rotation.y += dt * 2;
    t.signal.rotation.x += dt * 1.3;
    if (t.state === 'fixed') {
      t.led.material.color.setHex(0x22ff55);
      t.signal.material.color.setHex(0x22ff55);
      t.body.material.color.setHex(0x1e8f3a);
    } else {
      t.led.visible = Math.sin(timeSec * 8) > -0.2;
      t.led.material.color.setHex(0xff2222);
      t.signal.material.color.setHex(0xff4444);
      t.body.material.color.setHex(0x111111);
    }
    if (t.state === 'fixed') t.led.visible = true;
    else if (t.near > 0.05) {
      // perto: LED pisca mais rápido e cresce
      t.led.visible = Math.sin(timeSec * (8 + 16 * t.near)) > -0.4;
      t.led.scale.setScalar(1 + t.near * 0.8);
    } else t.led.scale.setScalar(1);
  }
}

function animateSparks(t, dt, timeSec) {
  const k = t.near;
  const on = k > 0.02;
  t.glow.visible = on;
  t.sparks.visible = on || t.sparks.material.opacity > 0.02;
  if (on) {
    const pulse = 0.5 + 0.5 * Math.sin(timeSec * (5 + 6 * k));
    t.glow.material.opacity = k * (0.25 + 0.45 * pulse);
    t.glow.scale.setScalar(1 + 0.15 * pulse * k);
  }
  t.sparks.material.opacity += ((on ? 0.6 + 0.4 * k : 0) - t.sparks.material.opacity) * Math.min(1, dt * 6);
  if (!t.sparks.visible) return;
  const arr = t.sparks.geometry.attributes.position.array;
  const half = BOX_SIZE / 2;
  t.sparkData.forEach((s, i) => {
    s.life -= dt * 1.6;
    if (s.life <= 0) {
      if (!on || Math.random() > 0.25 + 0.75 * k) { s.p.set(0, -999, 0); s.life = Math.random() * 0.4; }
      else {
        // nasce num ponto da face exposta e sai voando para fora
        s.p.copy(t.normal).multiplyScalar(half + 0.02);
        s.p.x += (Math.random() - 0.5) * BOX_SIZE * (1 - Math.abs(t.normal.x));
        s.p.y += (Math.random() - 0.5) * BOX_SIZE * (1 - Math.abs(t.normal.y));
        s.p.z += (Math.random() - 0.5) * BOX_SIZE * (1 - Math.abs(t.normal.z));
        s.v.copy(t.normal).multiplyScalar(0.6 + Math.random() * 0.8);
        s.v.x += (Math.random() - 0.5) * 1.4; s.v.y += Math.random() * 1.2; s.v.z += (Math.random() - 0.5) * 1.4;
        s.life = 0.35 + Math.random() * 0.45;
      }
    } else {
      s.v.y -= 3.5 * dt; // gravidade
      s.p.addScaledVector(s.v, dt);
    }
    arr[i * 3] = s.p.x; arr[i * 3 + 1] = s.p.y; arr[i * 3 + 2] = s.p.z;
  });
  t.sparks.geometry.attributes.position.needsUpdate = true;
}

// Piso claro em placas de 1 m, com rejunte e leve variação de tom.
function makeFloorTexture(tiles) {
  const S = 256, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const N = 4; // 4x4 placas por imagem
  const t = S / N;
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const v = 238 + Math.floor(Math.random() * 12);
      g.fillStyle = `rgb(${v},${v},${v - 3})`;
      g.fillRect(i * t, j * t, t, t);
      for (let k = 0; k < 60; k++) { // pontinhos (textura de concreto)
        const w = Math.random() * 10 - 5;
        g.fillStyle = `rgba(${120 + w * 8},${120 + w * 8},${120 + w * 8},0.06)`;
        g.fillRect(i * t + Math.random() * t, j * t + Math.random() * t, 2, 2);
      }
    }
  }
  g.strokeStyle = 'rgba(150,150,150,0.55)';
  g.lineWidth = 2;
  for (let i = 0; i <= N; i++) {
    g.beginPath(); g.moveTo(i * t, 0); g.lineTo(i * t, S); g.stroke();
    g.beginPath(); g.moveTo(0, i * t); g.lineTo(S, i * t); g.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(tiles / N, tiles / N);
  tex.anisotropy = 4;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

let shadowTexCache = null;
function getShadowTexture() { return shadowTexCache || (shadowTexCache = makeShadowTexture()); }

// Sombra suave (centro escuro, bordas transparentes).
function makeShadowTexture() {
  const S = 128, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(S / 2, S / 2, S * 0.18, S / 2, S / 2, S * 0.5);
  grd.addColorStop(0, 'rgba(0,0,0,0.55)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, S, S);
  return new THREE.CanvasTexture(c);
}

// ===== js/zombies.js =====
// Zumbis: bonecos feitos no código (sem arquivos), espalhados pela escola.
//  - parados balançando até verem/ouvirem o jogador (ou ouvirem um tiro);
//  - depois perseguem pelo caminho a pé (busca em largura na grade da escola);
//  - de perto, atacam (o jogador perde vida);
//  - tiro na cabeça mata na hora; no corpo precisa de ZOMBIES.HP tiros.

const Z = CONFIG.ZOMBIES;
const STEP = CONFIG.MAP.DEGRAU;
const SKINS = [0x7d9a6a, 0x8aa36f, 0x6f8c62, 0x9aa27a, 0x7c8f74];
const SHIRTS = [0x3b4f7a, 0x7a2f2f, 0xd8d8d0, 0x4c6b3c, 0x5a4a6e, 0x8a7a5a, 0x2f2f2f];
const PANTS = [0x2c3445, 0x3a3a3a, 0x4a3b2a, 0x1f2a3a];

const box = (w, h, d, y = 0) => { const g = new THREE.BoxGeometry(w, h, d); g.translate(0, y, 0); return g; };
const GEO = {
  leg: box(0.17, 0.9, 0.19, -0.45),
  torso: box(0.5, 0.62, 0.28, 0.31),
  head: box(0.27, 0.3, 0.27, 0.15),
  arm: box(0.13, 0.62, 0.13, -0.31),
  eye: box(0.06, 0.035, 0.02),
  mouth: box(0.12, 0.04, 0.02),
};
const EYE = new THREE.MeshBasicMaterial({ color: 0xff2a1a });
const DARK = new THREE.MeshBasicMaterial({ color: 0x1a0d0d });
const BLOOD = new THREE.MeshBasicMaterial({ color: 0x7a0a0a });
const pick = (a) => a[Math.floor(Math.random() * a.length)];

function makeZombie() {
  const skin = new THREE.MeshLambertMaterial({ color: pick(SKINS) });
  const shirt = new THREE.MeshLambertMaterial({ color: pick(SHIRTS) });
  const pants = new THREE.MeshLambertMaterial({ color: pick(PANTS) });
  const root = new THREE.Group();
  const body = new THREE.Group(); // tudo que inclina/cai

  const hips = new THREE.Group(); hips.position.y = 0.92; body.add(hips);
  const legL = new THREE.Mesh(GEO.leg, pants); legL.position.x = -0.12;
  const legR = new THREE.Mesh(GEO.leg, pants); legR.position.x = 0.12;
  hips.add(legL, legR);
  const torso = new THREE.Mesh(GEO.torso, shirt); torso.rotation.x = 0.18; hips.add(torso);
  const neck = new THREE.Group(); neck.position.set(0, 0.6, 0.06); torso.add(neck);
  const head = new THREE.Mesh(GEO.head, skin); neck.add(head);
  const eL = new THREE.Mesh(GEO.eye, EYE); eL.position.set(-0.065, 0.19, 0.14);
  const eR = new THREE.Mesh(GEO.eye, EYE); eR.position.set(0.065, 0.19, 0.14);
  const mouth = new THREE.Mesh(GEO.mouth, DARK); mouth.position.set(0, 0.07, 0.14);
  head.add(eL, eR, mouth);
  const stain = new THREE.Mesh(box(0.16, 0.14, 0.02), BLOOD); stain.position.set(0.1, 0.35, 0.145); torso.add(stain);
  const armL = new THREE.Group(); armL.position.set(-0.32, 0.55, 0); torso.add(armL);
  const armR = new THREE.Group(); armR.position.set(0.32, 0.55, 0); torso.add(armR);
  armL.add(new THREE.Mesh(GEO.arm, skin)); armR.add(new THREE.Mesh(GEO.arm, skin));
  const s = 0.92 + Math.random() * 0.16;
  root.scale.setScalar(s);
  return { root, body, hips, legL, legR, torso, neck, head, armL, armR, mats: [skin, shirt, pants], scale: s };
}

class Horde {
  constructor(scene, world, hooks = {}) {
    this.scene = scene;
    this.world = world;
    this.hooks = hooks;
    this.list = [];
    this.planned = 0;
    this.pending = 0;
    this.waveT = 0;
    this.waves = 0;
    this.flow = null;
    this._flowT = 0;
    this._groanT = 0;
    this._v = new THREE.Vector3();
    this._a = new THREE.Vector3();
    this._b = new THREE.Vector3();
  }

  // vivos = na escola + os que ainda vão chegar nas próximas ondas
  get alive() { return this.list.filter((z) => !z.dead && !z.dummy).length + this.pending; }
  get killed() { return this.list.filter((z) => z.dead && !z.dummy).length; }
  get total() { return this.planned; }

  clear() {
    for (const z of this.list) {
      this.scene.remove(z.m.root);
      for (const m of z.m.mats) m.dispose();
    }
    this.list = [];
    this.flow = null;
    this._flowAt = null;
    this.planned = 0;
    this.pending = 0;
    this.waveT = 0;
    this.waves = 0;
  }

  _add(x, y, z, opts = {}) {
    const m = makeZombie();
    m.root.position.set(x, y, z);
    m.root.rotation.y = opts.yaw ?? Math.random() * Math.PI * 2;
    this.scene.add(m.root);
    if (opts.scream) for (const mat of [m.mats[0]]) mat.color.setHex(0xb8c7a8); // pele mais pálida
    const zb = {
      m, hp: opts.hp ?? Z.HP, dead: false, deadT: 0, dummy: !!opts.dummy,
      alert: false, speed: Z.SPEED_MIN + Math.random() * (Z.SPEED_MAX - Z.SPEED_MIN),
      phase: Math.random() * 10, attackT: 0, hitT: 0, losT: Math.random() * 0.3, los: false,
      wander: 0, wanderYaw: Math.random() * 6.28, moving: 0,
      punches: 0, knock: null, animN: 0, animAcc: 0,
      flank: !opts.dummy && Math.random() < Z.FLANK_P, // v26: tenta pegar por trás
      groanT: 1 + Math.random() * 4, stepT: Math.random() * 0.5,
      scream: !!opts.scream, screamed: false,
    };
    this.list.push(zb);
    return zb;
  }

  // Partida: `count` zumbis no total. Alguns já estão espalhados pela escola
  // (longe da porta); o resto chega em ondas, de tempos em tempos,
  // nascendo escondidos a 15–35 m do jogador e já vindo atrás dele.
  spawnHorde(count, start) {
    this.planned = count;
    const first = Math.min(count, Z.START_COUNT);
    const pts = this._pick(this._cands(start), first, (p) => Math.hypot(p.x - start.x, p.z - start.z) >= Z.MIN_DIST_START);
    for (const p of pts) this._add(p.x, p.y, p.z);
    this.pending = count - pts.length;
    this.waveT = Z.FIRST_WAVE_S;
    this.waves = 0;
    return count;
  }

  _wave(player) {
    const n = Math.min(this.pending, Z.WAVE_SIZE);
    const eye = new THREE.Vector3(player.x, player.y + 1.5, player.z), to = new THREE.Vector3();
    const ok = (p, far) => {
      const d = Math.hypot(p.x - player.x, p.z - player.z);
      if (d < Z.WAVE_MIN_DIST || d > (far ? 80 : Z.WAVE_MAX_DIST)) return false;
      to.set(p.x, p.y + 1.5, p.z);
      return !!this.world.segmentHit(eye, to); // nasce escondido (parede no meio)
    };
    const c = this._cands(this.world.spawn);
    let pts = this._pick(c, n, (p) => ok(p, false));
    if (pts.length < n) pts = pts.concat(this._pick(c, n - pts.length, (p) => ok(p, true)));
    for (const p of pts) this._add(p.x, p.y, p.z).alert = true;
    this.pending -= pts.length;
    if (pts.length) { this.waves++; this.hooks.onWave && this.hooks.onWave(pts.length, this.pending); }
  }

  // Zumbi de treino (tutorial): parado, 1 tiro, não ataca.
  spawnDummy(pos, yawToPlayer) {
    return this._add(pos.x, pos.y, pos.z, { dummy: true, hp: 1, yaw: yawToPlayer });
  }

  // Lugares possíveis (alcançáveis a pé, dentro do muro). Calculado uma vez.
  _cands(start) {
    const w = this.world;
    if (w._zcand) return w._zcand;
    const cand = [];
    if (w.grid) {
      const g = w.grid;
      if (!w._reach) w._reach = g.reachable(start.x, start.z, 0.3);
      const seen = w._reach;
      for (let k = 0; k < seen.length; k += 3) {
        if (!seen[k]) continue;
        const i = k % g.W, j = (k / g.W) | 0;
        const x = g.x0 + (i + 0.5) * g.cell, z = g.z0 + (j + 0.5) * g.cell;
        const A = Z.AREA;
        if (A && (x < A[0] || x > A[1] || z < A[2] || z > A[3])) continue;
        if (!g.isFree(x, z, 0.35, g.floor[k])) continue;
        cand.push({ x, y: g.floor[k], z });
      }
    } else {
      const B = w.bounds || 19;
      for (let n = 0; n < 4000; n++) {
        const x = (Math.random() * 2 - 1) * B, z = (Math.random() * 2 - 1) * B;
        if (w.isFree(x, z, 0.4)) cand.push({ x, y: 0, z });
      }
    }
    w._zcand = cand;
    return cand;
  }

  // Sorteia até `count` lugares que passam no teste, afastados entre si e dos zumbis vivos.
  _pick(cand, count, test) {
    const out = [];
    const live = this.list.filter((z) => !z.dead).map((z) => z.m.root.position);
    const order = Array.from({ length: cand.length }, (_, i) => i);
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    for (let d = Z.SPREAD; d >= 2 && out.length < count; d *= 0.7) {
      let tries = 0;
      for (const i of order) {
        if (out.length >= count || ++tries > 4000) break;
        const p = cand[i];
        if (out.includes(p)) continue;
        if (!out.every((q) => Math.hypot(q.x - p.x, q.z - p.z) >= d)) continue;
        if (!live.every((q) => Math.hypot(q.x - p.x, q.z - p.z) >= 3)) continue;
        if (test(p)) out.push(p);
      }
    }
    return out;
  }

  // Tiro: todos perto escutam e vêm.
  alertAll(pos, radius) {
    for (const z of this.list) if (!z.dead && !z.dummy && z.m.root.position.distanceTo(pos) < radius) z.alert = true;
  }

  // Raio (o, d) contra os zumbis vivos. Retorna { zombie, part, dist, point } ou null.
  // Ajuda de mira: aceita até ASSIST_DEG de erro do centro do corpo.
  rayHit(o, d, range) {
    let best = null;
    const test = (z, cy, r, part) => {
      const c = this._a.copy(z.m.root.position); c.y += cy * z.m.scale;
      const oc = this._b.subVectors(c, o);
      const t = oc.dot(d);
      if (t < 0 || t > range) return;
      const d2 = oc.lengthSq() - t * t;
      if (d2 > r * r) return;
      const dist = t - Math.sqrt(r * r - d2);
      if (!best || dist < best.dist) best = { zombie: z, part, dist };
    };
    for (const z of this.list) {
      if (z.dead) continue;
      test(z, 1.72, 0.2, 'head');
      test(z, 1.2, 0.33, 'body');
      test(z, 0.5, 0.26, 'body');
    }
    if (!best) {
      // ajuda de mira
      const cos = Math.cos(THREE.MathUtils.degToRad(Z.ASSIST_DEG));
      for (const z of this.list) {
        if (z.dead) continue;
        const c = this._a.copy(z.m.root.position); c.y += 1.15 * z.m.scale;
        const oc = this._b.subVectors(c, o);
        const L = oc.length();
        if (L > range || L < 0.1) continue;
        if (oc.dot(d) / L < cos) continue;
        if (!best || L < best.dist) best = { zombie: z, part: 'body', dist: L - 0.3 };
      }
    }
    if (best) best.point = new THREE.Vector3().copy(o).addScaledVector(d, best.dist);
    return best;
  }

  // v19: o ponto p (mão, em metros) encosta em algum zumbi vivo?
  // Corpo = cápsula em pé (cintura até o pescoço) + cabeça. Retorna o zumbi ou null.
  touch(p, r = 0.04) {
    for (const z of this.list) {
      if (z.dead) continue;
      const q = z.m.root.position, s = z.m.scale;
      const dy = p.y - q.y;
      // cabeça
      if (Math.hypot(p.x - q.x, dy - 1.72 * s, p.z - q.z) < 0.2 * s + r) return { zombie: z, part: 'head' };
      // tronco e pernas
      if (dy > 0.2 * s && dy < 1.55 * s && Math.hypot(p.x - q.x, p.z - q.z) < 0.3 * s + r) return { zombie: z, part: 'body' };
    }
    return null;
  }

  // v19: soco/tapa. Precisa de MELEE.PUNCHES golpes para derrubar. Empurra o
  // zumbi para trás e atrasa a mordida dele um pouco. Retorna true se matou.
  punch(z, dir) {
    if (z.dead) return false;
    const M = CONFIG.MELEE;
    z.punches++;
    z.hitT = 0.15;
    z.alert = true;
    z.attackT = Math.max(z.attackT, M.STAGGER_S);
    if (dir) z.knock = { x: dir.x * M.KNOCK_SPEED, z: dir.z * M.KNOCK_SPEED };
    if (z.punches >= (z.dummy ? M.DUMMY_PUNCHES : M.PUNCHES)) {
      z.dead = true;
      z.deadT = 0;
      z.fallDir = Math.random() < 0.5 ? 1 : -1;
      return true;
    }
    return false;
  }

  // dano: retorna true se matou
  damage(z, part) {
    if (z.dead) return false;
    z.hp -= part === 'head' ? 99 : 1;
    z.hitT = 0.18;
    z.alert = true;
    if (z.hp <= 0) {
      z.dead = true;
      z.deadT = 0;
      z.fallDir = Math.random() < 0.5 ? 1 : -1;
      return true;
    }
    return false;
  }

  // Mapa de distâncias até o jogador (janela em volta dele): os zumbis descem
  // por ele, então contornam paredes e passam pelas portas.
  _buildFlow(p) {
    const g = this.world.grid;
    if (!g) { this.flow = null; return; }
    // células onde o corpo do zumbi cabe (folga das paredes); calculado uma vez
    if (!g._zok) {
      g._zok = new Uint8Array(g.W * g.H);
      for (let k = 0; k < g._zok.length; k++) {
        if (g.floor[k] === -Infinity) continue;
        const x = g.x0 + ((k % g.W) + 0.5) * g.cell, z = g.z0 + (((k / g.W) | 0) + 0.5) * g.cell;
        g._zok[k] = g.isFree(x, z, Z.RADIUS, g.floor[k]) ? 1 : 0;
      }
    }
    const R = Math.round(Z.FLOW_RADIUS / g.cell), S = 2 * R + 1;
    const ci = Math.floor((p.x - g.x0) / g.cell), cj = Math.floor((p.z - g.z0) / g.cell);
    const dist = this.flow && this.flow.S === S ? this.flow.dist : new Int16Array(S * S);
    const fy = this.flow && this.flow.S === S ? this.flow.fy : new Float32Array(S * S);
    const q = this.flow && this.flow.S === S ? this.flow.q : new Int32Array(S * S);
    dist.fill(-1);
    const k0 = g.key(p.x, p.z);
    if (k0 < 0) { this.flow = null; return; }
    let h = 0, t = 0;
    const L0 = R * S + R;
    dist[L0] = 0; fy[L0] = g.floor[k0] === -Infinity ? p.y : g.floor[k0]; q[t++] = L0;
    while (h < t) {
      const l = q[h++];
      const li = l % S, lj = (l / S) | 0;
      for (let n = 0; n < 4; n++) {
        const ni = li + (n === 0 ? 1 : n === 1 ? -1 : 0), nj = lj + (n === 2 ? 1 : n === 3 ? -1 : 0);
        if (ni < 0 || nj < 0 || ni >= S || nj >= S) continue;
        const nl = nj * S + ni;
        if (dist[nl] >= 0) continue;
        const gi = ci - R + ni, gj = cj - R + nj;
        if (gi < 0 || gj < 0 || gi >= g.W || gj >= g.H) continue;
        const gk = gj * g.W + gi;
        if (!g._zok[gk] || Math.abs(g.floor[gk] - fy[l]) > STEP) continue;
        dist[nl] = dist[l] + 1; fy[nl] = g.floor[gk]; q[t++] = nl;
      }
    }
    this.flow = { S, R, ci, cj, dist, fy, q };
  }

  // direção (dx, dz) para descer o mapa de distâncias, ou null
  _flowDir(x, z) {
    const F = this.flow, g = this.world.grid;
    if (!F) return null;
    const li = Math.floor((x - g.x0) / g.cell) - F.ci + F.R, lj = Math.floor((z - g.z0) / g.cell) - F.cj + F.R;
    if (li < 1 || lj < 1 || li >= F.S - 1 || lj >= F.S - 1) return null;
    let here = F.dist[lj * F.S + li];
    // célula do zumbi fora do mapa (encostado na parede): procura vizinho válido
    if (here < 0) here = 32767;
    let bd = here, bx = 0, bz = 0;
    for (let dj = -1; dj <= 1; dj++) {
      for (let di = -1; di <= 1; di++) {
        if (!di && !dj) continue;
        const v = F.dist[(lj + dj) * F.S + li + di];
        if (v < 0) continue;
        const c = v + (di && dj ? 0.4 : 0);
        if (c < bd) { bd = c; bx = di; bz = dj; }
      }
    }
    if (!bx && !bz) return null;
    const l = Math.hypot(bx, bz);
    return { x: bx / l, z: bz / l };
  }

  _free(x, z, y) {
    const w = this.world;
    return w.grid ? w.grid.isFree(x, z, Z.RADIUS, y) : w.isFree(x, z, Z.RADIUS);
  }

  _los(zp, player) {
    this._a.set(zp.x, zp.y + 1.4, zp.z);
    this._b.set(player.x, player.y + 1.4, player.z);
    return !this.world.segmentHit(this._a, this._b);
  }

  // v26: susto. Um zumbi rápido nasce ATRÁS do jogador (fora da visão), a
  // 2,5–4 m, e corre para pegar. Conta no total da partida.
  spawnScreamer(player, facing) {
    const back = new THREE.Vector3(-facing.x, 0, -facing.z).normalize();
    for (let d = Z.SCARE_SPAWN_MAX; d >= Z.SCARE_SPAWN_MIN; d -= 0.25) {
      for (const off of [0, 0.35, -0.35, 0.7, -0.7]) {
        const ca = Math.cos(off), sa = Math.sin(off);
        const x = player.x + (back.x * ca - back.z * sa) * d, zz = player.z + (back.x * sa + back.z * ca) * d;
        const y = this.world.floorAt(x, zz);
        if (y == null || Math.abs(y - player.y) > 0.5 || !this._free(x, zz, y)) continue;
        // precisa dar para chegar até o jogador (sem parede no meio)
        this._a.set(x, y + 1.2, zz); this._b.set(player.x, player.y + 1.2, player.z);
        if (this.world.segmentHit(this._a, this._b)) continue;
        const z = this._add(x, y, zz, { scream: true, yaw: Math.atan2(player.x - x, player.z - zz) });
        z.alert = true; z.speed = Z.SCARE_SPEED; z.flank = false;
        this.planned++;
        return z;
      }
    }
    return null;
  }

  update(dt, player, facing = null) {
    // ondas
    if (this.pending > 0) {
      this.waveT -= dt;
      if (this.waveT <= 0) { this._wave(player); this.waveT = Z.WAVE_EVERY_S; }
    }
    let chasing = 0;
    for (const z of this.list) if (!z.dead && z.alert) chasing++;
    this._flowT -= dt;
    // recalcula o caminho só se o jogador saiu do lugar (ou de tempos em tempos)
    if (chasing && this._flowT <= 0) {
      const moved = !this._flowAt || Math.hypot(player.x - this._flowAt.x, player.z - this._flowAt.z) > 0.5;
      if (moved || this._flowT < -3) { this._buildFlow(player); this._flowAt = { x: player.x, z: player.z }; this._flowT = Z.FLOW_EVERY_S; }
    }

    let nearest = Infinity;
    for (const z of this.list) {
      const r = z.m.root, p = r.position;
      if (z.dead) { this._animDeath(z, dt); continue; }
      const dx = player.x - p.x, dz = player.z - p.z;
      const dist = Math.hypot(dx, dz);
      if (!z.dummy) nearest = Math.min(nearest, dist);
      // percepção (linha de visão de vez em quando: é cara)
      z.losT -= dt;
      if (z.losT <= 0) { z.losT = 0.3; z.los = dist < Z.SIGHT && this._los(p, player); }
      if (!z.dummy && !z.alert && (dist < Z.HEAR || z.los)) { z.alert = true; this.hooks.onAlert && this.hooks.onAlert(z, dist); }

      // empurrão do soco: desliza para trás e para (sem atravessar parede)
      if (z.knock) {
        const nx = p.x + z.knock.x * dt, nz = p.z + z.knock.z * dt;
        if (this._free(nx, nz, p.y)) { p.x = nx; p.z = nz; }
        const k = Math.exp(-dt * 9);
        z.knock.x *= k; z.knock.z *= k;
        if (Math.hypot(z.knock.x, z.knock.z) < 0.05) z.knock = null;
      }
      let mx = 0, mz = 0, sp = 0;
      if (z.dummy) {
        // treino: só se vira para o jogador
      } else if (z.alert) {
        if (dist > Z.ATTACK_DIST * 0.85) {
          let dir = null;
          if (!(z.los && dist < 8)) dir = this._flowDir(p.x, p.z);
          if (dir) { mx = dir.x; mz = dir.z; sp = z.speed; } else if (z.los || !this.world.grid) { mx = dx / dist; mz = dz / dist; sp = z.speed; } else {
            // longe demais para o caminho calculado: vaga devagar em vez de travar na parede
            z.wander -= dt;
            if (z.wander <= 0) { z.wander = 2 + Math.random() * 3; z.wanderYaw = Math.atan2(dx, dz) + (Math.random() - 0.5) * 2; }
            mx = Math.sin(z.wanderYaw); mz = Math.cos(z.wanderYaw); sp = Z.WANDER_SPEED * 2;
          }
        }
        // v26: os que vêm "por trás": vendo o jogador de perto, dão a volta para
        // chegar pelas costas dele; e todo zumbi fora da visão anda mais rápido
        if (facing && !z.dummy) {
          const inView = dist > 0.01 && (-dx * facing.x - dz * facing.z) / dist > Math.cos(THREE.MathUtils.degToRad(Z.VIEW_HALF_DEG));
          z.behind = !inView;
          // "front": 1 = bem na sua frente · -1 = bem atrás. Enquanto não está
          // atrás, ele circula em volta (espiral), e só ataca pelas costas.
          const front = dist > 0.01 ? (-dx * facing.x - dz * facing.z) / dist : 1;
          if (z.flank && z.los && dist < Z.FLANK_DIST && dist > 0.9 && front > -0.6) {
            const rx = -dx / dist, rz = -dz / dist;            // do jogador até o zumbi
            let tx = -rz, tz = rx;                             // tangente: escolhe a que leva para trás
            if (tx * facing.x + tz * facing.z > 0) { tx = -tx; tz = -tz; }
            const k = THREE.MathUtils.clamp((dist - Z.FLANK_R) / 3, -0.6, 1); // longe: aproxima · perto: só circula
            const ax = tx - rx * k, az = tz - rz * k, al = Math.hypot(ax, az);
            if (al > 1e-3 && this._free(p.x + ax / al * 0.3, p.z + az / al * 0.3, p.y)) { mx = ax / al; mz = az / al; sp = z.speed * 1.15; }
          }
          if (!inView && sp > 0) sp *= Z.BEHIND_BOOST;
        }
        // susto: grita quando chega perto (ou quando o jogador vira e vê)
        if (z.scream && !z.screamed && (dist < Z.SCARE_DIST || (!z.behind && dist < 4.5))) { z.screamed = true; this.hooks.onScream && this.hooks.onScream(z); }
        // ataque
        z.attackT -= dt;
        if (dist < Z.ATTACK_DIST && Math.abs(player.y - p.y) < 1 && z.attackT <= 0) {
          z.attackT = Z.ATTACK_S;
          z.swing = 0.35;
          this.hooks.onHit && this.hooks.onHit(z);
        }
      } else {
        // vagando devagar
        z.wander -= dt;
        if (z.wander <= 0) { z.wander = 2 + Math.random() * 4; z.wanderYaw = Math.random() * 6.28; z.wanderGo = Math.random() < 0.5; }
        if (z.wanderGo) { mx = Math.sin(z.wanderYaw); mz = Math.cos(z.wanderYaw); sp = Z.WANDER_SPEED; }
      }
      // separação entre zumbis
      for (const o of this.list) {
        if (o === z || o.dead) continue;
        const ox = p.x - o.m.root.position.x, oz = p.z - o.m.root.position.z;
        const d = Math.hypot(ox, oz);
        if (d > 0.01 && d < 0.65) { mx += (ox / d) * 0.6; mz += (oz / d) * 0.6; }
      }
      const ml = Math.hypot(mx, mz);
      let moved = 0;
      if (sp > 0 && ml > 1e-3) {
        const step = (sp * dt) / ml;
        const nx = p.x + mx * step, nz = p.z + mz * step;
        const ox = p.x, oz = p.z;
        if (this._free(nx, nz, p.y)) { p.x = nx; p.z = nz; } else if (this._free(nx, p.z, p.y)) p.x = nx; else if (this._free(p.x, nz, p.y)) p.z = nz;
        else z.wander = 0;
        moved = Math.hypot(p.x - ox, p.z - oz) / dt;
        const f = this.world.floorAt(p.x, p.z);
        if (f != null) p.y += (f - p.y) * Math.min(1, dt * 10);
      }
      z.moving += (moved - z.moving) * Math.min(1, dt * 6);
      // v26: sons de cada zumbi (gemido e passos), saindo do lugar dele
      if (!z.dummy && dist < Z.SOUND_DIST) {
        z.groanT -= dt;
        if (z.groanT <= 0) { z.groanT = (z.alert ? 1.8 : 3.5) + Math.random() * 3; this.hooks.onGroanAt && this.hooks.onGroanAt(z, dist); }
        if (moved > 0.15) { z.stepT -= dt * (0.8 + moved); if (z.stepT <= 0) { z.stepT = 0.55; this.hooks.onStep && this.hooks.onStep(z, dist); } }
      }
      // vira para onde anda (ou para o jogador quando perto/parado)
      const face = z.alert || z.dummy || moved < 0.05 ? Math.atan2(dx, dz) : Math.atan2(mx, mz);
      if (z.alert || z.dummy || moved > 0.05) {
        let da = face - r.rotation.y;
        da = Math.atan2(Math.sin(da), Math.cos(da));
        r.rotation.y += da * Math.min(1, dt * 5);
      }
      // v24: zumbi longe anima 1 quadro sim, 2 não (ninguém vê o detalhe de longe)
      if (dist > Z.ANIM_FAR) {
        z.animAcc = (z.animAcc || 0) + dt;
        if (++z.animN % 3 === 0 || !z.animN) { this._animWalk(z, z.animAcc); z.animAcc = 0; }
      } else { if (z.animAcc) { this._animWalk(z, z.animAcc); z.animAcc = 0; } else this._animWalk(z, dt); }
    }
    // gemidos
    this._groanT -= dt;
    if (nearest < Z.GROAN_DIST && this._groanT <= 0) {
      this._groanT = 1.2 + Math.random() * 2.2;
      this.hooks.onGroan && this.hooks.onGroan(nearest);
    }
    this.nearest = nearest;
  }

  _animWalk(z, dt) {
    const m = z.m;
    const k = Math.min(1, z.moving / 0.6);
    z.phase += dt * (2.5 + z.moving * 5);
    const s = Math.sin(z.phase);
    m.legL.rotation.x = s * 0.55 * k;
    m.legR.rotation.x = -s * 0.55 * k;
    m.hips.position.y = 0.92 + Math.abs(Math.cos(z.phase)) * 0.04 * k;
    m.body.rotation.z = Math.sin(z.phase * 0.5) * 0.06 + 0.04;
    m.neck.rotation.z = Math.sin(z.phase * 0.7 + 1) * 0.25;
    m.neck.rotation.x = 0.15 + Math.sin(z.phase * 0.3) * 0.1;
    // braços esticados para frente (o clássico), com ataque
    let sw = 0;
    if (z.swing > 0) { z.swing -= dt; sw = Math.sin((1 - z.swing / 0.35) * Math.PI) * 0.9; }
    m.armL.rotation.x = -1.35 + Math.sin(z.phase + 0.5) * 0.15 + sw;
    m.armR.rotation.x = -1.4 + Math.sin(z.phase + 2.1) * 0.15 + sw;
    // pisca branco ao levar tiro
    if (z.hitT > 0) z.hitT -= dt;
    const fl = z.hitT > 0;
    for (const mat of m.mats) mat.emissive.setHex(fl ? 0x993333 : 0x000000);
  }

  _animDeath(z, dt) {
    const m = z.m;
    z.deadT += dt;
    const t = Math.min(1, z.deadT / 0.6);
    m.body.rotation.x = -t * t * 1.5 * z.fallDir;
    m.body.position.y = Math.sin(t * Math.PI) * 0.1;
    for (const mat of m.mats) mat.emissive.setHex(0x000000);
    if (z.deadT > Z.CORPSE_S) {
      m.root.position.y -= dt * 0.4; // afunda no chão e some
      if (z.deadT > Z.CORPSE_S + 1.5) m.root.visible = false;
    }
  }
}

// ===== js/gun.js =====
// Arma de mão: pistolinha = mira · abaixar o polegar = BANG.
//
//  👉 pistolinha (indicador esticado, polegar para cima): a arma está engatilhada
//     e a mão fica VERMELHA (pronta para atirar).
//  👍⬇ abaixar o polegar (como o cão de um revólver): atira.
//  Depois do tiro a mão fica CINZA enquanto recarrega; levante o polegar de
//  novo para engatilhar. Quando a mão volta a ficar vermelha, pode atirar.
//
// A mira vai do OLHO até os nós dos dedos (pontos estáveis da mão): basta
// "cobrir" o zumbi com a mão. Há uma pequena ajuda de mira (ângulo).

const G = CONFIG.GUN;

class Gun {
  constructor(scene, camera, world, hooks = {}) {
    this.camera = camera;
    this.world = world;
    this.hooks = hooks;
    this.state = 'off';      // off · cocking · ready · reload
    this.side = null;        // mão que está segurando a arma
    this.lastShot = -1e9;
    this.shots = 0;
    this.aiming = false;
    this._armed = false;
    this._lostAt = -1e9;
    this._o = new THREE.Vector3();
    this._d = new THREE.Vector3();
    this._sd = new THREE.Vector3();
    this._tip = new THREE.Vector3();
    this._k = new THREE.Vector3();

    // laser fino saindo do dedo + ponto vermelho onde a mira bate
    const lg = new THREE.BufferGeometry();
    lg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
    this.laserMat = new THREE.LineBasicMaterial({ color: 0xff2a2a, transparent: true, opacity: 0.7, depthWrite: false });
    this.laser = new THREE.Line(lg, this.laserMat);
    this.laser.frustumCulled = false;
    this.laser.visible = false;
    scene.add(this.laser);
    this.dotMat = new THREE.MeshBasicMaterial({ color: 0xff2a2a, depthTest: false, transparent: true });
    this.dot = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), this.dotMat);
    this.dot.renderOrder = 30;
    this.dot.visible = false;
    scene.add(this.dot);
    // clarão do tiro (na ponta do dedo) e risco da bala
    this.flash = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffd36b, transparent: true, depthWrite: false }));
    this.flash.visible = false;
    scene.add(this.flash);
    const tg = new THREE.BufferGeometry();
    tg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
    this.tracer = new THREE.Line(tg, new THREE.LineBasicMaterial({ color: 0xfff1a8, transparent: true, depthWrite: false }));
    this.tracer.frustumCulled = false;
    this.tracer.visible = false;
    scene.add(this.tracer);
    this._fxUntil = 0;

    // v18: barra de recarga em cima da mão vermelha (presa à câmera)
    this.bar = new THREE.Group();
    const bm = (c) => new THREE.MeshBasicMaterial({ color: c, depthTest: false, depthWrite: false, transparent: true });
    this.barBg = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), bm(0x111111));
    this.barBg.material.opacity = 0.7;
    this.barFill = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), bm(0x5be37d));
    this.barFill.geometry.translate(0.5, 0, 0);
    this.barBg.renderOrder = 45; this.barFill.renderOrder = 46;
    this.bar.add(this.barBg, this.barFill);
    this.bar.visible = false;
    camera.add(this.bar);
    this.pistol = false;
    this._pistolSince = 0;
    this._pistolSeen = -1e9;

    // v21: mira da CABEÇA = ponto no meio da visão (anel + pontinho)
    this.reticle = new THREE.Group();
    const rm = (c) => new THREE.MeshBasicMaterial({ color: c, depthTest: false, depthWrite: false, transparent: true });
    this.retRing = new THREE.Mesh(new THREE.RingGeometry(0.022, 0.03, 28), rm(0xffffff));
    this.retDot = new THREE.Mesh(new THREE.CircleGeometry(0.006, 12), rm(0xffffff));
    this.retRing.renderOrder = 47; this.retDot.renderOrder = 47;
    this.reticle.add(this.retRing, this.retDot);
    this.reticle.position.set(0, 0, -1.5);
    this.reticle.visible = false;
    camera.add(this.reticle);

    // v24: pistola 3D na mão da pistolinha (aponta para onde a mira está)
    this.model = new THREE.Group();
    const dark = new THREE.MeshLambertMaterial({ color: 0x2a2d31 });
    const grip = new THREE.MeshLambertMaterial({ color: 0x4a3a2c });
    const tip = new THREE.MeshBasicMaterial({ color: 0xff7a1a });
    const bx = (w, h, d, x, y, z, m) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); this.model.add(o); return o; };
    bx(0.03, 0.035, 0.17, 0, 0.012, 0.05, dark);      // ferrolho
    bx(0.026, 0.07, 0.035, 0, -0.035, -0.01, grip);   // cabo
    bx(0.008, 0.02, 0.03, 0, -0.012, 0.02, dark);     // guarda do gatilho
    bx(0.012, 0.012, 0.01, 0, 0.012, 0.137, tip);     // ponta laranja
    this.model.visible = false;
    scene.add(this.model);
    this._muzzle = new THREE.Vector3(0, 0.012, 0.145);
    this._aimAt = new THREE.Vector3();
  }

  // pistola na mão: entre os nós dos dedos e o pulso, apontando para a mira
  _placeModel(cur) {
    const P = cur.worldPts;
    this.model.position.copy(P[5]).add(P[9]).multiplyScalar(0.5).lerp(P[0], 0.25);
    this._aimAt.copy(this._o).addScaledVector(this._sd, 20);
    this.model.lookAt(this._aimAt);
    this.model.visible = true;
    // a ponta do cano vira o lugar do clarão e do risco do tiro
    this.model.updateMatrixWorld();
    this._tip.copy(this._muzzle).applyMatrix4(this.model.matrixWorld);
  }

  get headAim() { return G.AIM === 'cabeca'; }

  // v18: pistolinha pelos ângulos 3D da mão: indicador esticado (longe do
  // pulso) e médio dobrado (perto do pulso). Vale também o gesto 'gun'.
  _isPistol(h, thr) {
    if (!h || !h.visible || !h.wlm) return false;
    if (h.gesture === 'gun') return true;
    const r = this._reach(h);
    if (!r) return false;
    const f = h.features;
    const idxStraight = !f || f.straight[0] > thr.ext[0] - 0.12;
    return r.index > G.PISTOL_INDEX && r.middle < G.PISTOL_MIDDLE && r.index - r.middle > G.PISTOL_GAP && idxStraight;
  }

  // Modo 'auto' (v18): só a mão VERMELHA (papel 'gun') mira. Pistolinha
  // segurada = atira sozinho; recarrega RELOAD_MS (barra) e atira de novo.
  _updateAuto(now, hands, thr, fresh, manualFire, findHit) {
    if (this.headAim) return this._updateHead(now, hands, thr, manualFire, findHit);
    const cur = hands.find((h) => h.role === 'gun' && h.visible) || null;
    this.side = cur ? cur.side : null;
    // pistolinha com tolerância (se "piscar" por um instante, continua)
    let pistolNow = false;
    if (cur && cur.present) pistolNow = this._isPistol(cur, thr);
    if (pistolNow) {
      this._pistolSeen = now;
      if (!this.pistol) { this.pistol = true; this._pistolSince = now; this.hooks.onReady && this.hooks.onReady(); }
    } else if (this.pistol && (!cur || now - this._pistolSeen > G.GRACE_MS)) this.pistol = false;
    const reloadK = Math.min(1, (now - this.lastShot) / G.RELOAD_MS);
    this.state = !cur ? 'off' : reloadK < 1 ? 'reload' : 'ready';
    this.aiming = !!cur;
    if (cur) {
      const P = cur.worldPts;
      this.camera.getWorldPosition(this._o);
      // v20: mira para onde o DEDO aponta (com um pouco da direção olho→mão)
      if (this.aimFn) this.aimFn(cur, this._d);
      else { this._k.copy(P[5]).add(P[9]).multiplyScalar(0.5); this._d.subVectors(this._k, this._o).normalize(); }
      this._sd.lerp(this._d, G.AIM_SMOOTH).normalize();
      if (this._sd.lengthSq() < 0.5) this._sd.copy(this._d);
      this._tip.copy(P[8]);
      // o raio sai da ponta do dedo (o tiro vai para onde o laser mostra)
      this._o.copy(P[8]);
      this._hist = this._hist || [];
      this._hist.push({ t: now, d: this._sd.clone() });
      while (this._hist.length > 2 && now - this._hist[1].t > G.AIM_LAG_MS) this._hist.shift();
      if (this.pistol && reloadK >= 1 && now - this._pistolSince >= G.PISTOL_HOLD_MS) this._fire(now, cur, findHit);
    } else if (manualFire !== undefined) {
      this.camera.getWorldPosition(this._o);
      this.camera.getWorldDirection(this._sd);
      this._tip.copy(this._o).addScaledVector(this._sd, 0.4);
      this._tip.y -= 0.15;
    }
    if (manualFire && now - this.lastShot >= G.RELOAD_MS) this._fire(now, null, findHit);
    this._drawAim(now, findHit, !!(cur && this.pistol));
    // barra: em cima da mão vermelha
    this.bar.visible = !!cur;
    if (cur) {
      const P = cur.camPts;
      let top = P[0];
      for (const p of P) if (p.y > top.y) top = p;
      const k = Math.min(1, (now - this.lastShot) / G.RELOAD_MS);
      const w = 0.07, hgt = 0.009;
      this.bar.position.set(P[9].x, top.y + 0.03, P[9].z);
      this.barBg.scale.set(w + 0.004, hgt + 0.004, 1);
      this.barFill.position.x = -w / 2;
      this.barFill.scale.set(Math.max(0.001, w * k), hgt, 1);
      this.barFill.material.color.setHex(k < 1 ? 0xffb020 : this.pistol ? 0xff3030 : 0x5be37d);
    }
  }

  // v21 (AIM 'cabeca'): olha para o zumbi = mira; QUALQUER mão fazendo a
  // pistolinha atira sozinha a cada recarga. A barra fica embaixo da mira.
  _updateHead(now, hands, thr, manualFire, findHit) {
    // (findHit(o, d, true) = conferência completa das paredes, só na hora do tiro)
    // mão fazendo a pistolinha agora (prefere a mesma de antes)
    let ph = null;
    for (const h of hands) {
      if (this.onlySide && h.side !== this.onlySide) continue; // v22: só a mão da arma
      if (h.visible && h.present && this._isPistol(h, thr) && (!ph || h.side === this.side)) ph = h;
    }
    if (ph) {
      this.side = ph.side;
      this._pistolSeen = now;
      if (!this.pistol) { this.pistol = true; this._pistolSince = now; this.hooks.onReady && this.hooks.onReady(); }
    } else if (this.pistol && now - this._pistolSeen > G.GRACE_MS) { this.pistol = false; this.side = null; }
    const cur = this.pistol ? hands.find((h) => h.side === this.side && h.visible) || null : null;
    const reloadK = Math.min(1, (now - this.lastShot) / G.RELOAD_MS);
    const armed = this.pistol || !!this.trigger; // v25: gatilho do controle também
    this.state = !armed ? 'off' : reloadK < 1 ? 'reload' : 'ready';
    this.aiming = this.pistol;
    // mira = centro da visão
    this.camera.getWorldPosition(this._o);
    this.camera.getWorldDirection(this._sd);
    if (cur) this._tip.copy(cur.worldPts[8]); else this._tip.copy(this._o).addScaledVector(this._sd, 0.4).setY(this._o.y - 0.15);
    if (cur && G.SHOW_MODEL) this._placeModel(cur); else this.model.visible = false;
    if (this.pistol && reloadK >= 1 && now - this._pistolSince >= G.PISTOL_HOLD_MS) this._fire(now, null, findHit);
    if (manualFire && now - this.lastShot >= G.RELOAD_MS) this._fire(now, null, findHit);
    // mira: amarela em cima de zumbi, vermelha com a pistolinha, branca parada
    const hit = findHit(this._o, this._sd, false);
    const onZ = !!(hit && hit.zombie);
    const col = onZ ? 0xffe14d : armed ? 0xff3030 : 0xffffff;
    this.retRing.material.color.setHex(col);
    this.retDot.material.color.setHex(col);
    this.retRing.scale.setScalar(onZ ? 1.25 : 1);
    this.reticle.visible = true;
    this.laser.visible = false;
    this.dot.visible = false;
    // barra de recarga embaixo da mira
    this.bar.visible = true;
    const w = 0.09, hgt = 0.01;
    this.bar.position.set(0, -0.06, -1.5);
    this.barBg.scale.set(w + 0.005, hgt + 0.005, 1);
    this.barFill.position.x = -w / 2;
    this.barFill.scale.set(Math.max(0.001, w * reloadK), hgt, 1);
    this.barFill.material.color.setHex(reloadK < 1 ? 0xffb020 : armed ? 0xff3030 : 0x5be37d);
    const fx = now < this._fxUntil;
    this.flash.visible = fx && now < this._fxUntil - 60;
    this.tracer.visible = fx;
    if (fx) this.tracer.material.opacity = (this._fxUntil - now) / 110;
  }

  _drawAim(now, findHit, hot) {
    const show = this.aiming;
    this.laser.visible = show;
    this.dot.visible = show;
    if (show) {
      const hit = findHit(this._o, this._sd, false);
      const dist = hit ? hit.dist : G.RANGE;
      const end = this._k.copy(this._o).addScaledVector(this._sd, dist);
      const col = hot ? 0xff2a2a : 0xff8a8a;
      this.laserMat.color.setHex(col);
      this.laserMat.opacity = hot ? 0.85 : 0.35;
      this.dotMat.color.setHex(hit && hit.zombie ? 0xffee00 : col);
      const a = this.laser.geometry.attributes.position;
      a.setXYZ(0, this._tip.x, this._tip.y, this._tip.z);
      a.setXYZ(1, end.x, end.y, end.z);
      a.needsUpdate = true;
      this.dot.position.copy(end);
      this.dot.scale.setScalar(0.012 * Math.max(1, dist) + 0.01);
    }
    const fx = now < this._fxUntil;
    this.flash.visible = fx && now < this._fxUntil - 60;
    this.tracer.visible = fx;
    if (fx) this.tracer.material.opacity = (this._fxUntil - now) / 110;
  }

  get ready() { return this.state === 'ready'; }
  reloadLeft(now) { return Math.max(0, G.RELOAD_MS - (now - this.lastShot)); }

  // v16 (modo 'punho'): o quanto a mão está fechada, pelas pontas do indicador
  // e do médio até o pulso (em "palmos"). Aberta ~1,9 · fechada ~1,0.
  // Funciona de qualquer ângulo, inclusive com a mão apontando para frente
  // (de costas para a câmera), onde a pistolinha e o polegar falhavam.
  _reach(h) {
    const w = h.wlm;
    if (!w) return null;
    const d = (a, b) => Math.hypot(w[a].x - w[b].x, w[a].y - w[b].y, w[a].z - w[b].z);
    const palm = Math.max(d(0, 9), 1e-4);
    return { index: d(8, 0) / palm, middle: d(12, 0) / palm };
  }

  // Pistolinha pelo formato da mão (independe do polegar, que é o gatilho).
  _shape(h, thr) {
    const f = h.features;
    if (!h.visible || !f) return false;
    if (G.MODE === 'punho') return h.gesture !== 'open' && !this._isOpen(h);
    const k = G.SHAPE_SLACK;
    // indicador esticado e médio dobrado (anelar e mínimo não importam)
    return f.straight[0] > thr.ext[0] - k && f.straight[1] < thr.ext[1] + k * 0.5 && f.straight[0] - f.straight[1] > 0.12;
  }

  isGunHand(h, thr) { return this._shape(h, thr); }

  // mão aberta (todos os dedos longe do pulso) = é a mão de andar, não a arma
  _isOpen(h) {
    const r = this._reach(h);
    return !!r && r.index > G.OPEN_REACH && r.middle > G.OPEN_REACH;
  }

  // Cor da mão: vermelho = pronta · cinza = recarregando · null = normal
  tintFor(side, now) {
    if (side !== this.side || this.state === 'off') return null;
    return this.state === 'reload' ? 0x8a8f96 : 0xd4202a;
  }

  // hands: lista de mãos · fresh: houve detecção nova neste quadro
  // manualFire: botão/tecla de tiro · targets(): lista de alvos para a mira
  update(now, hands, thr, fresh, manualFire, findHit) {
    if (G.MODE === 'auto') return this._updateAuto(now, hands, thr, fresh, manualFire, findHit);
    // escolhe a mão da arma: a que está em pistolinha (prefere a mesma de antes)
    let hand = null;
    for (const h of hands) if (this._shape(h, thr) && (!hand || h.side === this.side)) hand = h;
    if (hand) { this.side = hand.side; this._lostAt = now; } else if (now - this._lostAt > G.GRACE_MS) { this.side = null; }
    const cur = this.side ? hands.find((h) => h.side === this.side && h.visible) : null;

    // Estados: 'reload' (cinza, só RELOAD_MS depois do tiro) -> 'ready' (vermelha).
    // O tiro sai quando o polegar DESCE depois de ter subido (armed): assim
    // segurar o polegar abaixado não fica atirando sem parar.
    if (!this.side || !cur) {
      this.state = 'off';
      this._armed = false;
    } else {
      if (this.state === 'off') { this.state = 'ready'; this._armed = false; }
      if (this.state === 'reload' && now - this.lastShot >= G.RELOAD_MS) {
        this.state = 'ready';
        this.hooks.onReady && this.hooks.onReady();
      }
      if (G.MODE === 'punho' && fresh && cur.present) {
        // fechar a mão = tiro; abrir um pouco (apontar) = engatilha de novo
        const r = this._reach(cur);
        if (r) {
          const k = Math.max(r.index, r.middle);
          if (k > G.ARM_REACH) this._armed = true;
          else if (k < G.FIRE_REACH && this._armed && this.state === 'ready') this._fire(now, cur, findHit, true);
        }
      } else if (fresh && cur.features) {
        const t = cur.features.thumbOut;
        if (t > thr.thumbOut * G.THUMB_UP_K) this._armed = true;
        else if (t < thr.thumbOut * G.THUMB_DOWN_K && this._armed && this.state === 'ready' && hand) this._fire(now, cur, findHit);
      }
    }

    // mira
    this.aiming = !!(cur && this.state !== 'off');
    if (this.aiming) {
      const P = cur.worldPts;
      this.camera.getWorldPosition(this._o);
      this._k.copy(P[5]).add(P[9]).multiplyScalar(0.5);
      this._d.subVectors(this._k, this._o).normalize();
      this._sd.lerp(this._d, 0.5).normalize();
      if (this._sd.lengthSq() < 0.5) this._sd.copy(this._d);
      // guarda a mira de um instante atrás: ao fechar a mão ela mexe um pouco
      this._hist = this._hist || [];
      this._hist.push({ t: now, d: this._sd.clone() });
      while (this._hist.length > 2 && now - this._hist[1].t > G.AIM_LAG_MS) this._hist.shift();
      this._tip.copy(P[8]);
    } else if (manualFire !== undefined) {
      // sem mão: mira no centro da visão (botão 🔫 / tecla espaço)
      this.camera.getWorldPosition(this._o);
      this.camera.getWorldDirection(this._sd);
      this._tip.copy(this._o).addScaledVector(this._sd, 0.4);
      this._tip.y -= 0.15;
    }
    if (manualFire && now - this.lastShot >= G.RELOAD_MS) this._fire(now, null, findHit);

    // laser e ponto
    const show = this.aiming;
    this.laser.visible = show;
    this.dot.visible = show;
    if (show) {
      const hit = findHit(this._o, this._sd, false);
      const dist = hit ? hit.dist : G.RANGE;
      const end = this._k.copy(this._o).addScaledVector(this._sd, dist);
      const col = this.state === 'ready' ? 0xff2a2a : 0x9aa0a6;
      this.laserMat.color.setHex(col);
      this.dotMat.color.setHex(hit && hit.zombie ? 0xffee00 : col);
      const a = this.laser.geometry.attributes.position;
      a.setXYZ(0, this._tip.x, this._tip.y, this._tip.z);
      a.setXYZ(1, end.x, end.y, end.z);
      a.needsUpdate = true;
      this.dot.position.copy(end);
      this.dot.scale.setScalar(0.012 * Math.max(1, dist) + 0.01);
    }
    // efeitos do tiro somem rápido
    const fx = now < this._fxUntil;
    this.flash.visible = fx && now < this._fxUntil - 60;
    this.tracer.visible = fx;
    if (fx) this.tracer.material.opacity = (this._fxUntil - now) / 110;
  }

  _fire(now, hand, findHit, lagged = G.MODE === 'auto' && !!hand) {
    if (lagged && this._hist && this._hist.length) this._sd.copy(this._hist[0].d);
    this.lastShot = now;
    this.state = 'reload';
    this._armed = false;
    this.shots++;
    const hit = findHit(this._o, this._sd, true);
    const dist = hit ? hit.dist : G.RANGE;
    const end = new THREE.Vector3().copy(this._o).addScaledVector(this._sd, dist);
    this.flash.position.copy(this._tip);
    this.flash.scale.setScalar(0.035);
    const a = this.tracer.geometry.attributes.position;
    a.setXYZ(0, this._tip.x, this._tip.y, this._tip.z);
    a.setXYZ(1, end.x, end.y, end.z);
    a.needsUpdate = true;
    this._fxUntil = now + 110;
    this.hooks.onShot && this.hooks.onShot(hit, end);
  }

  hide() {
    this.laser.visible = this.dot.visible = this.flash.visible = this.tracer.visible = false;
    this.state = 'off';
    this.side = null;
    this._hist = [];
    this.bar.visible = false;
    this.reticle.visible = false;
    this.model.visible = false;
    this.pistol = false;
  }
}

// ===== js/coach.js =====
// Dica no cantinho da tela: mostra os gestos o tempo todo, sem atrapalhar.
//   ✋ mão aberta = andar · 👉 pistolinha = mirar · 👍⬇ abaixar o polegar = atirar
// No tutorial, marca o passo atual; na partida, acende o gesto que está sendo feito.
// Aparece no canto (HTML) e, no óculos, num painel pequeno preso à visão (3D).

// v25: no modo controle
const COACH_PAD = [
  { id: 'walk', icon: '🕹', text: 'Analógico esq. = anda' },
  { id: 'aim', icon: '🎯', text: 'Olhe para o zumbi = mira' },
  { id: 'shoot', icon: '🔫', text: 'RT = atira · X = soco' },
];

const COACH_STEPS = [
  { id: 'walk', icon: '✋', text: 'Esquerda aberta = anda' },
  { id: 'aim', icon: '🎯', text: 'Olhe para o zumbi = mira' },
  { id: 'shoot', icon: '👉', text: 'Direita pistolinha = atira' },
];

class Coach {
  constructor(camera) {
    this.el = document.getElementById('coach');
    this.canvas = document.createElement('canvas');
    this.canvas.width = 512;
    this.canvas.height = 300;
    this.ctx = this.canvas.getContext('2d');
    this.tex = new THREE.CanvasTexture(this.canvas);
    this.tex.colorSpace = THREE.SRGBColorSpace;
    const mat = new THREE.MeshBasicMaterial({ map: this.tex, transparent: true, depthTest: false, depthWrite: false });
    this.mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.17, 0.0996), mat);
    this.mesh.position.set(-0.13, -0.085, -0.6);
    this.mesh.renderOrder = 51;
    this.mesh.visible = false;
    camera.add(this.mesh);
    this._key = '';
    this.visible = false;
  }

  // st: { show, stereo, title, cur, done:{walk,aim,shoot}, active:{walk,aim,shoot}, gun:'off'|'ready'|'reload', note }
  update(st) {
    this.visible = !!st.show;
    this.el.hidden = !st.show;
    this.mesh.visible = !!(st.show && st.stereo);
    if (!st.show) return;
    const key = JSON.stringify(st);
    if (key === this._key) return;
    this._key = key;
    // HTML (tela normal)
    const rows = (st.pad ? COACH_PAD : COACH_STEPS).map((s) => {
      const cls = [st.done[s.id] ? 'done' : '', st.cur === s.id ? 'cur' : '', st.active[s.id] ? 'act' : ''].join(' ');
      return `<div class="row ${cls}"><span class="ic">${s.icon}</span><span>${s.text}</span>${st.done[s.id] ? '<span class="ok">✔</span>' : ''}</div>`;
    }).join('');
    const gun = st.gun === 'ready' ? '<span class="gun ready">● arma pronta</span>' : st.gun === 'reload' ? '<span class="gun reload">● recarregando… (barra)</span>' : '';
    this.el.innerHTML = `${st.title ? `<div class="title">${st.title}</div>` : ''}${rows}${gun}${st.note ? `<div class="note">${st.note}</div>` : ''}`;
    if (st.stereo) this._draw(st);
  }

  _draw(st) {
    const c = this.ctx, W = this.canvas.width, H = this.canvas.height;
    c.clearRect(0, 0, W, H);
    c.fillStyle = 'rgba(10,6,6,0.66)';
    rr(c, 4, 4, W - 8, H - 8, 26); c.fill();
    c.textBaseline = 'middle';
    let y = 36;
    if (st.title) {
      c.fillStyle = '#ffd36b'; c.font = 'bold 30px system-ui, sans-serif'; c.textAlign = 'left';
      c.fillText(st.title, 22, y, W - 44); y += 46;
    }
    for (const s of (st.pad ? COACH_PAD : COACH_STEPS)) {
      const on = st.active[s.id], cur = st.cur === s.id;
      if (cur || on) { c.fillStyle = cur ? 'rgba(255,60,60,0.35)' : 'rgba(80,220,120,0.3)'; rr(c, 12, y - 26, W - 24, 52, 14); c.fill(); }
      c.font = '34px system-ui, sans-serif'; c.textAlign = 'left';
      c.fillStyle = '#fff';
      c.fillText(s.icon, 22, y);
      c.font = `${cur ? 'bold ' : ''}30px system-ui, sans-serif`;
      c.fillStyle = st.done[s.id] ? '#8fe3a8' : '#ffffff';
      c.fillText(s.text + (st.done[s.id] ? ' ✔' : ''), 98, y, W - 120);
      y += 58;
    }
    if (st.gun === 'ready' || st.gun === 'reload') {
      c.font = 'bold 28px system-ui, sans-serif';
      c.fillStyle = st.gun === 'ready' ? '#ff4040' : '#b0b4ba';
      c.fillText(st.gun === 'ready' ? '● pronta' : '● recarregando', 22, Math.min(y, H - 26));
    }
    this.tex.needsUpdate = true;
  }
}

function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// ===== js/orientation.js =====
// Rotação do celular -> rotação da câmera 3D.
// Usa RelativeOrientationSensor (Chrome Android, menor latência) e cai para
// DeviceOrientationEvent se não estiver disponível. No PC, arrastar o mouse gira.

const Q_WORLD = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2);
const Z_AXIS = new THREE.Vector3(0, 0, 1);
const Y_AXIS = new THREE.Vector3(0, 1, 0);
const DEG = Math.PI / 180;

class OrientationController {
  constructor(camera) {
    this.camera = camera;
    this.source = 'nenhum';
    this.deviceQ = new THREE.Quaternion();
    this.offset = new THREE.Quaternion();
    this.hasData = false;
    this.eventCount = 0;
    this.manualYaw = 0;
    this.manualPitch = 0;
    this._euler = new THREE.Euler();
    this._q0 = new THREE.Quaternion();
    this._fwd = new THREE.Vector3();
    this._onDO = this._onDeviceOrientation.bind(this);
  }

  // Precisa ser chamado a partir de um toque do usuário (iOS exige).
  async requestPermission() {
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const r = await DeviceOrientationEvent.requestPermission();
        if (r !== 'granted') return false;
      }
    } catch (e) { console.warn('Permissão de orientação:', e); return false; }
    return true;
  }

  async start(mode = 'auto') {
    this.stop();
    if (mode !== 'event' && 'RelativeOrientationSensor' in window) {
      const ok = await this._startSensor();
      if (ok) return this.source;
    }
    window.addEventListener('deviceorientation', this._onDO);
    this.source = 'deviceorientation';
    return this.source;
  }

  stop() {
    window.removeEventListener('deviceorientation', this._onDO);
    if (this.sensor) { try { this.sensor.stop(); } catch (e) { /* ignore */ } this.sensor = null; }
    this.hasData = false;
  }

  _startSensor() {
    return new Promise((resolve) => {
      let done = false;
      const finish = (ok) => { if (!done) { done = true; resolve(ok); } };
      try {
        const s = new RelativeOrientationSensor({ frequency: 60, referenceFrame: 'screen' });
        s.addEventListener('reading', () => {
          if (!s.quaternion) return;
          const [x, y, z, w] = s.quaternion;
          // Sensor: quaternion do aparelho em relação à Terra (Z para cima).
          // Three.js: Y para cima -> gira -90° em X.
          this.deviceQ.set(x, y, z, w).premultiply(Q_WORLD);
          this.hasData = true;
          this.eventCount++;
          finish(true);
        });
        s.addEventListener('error', (e) => { console.warn('Sensor falhou:', e.error); try { s.stop(); } catch (_) { /* */ } finish(false); });
        s.start();
        this.sensor = s;
        this.source = 'RelativeOrientationSensor';
        setTimeout(() => { if (!this.hasData) { try { s.stop(); } catch (_) { /* */ } this.sensor = null; finish(false); } }, 1200);
      } catch (e) {
        console.warn('Sensor indisponível:', e);
        finish(false);
      }
    });
  }

  _onDeviceOrientation(e) {
    if (e.alpha === null && e.beta === null && e.gamma === null) return; // PC sem sensor
    const alpha = (e.alpha || 0) * DEG;
    const beta = (e.beta || 0) * DEG;
    const gamma = (e.gamma || 0) * DEG;
    const orient = ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * DEG;
    // Fórmula clássica (antigo DeviceOrientationControls do three.js)
    this._euler.set(beta, alpha, -gamma, 'YXZ');
    this.deviceQ.setFromEuler(this._euler);
    this.deviceQ.multiply(this._q0.set(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)));
    this.deviceQ.multiply(this._q0.setFromAxisAngle(Z_AXIS, -orient));
    this.hasData = true;
    this.eventCount++;
  }

  // Faz a direção atual virar "frente" (-Z do mundo / do jogador).
  recenter() {
    if (this.hasData) {
      this._fwd.set(0, 0, -1).applyQuaternion(this.deviceQ);
      const yaw = Math.atan2(-this._fwd.x, -this._fwd.z);
      this.offset.setFromAxisAngle(Y_AXIS, -yaw);
    } else {
      this.manualYaw = 0;
      this.manualPitch = 0;
    }
  }

  // Arrastar com mouse/dedo (só quando não há sensor)
  addManual(dx, dy) {
    this.manualYaw -= dx * 0.005;
    this.manualPitch = THREE.MathUtils.clamp(this.manualPitch - dy * 0.005, -1.45, 1.45);
  }

  update() {
    if (this.hasData) {
      this.camera.quaternion.multiplyQuaternions(this.offset, this.deviceQ);
    } else {
      this._euler.set(this.manualPitch, this.manualYaw, 0, 'YXZ');
      this.camera.quaternion.setFromEuler(this._euler);
    }
  }
}

// ===== js/hands.js =====
// Rastreamento das mãos com MediaPipe Hand Landmarker (câmera traseira).
// - Atribui cada detecção à mão ESQUERDA ou DIREITA com estabilização
//   (rótulo do MediaPipe + continuidade de posição), para não trocar quando
//   a mão some por alguns quadros.
// - Recria a mão no espaço da câmera 3D (esqueleto de esferas e linhas),
//   usando a posição na imagem + estimativa de profundidade pelo tamanho.
// - Suaviza com filtro One Euro.

const MP_VERSION = '0.10.14';
const WASM_URL = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/wasm`;
const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const BUNDLE_CJS = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/vision_bundle.cjs`;

// Worker (thread separada): a detecção das mãos não trava mais o desenho da tela.
// Criado a partir de um Blob para funcionar também na versão em arquivo único.
const WORKER_SRC = `
let lm = null;
function opts(m, delegate) {
  return { baseOptions: { modelAssetPath: m.modelUrl, delegate }, runningMode: 'VIDEO', numHands: m.numHands,
    minHandDetectionConfidence: m.c1, minHandPresenceConfidence: m.c2, minTrackingConfidence: m.c3 };
}
self.onmessage = async (e) => {
  const m = e.data;
  if (m.type === 'init') {
    try {
      self.exports = {};
      importScripts(m.bundleUrl);
      const v = self.exports;
      const fs = await v.FilesetResolver.forVisionTasks(m.wasmUrl);
      let delegate = 'GPU';
      try { lm = await v.HandLandmarker.createFromOptions(fs, opts(m, 'GPU')); }
      catch (err) { delegate = 'CPU'; lm = await v.HandLandmarker.createFromOptions(fs, opts(m, 'CPU')); }
      postMessage({ type: 'ready', delegate });
    } catch (err) { postMessage({ type: 'error', message: String((err && err.message) || err) }); }
  } else if (m.type === 'frame') {
    let res = null;
    const t0 = performance.now();
    try { res = lm.detectForVideo(m.bitmap, m.ts); } catch (err) { /* quadro perdido */ }
    try { m.bitmap.close(); } catch (err) { /* */ }
    postMessage({ type: 'result', ms: performance.now() - t0, res: res && {
      landmarks: res.landmarks, worldLandmarks: res.worldLandmarks, handedness: res.handedness || res.handednesses } });
  }
};`;

const BONES = [
  [0, 1], [1, 2], [2, 3], [3, 4],
  [0, 5], [5, 6], [6, 7], [7, 8],
  [5, 9], [9, 10], [10, 11], [11, 12],
  [9, 13], [13, 14], [14, 15], [15, 16],
  [13, 17], [0, 17], [17, 18], [18, 19], [19, 20],
];

const H = CONFIG.HANDS;

class Hand {
  constructor(side) {
    this.side = side;            // 'left' | 'right' (mão real do jogador)
    this.visible = false;        // mostrar na tela (inclui tempo de tolerância)
    this.present = false;        // detectada no último quadro processado
    this.lastSeen = -1e9;        // ms
    this.lastC = { x: 0.5, y: 0.5 };
    this.lm = null;              // landmarks normalizados da imagem
    this.wlm = null;             // landmarks "world" (metros, centrados na mão)
    this.rawLabel = '';
    this.score = 0;
    this.rawDepth = 0;
    this.uv = { x: 0.5, y: 0.5 };
    this.camPts = Array.from({ length: 21 }, () => new THREE.Vector3());
    this.worldPts = Array.from({ length: 21 }, () => new THREE.Vector3());
    this.targetPts = Array.from({ length: 21 }, () => new THREE.Vector3()); // última detecção (filtrada)
    this.filters = Array.from({ length: 21 }, () => new OneEuro3(CONFIG.FILTER)); // forma dos dedos
    this.anchorFilter = new OneEuro3(CONFIG.FILTER_ANCHOR);  // posição da mão na tela
    this.depthFilter = new OneEuro(CONFIG.FILTER_DEPTH.MIN_CUTOFF, CONFIG.FILTER_DEPTH.BETA, CONFIG.FILTER_DEPTH.D_CUTOFF);
    this.rawDepthF = 0;
    this.snap = true;            // próxima atualização copia direto (sem deslizar)
    // preenchido por gestures.js
    this.features = null;
    this.gesture = 'none';
    this.gestureConf = 0;
    this.gestureSince = 0;
    this.candidate = 'none';
    this.candidateCount = 0;
    this.prevGesture = 'none';
  }
}

class HandTracker {
  constructor(calib) {
    this.calib = calib;
    this.video = document.getElementById('cam');
    this.landmarker = null;
    this.delegate = '';
    this.stream = null;
    this.lastVideoTime = -1;
    this.lastTs = 0;
    this.frame = 0;
    this.detectMs = 0;
    this.detectFps = 0;
    this._detCount = 0;
    this._detT0 = performance.now();
    this.lastResult = null;
    this.left = new Hand('left');
    this.right = new Hand('right');
    this.hands = [this.left, this.right];
    this._p = new THREE.Vector3();
  }

  get(side) { return side === 'left' ? this.left : this.right; }

  async startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('Este navegador não dá acesso à câmera (precisa de HTTPS).');
    }
    const video = { facingMode: { ideal: 'environment' }, width: { ideal: H.VIDEO_W }, height: { ideal: H.VIDEO_H }, frameRate: { ideal: 30 } };
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video });
    this.video.srcObject = this.stream;
    this.video.muted = true;
    this.video.setAttribute('playsinline', '');
    await this.video.play();
  }

  async loadModel(onStatus = () => {}) {
    if (H.USE_WORKER && typeof Worker !== 'undefined' && typeof createImageBitmap === 'function') {
      try { await this._initWorker(onStatus); return; } catch (e) {
        console.warn('Worker falhou, usando a thread principal', e);
        onStatus('Modo rápido indisponível, usando o modo normal…');
        if (this.worker) { this.worker.terminate(); this.worker = null; }
      }
    }
    await this._initMainThread(onStatus);
  }

  _initWorker(onStatus) {
    onStatus('Carregando modelo das mãos (modo rápido)…');
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }));
      const w = new Worker(url);
      this.worker = w;
      const timer = setTimeout(() => reject(new Error('tempo esgotado')), 45000);
      w.onerror = (e) => { clearTimeout(timer); reject(new Error(e.message || 'erro no worker')); };
      w.onmessage = (e) => {
        const m = e.data;
        if (m.type === 'ready') {
          clearTimeout(timer);
          this.delegate = `${m.delegate} worker`;
          this.landmarker = 'worker';
          w.onmessage = (ev) => this._onWorkerMessage(ev.data);
          resolve();
        } else if (m.type === 'error') { clearTimeout(timer); reject(new Error(m.message)); }
      };
      // endereços completos: o worker nasce de um Blob e não entende caminhos relativos
      // (o servidor local troca a CDN por /cdn/...)
      const abs = (u) => new URL(u, location.href).href;
      w.postMessage({ type: 'init', bundleUrl: abs(BUNDLE_CJS), wasmUrl: abs(WASM_URL), modelUrl: abs(MODEL_URL), numHands: H.NUM_HANDS,
        c1: H.MIN_DETECTION_CONF, c2: H.MIN_PRESENCE_CONF, c3: H.MIN_TRACKING_CONF });
    });
  }

  _onWorkerMessage(m) {
    if (m.type === 'result') { this._busy = false; if (m.res) this._workerResult = m; }
  }

  async _initMainThread(onStatus) {
    onStatus('Baixando MediaPipe…');
    const vision = await import('@mediapipe/tasks-vision');
    const fileset = await vision.FilesetResolver.forVisionTasks(WASM_URL);
    const opts = (delegate) => ({
      baseOptions: { modelAssetPath: MODEL_URL, delegate },
      runningMode: 'VIDEO',
      numHands: H.NUM_HANDS,
      minHandDetectionConfidence: H.MIN_DETECTION_CONF,
      minHandPresenceConfidence: H.MIN_PRESENCE_CONF,
      minTrackingConfidence: H.MIN_TRACKING_CONF,
    });
    onStatus('Carregando modelo das mãos (GPU)…');
    try {
      this.landmarker = await vision.HandLandmarker.createFromOptions(fileset, opts('GPU'));
      this.delegate = 'GPU';
    } catch (e) {
      console.warn('GPU falhou, usando CPU', e);
      onStatus('GPU indisponível, carregando em CPU…');
      this.landmarker = await vision.HandLandmarker.createFromOptions(fileset, opts('CPU'));
      this.delegate = 'CPU';
    }
  }

  // Chamar todo quadro, depois de atualizar a câmera 3D.
  // Retorna true se houve uma detecção nova neste quadro.
  update(nowMs, camera) {
    this.frame++;
    let fresh = this._pendingFresh || false;
    this._pendingFresh = false;
    const v = this.video;
    const minGap = 1000 / H.MAX_DETECT_HZ;
    // vigia: se o navegador pausou o vídeo da câmera, dá play de novo
    if (this.stream && v.paused && nowMs - (this._replayT || 0) > 1000) {
      this._replayT = nowMs;
      v.play().catch(() => {});
    }
    // v23: o vídeo está andando? Se o navegador parou o vídeo (acontece no
    // Android com o vídeo escondido, no óculos), pega a imagem DIRETO da
    // câmera (ImageCapture), sem depender do vídeo.
    if (this.stream && !this._vidT) this._vidT = nowMs; // vídeo que nunca começou também conta como parado
    if (v.currentTime !== this._lastCT) { this._lastCT = v.currentTime; this._vidT = nowMs; }
    this.stalled = !!this.stream && nowMs - (this._vidT || nowMs) > 400;
    if (this.stalled && !this._ic && typeof ImageCapture !== 'undefined') {
      try { this._ic = new ImageCapture(this.stream.getVideoTracks()[0]); } catch (e) { this._ic = null; }
    }
    this.frameSource = this.stalled ? (this._ic ? 'câmera direta' : 'vídeo parado') : 'vídeo';
    if (this.worker && this.landmarker && this.stalled && this._ic) {
      if (this._busy && nowMs - this._lastSend > 4000) this._busy = false;
      if (!this._busy && nowMs - (this._lastSend || 0) >= minGap) {
        this._busy = true;
        this._lastSend = nowMs;
        const ts = Math.max(nowMs, this.lastTs + 1);
        this.lastTs = ts;
        this._ic.grabFrame().then((full) => {
          const sc = Math.min(1, (this.maxSide || H.WORKER_MAX_SIDE) / Math.max(full.width, full.height));
          return createImageBitmap(full, { resizeWidth: Math.round(full.width * sc), resizeHeight: Math.round(full.height * sc), resizeQuality: 'low' })
            .then((bmp) => { try { full.close(); } catch (e) { /* */ } this._grabW = full.width; this._grabH = full.height; return bmp; });
        }).then((bmp) => this.worker.postMessage({ type: 'frame', bitmap: bmp, ts }, [bmp]))
          .catch(() => { this._busy = false; this._ic = null; });
      }
    }
    if (this.worker && this.landmarker && !this.stalled) {
      // ---- modo rápido: manda o quadro para o worker e segue desenhando ----
      if (this._busy && nowMs - this._lastSend > 4000) this._busy = false; // quadro perdido
      if (!this._busy && v.readyState >= 2 && v.currentTime !== this.lastVideoTime && nowMs - (this._lastSend || 0) >= minGap) {
        this._busy = true;
        this._lastSend = nowMs;
        this.lastVideoTime = v.currentTime;
        const ts = Math.max(nowMs, this.lastTs + 1);
        this.lastTs = ts;
        const vw = v.videoWidth, vh = v.videoHeight;
        const sc = Math.min(1, (this.maxSide || H.WORKER_MAX_SIDE) / Math.max(vw, vh));
        createImageBitmap(v, { resizeWidth: Math.round(vw * sc), resizeHeight: Math.round(vh * sc), resizeQuality: 'low' })
          .then((bmp) => this.worker.postMessage({ type: 'frame', bitmap: bmp, ts }, [bmp]))
          .catch(() => { this._busy = false; });
      }
      }
    if (this.worker && this.landmarker) {
      if (this._workerResult) {
        const m = this._workerResult;
        this._workerResult = null;
        this.detectMs = this.detectMs * 0.85 + m.ms * 0.15;
        this._process(m.res, nowMs, camera);
        this.lastResult = m.res;
        fresh = true;
        this._countDetection(nowMs);
      }
    } else if (this.landmarker && v.readyState >= 2 && v.currentTime !== this.lastVideoTime &&
        this.frame % H.DETECT_EVERY_N_FRAMES === 0 && nowMs - (this._lastSend || 0) >= minGap) {
      this._lastSend = nowMs;
      this.lastVideoTime = v.currentTime;
      const ts = Math.max(nowMs, this.lastTs + 1);
      this.lastTs = ts;
      const t0 = performance.now();
      let res = null;
      try { res = this.landmarker.detectForVideo(v, ts); } catch (e) { console.warn(e); }
      const ms = performance.now() - t0;
      this.detectMs = this.detectMs * 0.85 + ms * 0.15;
      if (res) { this._process(res, nowMs, camera); this.lastResult = res; fresh = true; }
      this._countDetection(nowMs);
    }

    // A detecção chega a 15–30/s e a tela roda a ~60: os pontos exibidos
    // deslizam até o alvo a cada quadro, para a mão não andar "aos pulos".
    const dt = Math.min(0.1, Math.max(0, (nowMs - (this._lastUpdate || nowMs)) / 1000));
    this._lastUpdate = nowMs;
    const k = 1 - Math.exp(-dt * H.FOLLOW_RATE);
    for (const h of this.hands) {
      h.visible = nowMs - h.lastSeen < H.LOST_GRACE_MS;
      if (!h.visible) { h.present = false; h.snap = true; continue; }
      for (let i = 0; i < 21; i++) {
        if (h.snap) h.camPts[i].copy(h.targetPts[i]); else h.camPts[i].lerp(h.targetPts[i], k);
        h.worldPts[i].copy(h.camPts[i]).applyMatrix4(camera.matrixWorld);
      }
      h.snap = false;
    }
